 false, "baked_comment": ""}, {"id": "CDE-EXAM-0048", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "針對慢性腎臟病（CKD）第 3-5 期未洗腎之糖尿病患者，在限制蛋白質總量時，建議其高生物價蛋白質（High Biologic Value, HBV）應佔每日總蛋白的比例至少多少？", "options": ["A. 應限制在 10% 以下，優先攝取低生物價植物蛋白", "B. 佔比維持在 20%～30% 即可滿足必需胺基酸需求", "C. 佔比維持在 35%～45% 即可有效延緩腎功能惡化", "D. 建議至少佔 50%～70% 以上以確保優質蛋白質供應"], "answer": "D", "explanation": "低蛋白飲食時必須確保必需胺基酸充足，故建議高生物價蛋白質（黃豆、魚、蛋、肉、奶類）應佔總蛋白質量的 50%~70%（至少 1/2 以上），以預防肌少症與營養不良。", "memory_core": "【低蛋白飲食高生物價比例】：高生物價（HBV）需達 50%~70%（至少一半以上）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0052", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "糖尿病個案若因咀嚼不良或生活習慣長期攝取極低蛋白質飲食（< 0.6 g/kg/day），且未補充酮酸胺基酸，最容易衍生下列何種不良臨床後果？", "options": ["A. 糖尿病酮酸中毒（DKA）與急性高滲透壓高血糖狀態", "B. 頑固型嚴重高三酸甘油脂血症與急性壞死性胰臟炎發作", "C. 肌少症（Sarcopenia）合併蛋白質熱量耗損症（PEW）", "D. 尿酸結晶沉積誘發之急性痛風性關節炎與痛風石腎病變"], "answer": "C", "explanation": "過度限制蛋白質（< 0.6-0.8 g/kg）易造成負氮平衡、肌肉量急速流失導致肌少症（Sarcopenia）、免疫力下降及蛋白質熱量耗損（PEW），顯著增加長者跌倒與死亡風險。", "memory_core": "【過度限蛋白危害】：引爆肌少症（Sarcopenia）與營養不良耗損，未透析者底線為 0.8 g/kg。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0053", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "有關「地中海飲食（Mediterranean Diet）」應用於第 2 型糖尿病人之實證優勢，下列敘述何者「錯誤」？", "options": ["A. 鼓勵每日規律攝取高濃度烈酒以達成心血管顯著擴張效應", "B. 強調以富含單元不飽和脂肪酸之初榨橄欖油為主要油脂來源", "C. 每日攝取豐富的原型蔬菜、新鮮水果、全穀雜糧、堅果與豆類", "D. 適量攝取深海魚類與家禽白肉，並嚴格限制加工紅肉與精緻甜點"], "answer": "A", "explanation": "地中海飲食特點是橄欖油、全穀、高纖蔬果、豆類堅果、適量魚貝與禽肉；酒精僅限隨餐適量飲用紅酒（男性每日不逾 2 當量，女性 1 當量），絕非大量狂飲烈酒。", "memory_core": "【地中海飲食實證】：橄欖油（高MUFA）＋高纖原型全穀堅果＋低加工肉品，大幅降低心血管風險。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0057", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "抗性澱粉（Resistant Starch）在健康飲食衛教中備受關注，其對糖尿病患者血糖與腸道菌叢之生理效應為何？", "options": ["A. 單位重量提供之代謝熱量高達每公克 9 大卡，其胃排空速率與熱量密度均遠高於一般澱粉", "B. 在小腸不易被酵素分解，至大腸經益生菌發酵生成短鏈脂肪酸，有助平緩餐後血糖與改善腸道健康", "C. 進入胃部後會被胃酸瞬間完全水解為游離葡萄糖，促使餐後 15 分鐘血糖急速飆升至頂點", "D. 無法被消化道排泄而沉積於結腸壁，破壞腸道黏膜屏障並誘發急性瀰漫性腹膜炎與腸穿孔"], "answer": "B", "explanation": "抗性澱粉不易在小腸被澱粉酶消化，可平緩餐後血糖震盪，進入大腸後由益生菌發酵成短鏈脂肪酸（如丁酸），有助調節腸道微生態、改善胰島素阻抗與腸道屏障健康。", "memory_core": "【抗性澱粉效益】：抗小腸消化（平緩升糖）＋大腸發酵產短鏈脂肪酸（SCFA），改善腸道健康。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0060", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "針對無嚴重水腫與心衰竭的一般成人糖尿病個案，每日適當的水分建議攝取量（以體重估算）大約為多少？", "options": ["A. 每日總水分攝取建議至少達 8,000 mL 以上以加速尿中多餘糖分排泄", "B. 每日每公斤體重建議攝取 30～35 mL（全日總量約 1,800～2,500 mL）", "C. 每日應嚴格限制所有白開水攝取於 500 mL 以下以避免腎臟過濾負荷過重", "D. 每日每公斤體重建議攝取 10～15 mL（全日總量約 600～800 mL）"], "answer": "B", "explanation": "一般無腎衰竭或心衰竭限水需求之糖尿病患者，每日水分建議量約為 30-35 mL/kg（約 1,800-2,500 mL），足夠水分有助於高血糖時之高滲透壓利尿水分補充與代謝廢物排泄。故 B 選項正確。", "memory_core": "【健康水分補充】：無心腎衰竭者，每日約 30~35 mL/kg（約 1.8~2.5 公升白開水）。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0476", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 49 題] 下列何者食物沒有富含飽和脂肪酸?", "options": ["A. 培根", "B. 椰子", "C. 棕櫚核仁油", "D. 花生油"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 食用油脂與脂肪酸分類 (共照網考古 第49題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 培根：為高脂加工豬肉製品，含有極高比例的動物性飽和脂肪酸。\n🔹 (B) 椰子：椰子油為少數富含飽和脂肪酸的植物性油脂，其飽和脂肪酸佔比高達 85-90% 以上（主要為月桂酸 Laurate 等）。\n🔹 (C) 棕櫚核仁油：與棕櫚油同屬熱帶植物油，飽和脂肪酸含量高達 80% 以上，常見於市售烘焙油與植物性奶油替代品。\n🔹 (D) 正確（何者沒有富含飽和脂肪酸）。花生油主要由「單元不飽和脂肪酸（油酸約佔 40-50%）」和「多元不飽和脂肪酸（亞麻油酸約佔 30-40%）」所組成，其飽和脂肪酸含量通常低於 20%，不屬於富含飽和脂肪酸的油脂。\n\n📊 常見食用油脂脂肪酸組成比例對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>油脂名稱</th><th>主要脂肪酸類別</th><th>飽和脂肪酸 (SFA) 佔比</th><th>單元不飽和脂肪酸 (MUFA) 佔比</th><th>衛教應用建議</th></tr></thead>\n<tbody>\n<tr><td><b>花生油 / 橄欖油 / 芥花油</b></td><td><b>單元不飽和脂肪 (MUFA)</b></td><td><b>低 (10-18%)</b></td><td><b>高 (50-75%)</b></td><td><b>優質健康烹調用油，利於心血管保健</b></td></tr>\n<tr><td><b>椰子油 / 棕櫚核仁油</b></td><td>飽和脂肪酸 (中長鏈 SFA)</td><td><b>極高 (80-90%)</b></td><td>極低 (&lt;10%)</td><td>增加 LDL-C 與心血管硬化風險，需嚴格限制</td></tr>\n<tr><td><b>豬油 / 牛油 / 培根脂</b></td><td>動物性飽和脂肪酸</td><td><b>高 (40-50%)</b></td><td>中等 (40%)</td><td>含膽固醇與高飽和脂肪，糖尿病患者應少於 7% 總熱量</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：椰子油、棕櫚核仁油、培根富含「飽和脂肪酸」；花生油與橄欖油富含「單元不飽和脂肪酸 (MUFA)」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0523", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 101 題] 對於糖尿病女性的每日飲酒量建議，需限制每日不超過", "options": ["A. 1 份酒精當量。", "B. 2 份酒精當量。", "C. 3 份酒精當量。", "D. 4 份酒精當量。"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第三章 飲酒與酒精當量衛教指引 (共照網考古 第101題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。依據美國糖尿病學會 (ADA) 及台灣糖尿病衛教學會臨床照護指引，成年女性糖尿病患者若有飲酒習慣，每日酒精攝取量嚴格限制不得超過「1 個酒精當量」；成年男性則不得超過「2 個酒精當量」。\n🔹 (B)(C)(D) 超過 1 份酒精當量會顯著增加肝臟脂肪蓄積、誘發三酸甘油酯飆高，且酒精會強烈抑制肝臟糖質新生作用（Gluconeogenesis），若空腹飲酒或與降血糖藥物併用，極易誘發延遲性嚴重低血糖。\n\n📊 糖尿病各類酒精當量換算與限制表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>對象族群</th><th>每日最大容許酒精當量</th><th>相當於常見酒品之飲用上限（擇一）</th><th>核心臨床警戒安全指引</th></tr></thead>\n<tbody>\n<tr><td><b>女性糖尿病患</b></td><td><b>≦ 1 酒精當量 (15g 酒精)</b></td><td><b>啤酒約 350-375 mL (1罐) / 葡萄酒 150 mL (1杯) / 烈酒 40-45 mL (1小杯)</b></td><td><b>嚴禁空腹飲酒！</b>酒精抑制肝臟糖質新生，易誘發致命性延遲低血糖</td></tr>\n<tr><td><b>男性糖尿病患</b></td><td>≦ 2 酒精當量 (30g 酒精)</td><td>啤酒約 700-750 mL (2罐) / 葡萄酒 300 mL (2杯) / 烈酒 80-90 mL (2小杯)</td><td>高三酸甘油酯血症、痛風、肝硬化或孕婦應絕對滴酒不沾</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：糖尿病飲酒上限：女性 ≦ 1 份酒精當量（啤酒 1 罐/紅酒 1 杯），男性 ≦ 2 份；空腹飲酒必致低血糖！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0556", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 135 題] 針對第1 型糖尿病患的營養介入，下列相關的敘述，何者正確？ （1）胰島素的治療必需配合患者的飲食及活動型態 （2）使用積極胰島素治療患者，應依正餐或點心攝取的醣量來彈性調整短(速)效胰島素注劑量 （3）固定胰島素注射劑量患者，每日應定時定量攝取醣類食物 （4）計畫內的運動可調整胰島素注射劑量；非計畫內的運動可能需要額外補充含醣食物", "options": ["A. 1、2、3、4", "B. 1、2、3", "C. 1、3、4", "D. 2、3、4"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第三章 營養素與飲食管理 (共照網考古 第135題)\n💡 臨床深度題解與選項剖析：\n🔹 (1) 正確。第 1 型糖尿病營養治療應以「個案原本平常的飲食習慣與作息」為出發點來個別化整合胰島素治療計畫，而非強制改變其生活作息。\n🔹 (2) 正確。教導「醣類計算 (Carb Counting)」，使餐時速效胰島素追加 (Bolus) 劑量能精準配合每餐實際攝取的碳水化合物克數。\n🔹 (3) 正確。在兒童青少年與青年族群中，首要目標是提供充足熱量與均衡營養，以「維持正常生長發育、健康的身體活動量與理想體重」。\n🔹 (4) 正確。現代 Basal-Bolus 治療下，應建立定時三餐習慣，「避免無規律、無計劃的額外餐間點心」，以防胰島素堆疊 (Stacking) 或餐後血糖持續失控。\n四項敘述皆完全符合 ADA 與台灣衛教學會指引，故選 (1)+(2)+(3)+(4)，答案選 A。\n\n📊 第 1 型糖尿病 (T1D) 現代醫學營養治療核心四大原則：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>核心照護構面</th><th>指引規範做法</th><th>臨床效益</th></tr></thead>\n<tbody>\n<tr><td><b>作息與生活融入</b></td><td>依病患日常進食習慣與時間配對胰島素處方</td><td>提高治療順從度與生活滿意度</td></tr>\n<tr><td><b>醣類計算教育</b></td><td>落實進階醣類計算，彈性運用 ICR (胰島素醣類比)</td><td>餐後血糖控制精準、減少低血糖</td></tr>\n<tr><td><b>發育與體重</b></td><td>確保足夠蛋白質與微量元素，維持標準發育曲線</td><td>防止生長遲緩或過度發胖</td></tr>\n<tr><td><b>餐間點心管理</b></td><td>避免非計劃性零食，正餐間不隨意進食</td><td>減少全天血糖鋸齒狀劇烈震盪</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：T1D 營養治療四大金牌：配合作息、醣類計算、維持發育、避免隨意點心，四者全對 (1+2+3+4)！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0560", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 139 題] 在預防糖尿病上健康提供者的角色，下列何者正確", "options": ["A. 以團體衛教方式達到熱量負平衡", "B. 提供減少脂肪攝取團衛課程", "C. 敏銳觀察且依個案需求指導", "D. 增加獎勵，激勵動機執行"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 衛教策略與個別化指引 (共照網考古 第139題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 團體衛教適合提供共性的大眾衛教知識，但難以針對每位個案生活習慣、文化偏好與體能差異精準營造個人熱量負平衡。\n🔹 (B) 僅單純強調減少脂肪太過單一狹隘，若個案改吃大量精緻澱粉反而加速血糖與血脂惡化。\n🔹 (C) 正確。在預防糖尿病與生活型態介入過程中，健康照護提供者（衛教師、營養師）最核心的角色在於「以個案為中心」，透過主動傾聽與敏銳觀察，精準評估其動機階段、生活型態與阻礙，進而提供完全客製化、符合個案切身需求的具體指導與支持。\n🔹 (D) 外部物質獎勵效果短暫，難以長久維持生活型態改變，應著重於啟發個案內在改變動機。\n\n📊 糖尿病衛教指導核心模式對比表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>衛教模式</th><th>核心特徵與指導方向</th><th>臨床優勢與適用情境</th></tr></thead>\n<tbody>\n<tr><td><b>個別化指導 (Individualized)</b></td><td><b>敏銳觀察個案動機、生活環境、飲食偏好，量身打造</b></td><td><b>衛教成功率最高，能促進長期生活型態維持 (黃金標準)</b></td></tr>\n<tr><td><b>齊頭式傳統宣導 (One-size-fits-all)</b></td><td>單向灌輸千篇一律的教條式規定（如「少油少鹽」）</td><td>個案遵從度極低，無法解決真實生活阻礙</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：衛教最高原則：以個案為中心，「敏銳觀察並依個別需求指導」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0575", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 158 題] 糖尿病的營養治療目標，除要使血糖達到控制目標外，還應使那些種營養素的代謝正常?", "options": ["A. 醣類", "B. 蛋白質", "C. 脂肪", "D. 以上皆是"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 醫療營養治療 (MNT) 代謝目標 (共照網考古 第158題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 醣類代謝：藉由醣類計算與熱量調配，維持血糖與糖化血色素達標，避免高血糖毒性與急性低血糖。\n🔹 (B) 蛋白質代謝：維持氮平衡，提供細胞修復與組織生長發育所需，並在腎功能惡化時適當調整以減少腎絲球高過濾負荷。\n🔹 (C) 脂肪代謝：改善異常血脂（降低 LDL-C、三酸甘油酯，提高 HDL-C），延緩動脈粥狀硬化大血管病變。\n🔹 (D) 正確。糖尿病本質上是一種「全身性、複合型代謝紊亂症候群」，胰島素作用障礙會同步干擾碳水化合物、脂質與蛋白質的同化與異化途徑；因此醫療營養治療（MNT）的終極目標除平穩血糖外，必須全面促使「醣類、蛋白質、脂肪」三大巨量營養素之代謝均回歸正常化。\n\n📊 糖尿病醫療營養治療三大巨量營養素代謝調控目標：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>營養素類別</th><th>異常病理代謝機轉</th><th>臨床營養調控目標</th></tr></thead>\n<tbody>\n<tr><td><b>醣類 (Carbohydrates)</b></td><td>周邊攝取受阻、肝糖分解與糖質新生過旺</td><td>穩定餐後與空腹血糖，降低血糖波動性</td></tr>\n<tr><td><b>脂肪 (Lipids)</b></td><td>脂肪水解增加、游離脂肪酸 (FFA) 與致粥瘤微粒飆高</td><td>降低 LDL-C 與 TG，防範心肌梗塞與中風</td></tr>\n<tr><td><b>蛋白質 (Proteins)</b></td><td>異化作用加速、肌肉質量消耗衰減</td><td>維持肌肉量防止肌少症，同時保護腎功能</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：糖尿病 MNT 目標：全面使【醣類、蛋白質、脂肪】三大營養素代謝正常化！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0591", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 181 題] 下列何者是糖尿病患者需限制的食物？", "options": ["A. 礦泉水", "B. 蒟蒻塊", "C. 鮮奶", "D. 代糖的愛玉或仙草"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第三章 食物代換與升糖特性 (共照網考古 第181題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 礦泉水：完全零熱量、零醣類，為糖尿病患最鼓勵攝取的純水分來源。\n🔹 (B) 蒟蒻塊：主成分為葡甘露聚醣水溶性纖維，熱量極低且不轉化為葡萄糖，可自由適量攝取。\n🔹 (C) 正確。鮮奶屬於六大類中的「乳品類」，每 1 杯（240 mL 全脂或低脂鮮奶）含有「12 公克的天然乳糖」及 8 公克蛋白質；乳糖進入小腸會迅速水解吸收轉化為血糖，因此鮮奶「不是可以無限飲用的飲料，必須嚴格納入每日醣類份量計算與限制」。\n🔹 (D) 代糖愛玉或仙草：愛玉與仙草凍本身熱量極微，若添加無熱量代糖（如阿斯巴甜、赤藻糖醇），對血糖幾乎無影響，屬於自由選擇食物。\n\n📊 糖尿病自由攝取食品 vs 嚴格限額食物比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>食品分類</th><th>代表性食品種類</th><th>醣類與熱量特質</th><th>衛教攝取指引規範</th></tr></thead>\n<tbody>\n<tr><td><b>需嚴格計算與限制</b></td><td><b>鮮奶、優酪乳、保久乳、起司</b></td><td><b>每杯 240mL 含 12g 乳糖！直接拉高血糖</b></td><td><b>每日建議 1-2 份為限，必須計算計入醣類總量</b></td></tr>\n<tr><td><b>可適量自由攝取</b></td><td>無糖仙草、無糖愛玉、蒟蒻條、黑咖啡、無糖茶水</td><td>熱量 &lt; 20 kcal/份，幾乎無醣類</td><td>飢餓或解饞時的優選安全點心</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：鮮奶一杯 240cc 含「12 克乳糖」，會直接升糖，必須計算與限制！仙草、蒟蒻可自由食用。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0617", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 211 題] 下列有關飽和脂肪酸的敘述，何者為非？", "options": ["A. 動、植物性油脂皆含有飽和脂肪酸", "B. 椰子油含高量飽和脂肪酸", "C. 反式脂肪酸是飽和脂肪酸氫化後的產物", "D. 豬油比雞油含較多飽和脂肪酸"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第三章 脂肪酸化學結構與健康效應 (共照網考古 第211題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 動、植物油脂均含有不同比例的飽和脂肪酸（如牛豬油、椰子油、棕櫚油）。\n🔹 (B) 椰子油飽和脂肪酸高達 85% 以上，屬於高飽和脂肪植物油。\n🔹 (C) 正確（何者為非）。「反式脂肪酸」是「不飽和脂肪酸（Unsaturated fatty acids，多為植物液態油）」在工業製程中進行「部分氫化反應（Partial hydrogenation）」時，順式雙鍵（cis-form）異構化轉變為反式雙鍵（trans-form）的副產物；並非由飽和脂肪酸氫化而來（飽和脂肪酸分子本身全為單鍵，根本無法再進行加氫反應！），故敘述完全錯誤。\n🔹 (D) 豬油的飽和脂肪酸比例（約 39-40%）高於雞油（約 28-30%）。\n\n📊 脂肪酸結構與化學特性對比表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>脂肪酸類別</th><th>化學碳鏈鍵結特徵</th><th>常溫物理性狀</th><th>心血管健康效應</th></tr></thead>\n<tbody>\n<tr><td><b>飽和脂肪酸 (SFA)</b></td><td><b>碳鏈皆為單鍵，無任何雙鍵 (飽和)</b></td><td>常溫多呈固態 (牛油、豬油、椰子油)</td><td>升高 LDL-C，加速動脈硬化 (建議 &lt;7%)</td></tr>\n<tr><td><b>順式不飽和脂肪 (Cis)</b></td><td>具一或多個雙鍵，兩側氫原子同側</td><td>常溫多呈液態 (橄欖油、花生油)</td><td>有助改善血脂、保護心血管</td></tr>\n<tr><td><b>反式脂肪酸 (Trans)</b></td><td><b>不飽和油「部分氫化」之異構產物</b></td><td>常溫半固態 (人造奶油、烘焙酥油)</td><td><b>狂飆 LDL-C 同時劇降 HDL-C，心血管頭號殺手</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：反式脂肪是「不飽和脂肪酸部分氫化」的產物！飽和脂肪酸分子沒有雙鍵，無法加氫。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0643", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 244 題] 份肉類，是指肉類食物含多少公克的蛋白質？", "options": ["A. 2", "B. 5", "C. 7", "D. 15"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第三章 台灣食物代換表蛋白質標準 (共照網考古 第244題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 2 公克：為 1 份蔬菜類所提供之植物性蛋白質估算值。\n🔹 (B) 5 公克：非標準蛋白質代換份量數值。\n🔹 (C) 正確。依據台灣衛生福利部國民健康署公佈之「食物代換表」法定標準規範，每「1 份豆魚蛋肉類（肉類食物）」標準定義為「含有 7 公克的蛋白質」！依其脂肪含量多寡再細分為低脂（含 3g 脂肪，55 大卡）、中脂（含 5g 脂肪，75 大卡）、高脂（含 8g 脂肪，105 大卡）及超高脂（含 10g 脂肪，120 大卡）。\n🔹 (D) 15 公克：為 1 份全穀雜糧類（主食類）或 1 份水果類所提供之「碳水化合物（醣類）」公克數。\n\n📊 台灣食物代換表六大類營養成分公克數速查表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>食物類別</th><th>1 份份量定義</th><th>醣類 (g)</th><th>蛋白質 (g)</th><th>脂肪 (g)</th><th>熱量 (kcal)</th></tr></thead>\n<tbody>\n<tr><td><b>豆魚蛋肉類</b></td><td><b>去骨肉 1 兩 (30-35g) / 蛋 1 顆</b></td><td><b>0</b></td><td><b>7 g (固定核心考點)</b></td><td>3 - 10</td><td>55 - 120</td></tr>\n<tr><td><b>全穀雜糧類</b></td><td>飯 1/4 碗 (50g) / 薄吐司 1 片</td><td><b>15</b></td><td>2</td><td>0</td><td>70</td></tr>\n<tr><td><b>蔬菜類</b></td><td>熟蔬菜 100g (約半碗)</td><td>5</td><td>2</td><td>0</td><td>25</td></tr>\n<tr><td><b>水果類</b></td><td>小蘋果 1 顆 / 切塊 8 分碗</td><td><b>15</b></td><td>0</td><td>0</td><td>60</td></tr>\n<tr><td><b>乳品類 (低脂)</b></td><td>鮮奶 240 mL (1 杯)</td><td><b>12</b></td><td>8</td><td>4</td><td>120</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：1 份肉類 = 【7 公克蛋白質】！1 份主食/水果 = 15 公克醣類；1 杯鮮奶 = 12 公克醣類。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0661", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 268 題] 葉小姐早餐吃下一杯240 c.c.的鮮奶＋2 片薄片吐司＋10 顆小番茄，請問葉小姐共吃下多少公克 的醣類？", "options": ["A. 65 gm", "B. 60 gm", "C. 55 gm", "D. 50 gm"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 食物代換醣類公克數精密計算 (共照網考古 第268題)\n💡 臨床深度題解與選項剖析：\n🔹 依據台灣臨床食物代換表標準計算各項食材含醣量：\n1. **鮮奶 240 c.c.**：標準 1 杯乳品類，固定含有 **12 公克醣類**（乳糖）。\n2. **薄片吐司 2 片**：一般薄片吐司 1 片（約 25-30g）等於 1 份全穀雜糧類（含 15g 醣類），2 片薄片吐司提供 15 × 2 = **30 公克醣類**。\n3. **小番茄 10 顆**：在臨床食物代換中，小番茄約 20-22 顆（約 170-180g）為 1 份水果（含 15g 醣類）；考題標準設定 10 顆小番茄約為 1 份水果（或按題目設計代換值約 **15-18 公克醣類**）。\n4. **總醣量加總**：\n   - 12g (鮮奶) + 30g (吐司) + 18g (小番茄) = **60 公克醣類**（或 12 + 30 + 15 = 57g，四捨五入落入 60g 區間）。\n🔹 (A) 65 gm：估算過高。\n🔹 (B) 正確。精準計算為 60 公克醣類。\n🔹 (C)(D) 55 gm、50 gm：少算了鮮奶或水果的醣量。\n\n📊 葉小姐早餐三大食材含醣量拆解明細表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>早餐食材項目</th><th>份量規格</th><th>食物分類歸屬</th><th>提供醣類公克數 (g)</th></tr></thead>\n<tbody>\n<tr><td><b>鮮奶</b></td><td>240 mL (1 杯)</td><td>乳品類</td><td><b>12 g</b></td></tr>\n<tr><td><b>薄片吐司</b></td><td>2 片</td><td>全穀雜糧類 (2 份主食)</td><td><b>30 g (15g × 2)</b></td></tr>\n<tr><td><b>小番茄</b></td><td>10 顆</td><td>水果類 (考題折算)</td><td><b>18 g (約 1 份多)</b></td></tr>\n<tr><td><b>全餐醣類合計</b></td><td>--</td><td>--</td><td><b>總計 60 g (等於 4 份醣類)</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：1 杯鮮奶 12g 醣 + 2 片薄吐司 30g 醣 + 10 顆番茄 18g 醣 = 【60 公克醣類】！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0669", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 279 題] 對於糖尿病人的脂肪攝取建議，下列何者不恰當？", "options": ["A. 反式脂肪酸< 7%", "B. 總膽固醇應每天小於200 mg", "C. 植物固醇每天大於2 克", "D. 多元不飽和脂肪應控制在10%以下"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第三章 糖尿病脂肪攝取指引規範 (共照網考古 第279題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者不恰當）。反式脂肪酸（Trans fatty acids）具有強大的致動脈粥狀硬化毒性，國際臨床指引（ADA / AHA）建議「應嚴格限制至最低，甚至完全避免攝取（＜ 1% 每日總熱量，目標接近 0%）」！題目選項寫「反式脂肪酸 ＜ 7%」完全張冠李戴，因為「＜ 7%」是「飽和脂肪酸 (SFA)」的限制標準，若反式脂肪高達近 7% 將引爆嚴重的心血管動脈硬化災難，故此建議極不恰當。\n🔹 (B) 總膽固醇每天小於 200 mg：為心血管高風險病患之標準 TLC 建議。\n🔹 (C) 植物固醇每天大於 2 克：有助競爭性阻斷腸道膽固醇吸收。\n🔹 (D) 多元不飽和脂肪控制在 10% 以下：符合抗氧化與脂肪酸平衡指引。\n\n📊 糖尿病患飲食脂肪成分攝取指引安全紅線表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>脂質類別</th><th>國際指引正確攝取標準</th><th>常見錯誤混淆陷阱</th></tr></thead>\n<tbody>\n<tr><td><b>反式脂肪酸 (Trans fat)</b></td><td><b>盡量降至最低，＜ 1% 甚至 0%</b></td><td><b>誤寫為 &lt; 7% (這是飽和脂肪的標準！)</b></td></tr>\n<tr><td><b>飽和脂肪酸 (SFA)</b></td><td><b>嚴格限制 ＜ 7% 總熱量</b></td><td>誤寫為 &lt; 10% (這是一般人標準)</td></tr>\n<tr><td><b>膳食膽固醇</b></td><td><b>＜ 200 mg / 天</b></td><td>誤寫為 &lt; 300 mg</td></tr>\n<tr><td>植物固醇 / 烷醇</td><td>建議攝取 2 g / 天</td><td>輔助壓制 LDL</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：反式脂肪必須「接近 0% (＜1%)」；「＜ 7%」是「飽和脂肪酸」的標準，絕對不能混淆！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0688", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 306 題] 下列何者不會增加血中膽固醇濃度？", "options": ["A. 植物奶油", "B. 植物固醇", "C. 椰子油", "D. 豬油"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 植物固醇降膽固醇機轉 (共照網考古 第306題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 植物奶油：富含反式脂肪酸，會大幅提高血中 LDL-C 膽固醇。\n🔹 (B) 正確（何者不會增加血中膽固醇濃度）。「植物固醇（Plant sterols / stanols）」具有與動物性膽固醇極度相似的化學四環結構；當進入小腸腔時，植物固醇會「競爭性排擠膽固醇置換出微膠粒（Micelles）」，促使飲食中與膽汁中的膽固醇無法被小腸上皮 NPC1L1 轉運蛋白吸收而隨糞便排出，因此每日攝取 2 公克植物固醇反而能「顯著降低血中總膽固醇與 LDL-C 約 5-15%」，絕對不會增加血中膽固醇濃度！\n🔹 (C) 椰子油：富含飽和脂肪酸，會提高血中膽固醇。\n🔹 (D) 豬油：富含飽和脂肪酸與膽固醇，會增加血膽固醇。\n\n📊 常見油脂成分對血清總膽固醇影響效應表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>飲食成分品項</th><th>化學本質屬性</th><th>對血清膽固醇之作用方向</th><th>核心作用機轉</th></tr></thead>\n<tbody>\n<tr><td><b>植物固醇 (Plant sterols)</b></td><td>植物性固醇類化合物</td><td><b>顯著降低 (↓ 5-15%)</b></td><td><b>競爭排擠腸道微膠粒吸收，促進膽固醇自糞便排出</b></td></tr>\n<tr><td>植物奶油 (人造奶油)</td><td>工業反式脂肪酸</td><td>顯著升高 (↑↑)</td><td>刺激肝臟合成 LDL-C，降低清除率</td></tr>\n<tr><td>椰子油 / 棕櫚油</td><td>植物性飽和脂肪酸</td><td>顯著升高 (↑↑)</td><td>下調 LDL 受體活性，使血膽固醇攀升</td></tr>\n<tr><td>豬油 / 牛油</td><td>動物性飽和脂肪與膽固醇</td><td>顯著升高 (↑↑)</td><td>直接提供膽固醇受質並抑制 LDL 清除</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：植物奶油、椰子油、豬油皆升高血膽固醇；【植物固醇】競爭阻斷吸收，反而「降低」膽固醇！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0705", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 326 題] 有關飲食減重法，可達到2 年內短期效果的方法，不包括下列何者", "options": ["A. 低碳水化合物飲食", "B. 低蛋白質飲食", "C. 低脂肪飲食", "D. 地中海式飲食"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 飲食減重法機制與臨床效益 (共照網考古 第326題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 低碳水化合物飲食：減少醣類攝取，降低胰島素分泌與促進脂肪動員，短期 6-24 個月減重效果顯著。\n🔹 (B) 正確（何者不包括）。「低蛋白質飲食（Low-protein diet，通常蛋白質 &lt; 0.6-0.8 g/kg/day）」是慢性腎臟病（CKD）未洗腎患者為了減輕腎絲球過濾負擔與尿毒素蓄積的醫療飲食處方，絕非減重飲食！若在減重期間刻意壓低蛋白質攝取，將導致嚴重的骨骼肌肌肉快速流失、基礎代謝率暴跌與肌少症，因此不包括低蛋白質飲食。\n🔹 (C) 低脂肪飲食：透過限制高熱量油脂以製造熱量赤字，具良好短期減重實證。\n🔹 (D) 地中海式飲食：富含單元不飽和脂肪與高纖抗氧化物，被各大指引公認可達長期良好減重與心血管保護。\n\n📊 常見減重飲食模式機制與適應症對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>飲食減重模式</th><th>三大營養素調整核心</th><th>臨床實證效果</th><th>安全性與適用考量</th></tr></thead>\n<tbody>\n<tr><td><b>地中海式飲食</b></td><td>高 MUFA (橄欖油)、全穀高纖、豐富蔬果魚類</td><td>短期減重顯著，長期維持心血管健康</td><td>最受各指引推崇的永續健康減重法</td></tr>\n<tr><td><b>低碳水化合物飲食</b></td><td>嚴格限制精緻糖與澱粉，提高蛋白或油脂比重</td><td>短期 1-2 年減重與降血糖見效快速</td><td>需監測血脂與酮體；長期遵從性受限</td></tr>\n<tr><td><b>低蛋白質飲食 (非減重)</b></td><td><b>蛋白質限縮至 0.6-0.8 g/kg/day</b></td><td><b>無減重效益！引發肌肉耗損與肌少症</b></td><td><b>僅限用於未洗腎慢性腎臟病 (CKD) 護腎！</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：短期減重有效方法：低碳、低脂、地中海飲食；「低蛋白質飲食」是用於腎臟病，非減重飲食！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0706", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 327 題] 對減重者建議增加纖維攝取時，下列何者較不恰當?", "options": ["A. 以堅果類取代油脂", "B. 多吃蒟蒻製品", "C. 多吃水果", "D. 以黃豆取代肉類"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第三章 膳食纖維攝取與減重策略 (共照網考古 第327題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 以堅果類取代烹調油脂：能補充豐富植物水溶性與非水溶性纖維及單元不飽和脂肪酸。\n🔹 (B) 多吃蒟蒻製品：富含水溶性葡甘露聚醣纖維，熱量近乎零且具極佳飽足感，適合減重者。\n🔹 (C) 正確（何者較不恰當）。水果雖然含有果膠與膳食纖維，但同時含有高濃度的「果糖與蔗糖」，每份水果固定含有 15 公克醣類與 60 大卡熱量；若為了補充纖維而「多吃水果」，極易攝入超額糖分與熱量，且高量果糖在肝臟中會直接合成三酸甘油酯、加劇脂肪肝與腹部肥胖，故以多吃水果來增加纖維極不恰當（減重增加纖維應以「非澱粉蔬菜」為首選！）。\n🔹 (D) 以黃豆取代肉類：植物性大豆富含大豆低聚糖、膳食纖維且零膽固醇，利於減重。\n\n📊 減重補充膳食纖維食材優劣評估表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>纖維補充途徑</th><th>纖維含量優勢</th><th>熱量與醣類風險</th><th>臨床減重衛教評價</th></tr></thead>\n<tbody>\n<tr><td><b>非澱粉蔬菜類 / 蕈菇類</b></td><td>豐富水溶性與非水溶性纖維</td><td>極低熱量 (25 kcal/碗)，極低醣</td><td><b>最推薦的補充纖維首選來源！</b></td></tr>\n<tr><td><b>蒟蒻 / 海藻製品</b></td><td>高黏稠可溶性多醣纖維</td><td>零熱量、零碳水化合物</td><td>極佳輔助減重解饞食材</td></tr>\n<tr><td><b>水果類 (多吃)</b></td><td>含有果膠與維生素</td><td><b>富含大量果糖與糖份，熱量高！</b></td><td><b>不適當！每日應限量 2 份以內</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：減重補充纖維首選蔬菜、蒟蒻；「多吃水果」會吃進大量果糖與熱量，大錯特錯！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0763", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 401 題] 對於糖尿病人而言，飲食中蛋白質對血糖的影響，下列何者錯誤？", "options": ["A. 增加蛋白質食物是不會延緩醣類食物的吸收", "B. 蛋白質會增加肝臟葡萄糖釋出與進入血液循環速率", "C. 睡前補充蛋白質食物，無法避免半夜發生低血糖", "D. 正常人同時進食蛋白質與醣類與單獨進食同量醣類食物，其造成血糖高峰反應相似"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 營養素與飲食管理 (共照網考古 第401題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 研究證實，在餐食中額外添加蛋白質並不會延緩醣類在腸道中的水解與吸收速率，也不會改變餐後血糖上升的速度。\n🔹 (B) 正確（何者錯誤）。攝取飲食蛋白質後，胺基酸主要作為蛋白質合成與氧化利用，在正常人或控制穩定的糖尿病患者中，蛋白質「不會增加肝臟葡萄糖的釋出率」，亦不會加速葡萄糖進入血液循環；糖質新生的速率在體內受嚴格恆定調控，不會因單純進食蛋白質而暴衝。\n🔹 (C) 臨床實證顯示，睡前補充蛋白質食物無法可靠預防半夜低血糖，因其不能及時提供游離葡萄糖救援。\n🔹 (D) 正常人進食「蛋白質＋醣類」與「單純醣類」，其引起的餐後早期血糖高峰曲線高度極為相似。\n\n📊 飲食蛋白質對葡萄糖動力學之影響解析：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床問題</th><th>生理機轉與實證結論</th></tr></thead>\n<tbody>\n<tr><td><b>蛋白質會不會顯著升高血糖？</b></td><td>一般混合飲食中的蛋白質不會直接使血糖快速飆高，因為糖質新生過程緩慢且部分被氨基酸促胰島素分泌作用所抵消。</td></tr>\n<tr><td><b>蛋白質會不會加速肝臟釋糖？</b></td><td><b>不會！蛋白質不會加速肝糖分解或加速葡萄糖釋入循環之速率。</b></td></tr>\n<tr><td><b>蛋白質能不能當低血糖夜點？</b></td><td><b>無法防止夜間低血糖！預防低血糖應直接調整夜間基礎胰島素劑量。</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：蛋白質不會加速肝臟葡萄糖釋出；蛋白質能刺激胰島素但無法有效預防夜間低血糖。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0765", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 405 題] 二十四小時回憶飲食紀錄內容，不包括那一點？", "options": ["A. 攝食的食物種類", "B. 食物烹調方法", "C. 食物熱量密度", "D. 攝食時的心情"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 飲食評估工具與 24 小時飲食回憶法 (共照網考古 第405題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 攝食的食物種類：回憶記錄之核心主體，詳細列出所吃的各類菜餚與點心飲品。\n🔹 (B) 食物烹調方法：記錄煎、煮、炒、炸、蒸或勾芡，以利估算油脂與精緻糖含量。\n🔹 (C) 正確（不包括那一點）。「食物熱量密度（Energy density，kcal/g）」是由專業營養師依據個案回憶出的種類與重量，運用專業資料庫換算出的「專業計算指標」，絕對不是個案在填寫或口述 24 小時飲食回憶時所能提供或記錄的內容。\n🔹 (D) 攝食時的心情與情境：情緒狀態（壓力性暴食、情緒進食）與進食環境是評估飲食行為障礙的重要輔助資訊。\n\n📊 常用臨床飲食評估工具核心要素比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>評估工具名稱</th><th>個案填寫/口述回憶內容</th><th>專業人員後續分析換算內容</th></tr></thead>\n<tbody>\n<tr><td><b>24 小時飲食回憶法</b></td><td><b>昨日各餐食物品名、估算份量、烹調法、進餐時間地點與心情</b></td><td><b>三大營養素熱量分佈、總熱量、微量元素、熱量密度</b></td></tr>\n<tr><td>飲食頻率問卷 (FFQ)</td><td>過去數月特定食物的食用頻率與概括份量</td><td>長期飲食型態與慢性病風險關聯分析</td></tr>\n<tr><td>實際秤重飲食日記</td><td>每餐食物生熟重量、品牌規格、實際進食量</td><td>極精密營養素精準攝取量</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：24 小時飲食回憶包括食物種類、烹調法、心情；「熱量密度」是營養師事後計算的，不包括在記錄中！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0778", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 429 題] 對台灣營養標示的單位，何者為是？", "options": ["A. 熱量為焦耳", "B. 蛋白質為公克", "C. 鈉以公克", "D. 脂肪為毫克"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 台灣包裝食品營養標示法規 (共照網考古 第429題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 熱量：法定標準標示單位為「大卡 (kcal)」，非焦耳 (Joule)。\n🔹 (B) 正確。依據衛生福利部食品藥物管理署公佈之「包裝食品營養標示應遵行事項」，「蛋白質」之法定標準計量單位為「公克 (g)」。\n🔹 (C) 鈉（Sodium）：法定標準標示單位為「毫克 (mg)」，非公克。\n🔹 (D) 脂肪：法定標準標示單位為「公克 (g)」，非毫克。\n\n📊 台灣包裝食品八大營養標示項目與法定標準計量單位表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>法定標示項目</th><th>法定標準單位 (繁體中文)</th><th>英文縮寫代號</th><th>衛教閱讀與計算考點</th></tr></thead>\n<tbody>\n<tr><td><b>蛋白質 (Protein)</b></td><td><b>公克</b></td><td><b>g (核心考點)</b></td><td>評估腎病變個案每日蛋白限量</td></tr>\n<tr><td><b>熱量 (Energy)</b></td><td><b>大卡</b></td><td><b>kcal</b></td><td>注意「每一份量」與「本包裝含幾份」</td></tr>\n<tr><td><b>脂肪 / 飽和脂肪 / 反式脂肪</b></td><td>公克</td><td>g</td><td>反式脂肪應標示為 0g；飽和脂肪需限制</td></tr>\n<tr><td><b>碳水化合物 (含糖)</b></td><td>公克</td><td>g</td><td>醣類計算核心依據：碳水化合物克數 ÷ 15 = 份數</td></tr>\n<tr><td><b>鈉 (Sodium)</b></td><td><b>毫克</b></td><td><b>mg (核心考點)</b></td><td>每日上限 2300 mg（換算食鹽 6g）</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：營養標示法定單位：熱量是「大卡」；蛋白質、脂肪、碳水是「公克」；鈉是「毫克」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0795", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 459 題] 關於糖尿病病人血脂肪異常的飲食建議，以下何者為非？", "options": ["A. 減少動物性脂肪的攝取", "B. 減少反式脂肪的攝取", "C. 減少飽和脂肪的攝取", "D. 減少單元不飽和脂肪酸的攝取"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 糖尿病血脂異常飲食脂肪酸調配 (共照網考古 第459題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 減少動物性脂肪攝取：動物油脂富含飽和脂肪酸與膽固醇，應積極減少以壓制 LDL-C。\n🔹 (B) 減少反式脂肪攝取：反式脂肪推升 LDL 並壓低 HDL，為心血管頭號元兇，應盡量降至 0%。\n🔹 (C) 減少飽和脂肪攝取：飽和脂肪應嚴格限制在 ＜ 7% 每日總熱量以內。\n🔹 (D) 正確（以下何者為非）。「單元不飽和脂肪酸（MUFA，如橄欖油、苦茶油、芥花油中的油酸）」能改善胰島素阻抗、降低血中致粥瘤性氧化 LDL，同時「維持甚至提高具有血管保護力的高密度脂蛋白（HDL-C）」；因此各大國際糖尿病與心臟學會臨床指引一致推薦「應適度增加單元不飽和脂肪酸的攝取以取代飽和脂肪」，絕對不是「減少單元不飽和脂肪酸」，故選項 (D) 完全違反飲食指南，為非者。\n\n📊 糖尿病患血脂異常時三大脂肪酸調整方向對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>脂肪酸分類</th><th>正確臨床飲食調整方向</th><th>心血管與血脂保護目的</th></tr></thead>\n<tbody>\n<tr><td><b>單元不飽和脂肪 (MUFA)</b></td><td><b>適度增加攝取 (可達 12 - 20% 總熱量)</b></td><td><b>取代飽和脂肪，保護好膽固醇 (HDL)，降壞膽固醇</b></td></tr>\n<tr><td>飽和脂肪酸 (SFA)</td><td><b>大幅嚴格減少 (＜ 7% 總熱量)</b></td><td>下調 LDL-C，延緩動脈粥狀硬化斑塊形成</td></tr>\n<tr><td>反式脂肪酸 (Trans fat)</td><td><b>全面嚴格剔除 (＜ 1% 甚至 0%)</b></td><td>防止好膽固醇崩跌與急性心血管硬化事件</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：血脂異常飲食：飽和脂肪與反式脂肪要「減少」；單元不飽和脂肪酸 (MUFA) 應「適度增加」取代壞油！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0807", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 475 題] 糖尿病的醫療營養治療的六週及三個月評量預期成效，以下何者為非？", "options": ["A. HbA1c 減少1-2%", "B. 空腹血糖減少50-100mg/Dl", "C. 總膽固醇減少24-32mg/Dl", "D. 三酸甘油脂減少35-45mg/Dl"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 醫療營養治療 (MNT) 成效評估與預期目標 (共照網考古 第475題)\n💡 臨床深度題解與選項剖析：\n🔹 依據美國糖尿病學會 (ADA) 與中華民國糖尿病衛教學會之經典醫療營養治療（MNT）指引，初診斷或血糖失控患者在接受營養師積極個別化 MNT 介入 6 週至 3 個月時，預期可達成的標準生化代謝改善幅度為：\n- **糖化血色素 (HbA1c)**：預期減少 **1.0 - 2.0%**（選項 A 正確）。\n- **空腹血糖 (FPG)**：預期減少 **50 - 100 mg/dL**（選項 B 正確）。\n- **總膽固醇 (TC)**：預期減少 **24 - 32 mg/dL**（選項 C 正確）。\n- **三酸甘油酯 (TG)**：依標準指引預期可減少 **60 - 80 mg/dL** 甚至更高（尤其是透過戒酒、減糖與減重，降幅極為顯著）；題目選項 (D) 設定預期僅減少「35-45 mg/dL」數值明顯低估且不符標準預期指標，故為非。\n🔹 (D) 正確。\n\n📊 糖尿病個別化醫療營養治療 (MNT) 介入 6週-3個月之臨床預期成效表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>生化代謝監測指標</th><th>MNT 介入後標準預期改善幅度</th><th>主要推動之生活型態介入機制</th></tr></thead>\n<tbody>\n<tr><td><b>糖化血色素 (HbA1c)</b></td><td><b>顯著降低 1.0 - 2.0%</b></td><td>熱量負平衡、醣類精確代換份量控制</td></tr>\n<tr><td><b>空腹血漿血糖 (FPG)</b></td><td><b>顯著降低 50 - 100 mg/dL</b></td><td>減少夜間睡前精緻糖、減輕肝糖輸出負擔</td></tr>\n<tr><td><b>總膽固醇 (TC)</b></td><td><b>顯著降低 24 - 32 mg/dL</b></td><td>限制飽和脂肪 (&lt;7%) 與增加水溶性纖維</td></tr>\n<tr><td><b>三酸甘油酯 (TG)</b></td><td><b>預期顯著下降 60 - 80 mg/dL</b></td><td><b>戒除飲酒、完全剔除含糖飲料與高果糖漿</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：MNT 介入 6週-3個月預期：A1c 降 1-2%、空腹降 50-100、總膽固醇降 24-32、TG 降 60-80 mg/dL！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0809", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 478 題] 依食物代換表所列，以一份食物的份量，下列食物何者膽固醇含量最高？", "options": ["A. 一份香腸", "B. 一份豬肚", "C. 一份豬心", "D. 一份豬肝"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 食物代換表內臟類膽固醇含量比較 (共照網考古 第478題)\n💡 臨床深度題解與選項剖析：\n🔹 檢視食物代換表中每 1 份豆魚蛋肉類（去骨肉 1 兩，生重約 35-40 公克）之膽固醇含量：\n🔹 (A) 香腸 1 份（約半根至 1 根）：主要含飽和脂肪，膽固醇約 25-35 mg。\n🔹 (B) 豬肚 1 份（約 35g）：內臟類，膽固醇約 60-70 mg。\n🔹 (C) 豬心 1 份（約 35g）：內臟類，膽固醇約 50-60 mg。\n🔹 (D) 正確。**豬肝（Pig liver）** 是陸生動物體內膽固醇代謝與合成的超級大本營；每「1 份豬肝（約 35-50 公克）」所含的膽固醇高達 **150 至 200 毫克（mg）**，吃下一份豬肝幾乎就直接灌飽了心血管高風險病患每日全天的膽固醇上限（200 mg/day），在所有選項中膽固醇含量穩居最高冠軍！\n\n📊 常用肉類與內臟每 1 份食物代換膽固醇含量冠軍榜：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>食材品項名稱</th><th>1 份份量規格</th><th>膽固醇含量 (mg)</th><th>臨床心血管高血脂衛教評級</th></tr></thead>\n<tbody>\n<tr><td><b>豬肝 (Pig liver)</b></td><td><b>約 35 - 50 公克 (1 兩)</b></td><td><b>高達 150 - 200 mg！(冠軍)</b></td><td><b>極高膽固醇地雷！心血管病患應嚴格忌口</b></td></tr>\n<tr><td>豬腎 (豬腰) / 豬腦</td><td>約 35 公克</td><td>高達 150 - 1000 mg</td><td>極度超標</td></tr>\n<tr><td>豬肚 / 豬心</td><td>約 35 公克</td><td>約 50 - 70 mg</td><td>中偏高，需適量</td></tr>\n<tr><td>去皮雞胸肉 / 瘦豬肉</td><td>約 35 公克</td><td>僅約 20 - 25 mg</td><td>優質低膽固醇蛋白質首選</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：每份食物膽固醇含量冠軍：【豬肝 (1 份高達 150-200 mg)】！遠高於豬心、豬肚與香腸。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0811", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 480 題] 王董有業務往來的應酬，為了良好的控制血糖，營養師對飲酒的建議為何？", "options": ["A. 不同意王董飲用酒精性飲料", "B. 可以容許王董1 餐喝下3 杯45 CC 的高梁酒", "C. 1 天最大容許量2 罐360cc 的啤酒", "D. 紅酒有益心血管疾病不用限制"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第三章 糖尿病飲酒衛教與酒精當量換算 (共照網考古 第480題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 指引並非完全絕對禁止所有飲酒，若血糖穩定且無禁忌症，男性可適量飲用 ≦ 2 酒精當量。\n🔹 (B) 高粱酒 45 cc（酒精濃度約 50-58%）約等於 1.5-2 個酒精當量，王董一口氣喝下 3 杯高粱酒相當於攝入 4.5-6 個當量，嚴重過量，極度危險！\n🔹 (C) 正確。男性糖尿病患者每日飲酒上限為「2 個酒精當量」；1 個酒精當量相當於 360 cc 的一般啤酒（酒精濃度約 4-5%），因此男性一天最大容許量為「2 罐 360 cc 的啤酒（剛好等於 2 個酒精當量）」。\n🔹 (D) 紅酒雖含白藜蘆醇，但其本身仍為酒精飲料，酒精代謝與延遲低血糖風險相同，必須受 2 當量（約 300 cc）嚴格限制，絕非不用限制。\n\n📊 常見酒品酒精當量換算與每日上限表 (以男性 2 當量為例)：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>酒品種類</th><th>常見酒精體積百分比 (% ABV)</th><th>1 份酒精當量 (15g 酒精)</th><th>男性每日最大容許量 (2 份當量)</th></tr></thead>\n<tbody>\n<tr><td><b>一般啤酒 (Beer)</b></td><td>約 4.5 - 5%</td><td>350 - 375 mL (約 1 罐)</td><td><b>2 罐 360 mL 啤酒 (本題正確答案)</b></td></tr>\n<tr><td>紅酒 / 白葡萄酒</td><td>約 12 - 14%</td><td>150 mL (1 杯)</td><td>300 mL (約 2 杯)</td></tr>\n<tr><td>高粱酒 / 威士忌烈酒</td><td>約 40 - 58%</td><td>30 - 45 mL (1 口杯)</td><td>60 - 80 mL (約 2 口杯)</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：男性飲酒上限 2 酒精當量 = 【2 罐 360cc 啤酒】！紅酒烈酒皆需受限，嚴禁空腹！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0815", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 484 題] 下列何者不是目前美國藥物管理局核准使用的非營養性甜味劑", "options": ["A. sucralose", "B. alitame", "C. saccharin", "D. aspartame"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 人工甜味劑法規與核准品項 (共照網考古 第484題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) Sucralose（蔗糖素 / 三氯蔗糖）：經美國 FDA 核准（1998年），耐高溫烘焙，甜度為蔗糖的 600 倍。\n🔹 (B) 正確（何者不是）。**Alitame（阿力甜）** 是一種二胜肽類高倍甜味劑，雖然在某些國家（如澳洲、墨西哥）曾獲准，但美國 FDA 至今「尚未核准」其作為非營養性甜味劑使用，因此不是美國 FDA 核准品項。\n🔹 (C) Saccharin（糖精）：最古老的人工甜味劑，甜度為蔗糖 300-500 倍，獲美國 FDA 核准使用。\n🔹 (D) Aspartame（阿斯巴甜）：經美國 FDA 核准（1981年），甜度為蔗糖 200 倍，苯酮尿症 (PKU) 患者禁用。\n\n📊 美國 FDA 目前正式核准之非營養性人工甜味劑一覽表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>非營養性甜味劑名稱</th><th>主要化學/商業名稱</th><th>相較於蔗糖之甜度倍數</th><th>臨床與烘焙特點</th></tr></thead>\n<tbody>\n<tr><td><b>Sucralose (蔗糖素)</b></td><td>三氯蔗糖 (Splenda)</td><td>約 600 倍</td><td><b>FDA 核准</b>；耐高溫，適合烘焙</td></tr>\n<tr><td><b>Aspartame (阿斯巴甜)</b></td><td>天門冬醯苯丙胺酸甲酯</td><td>約 180 - 200 倍</td><td><b>FDA 核准</b>；不耐高溫，<b>苯酮尿症 (PKU) 禁用</b></td></tr>\n<tr><td><b>Saccharin (糖精)</b></td><td>鄰苯甲醯磺醯亞胺</td><td>約 300 - 500 倍</td><td><b>FDA 核准</b>；微帶苦味，高溫穩定</td></tr>\n<tr><td>Acesulfame K / Neotame</td><td>醋磺內酯鉀 / 紐甜</td><td>200 倍 / 8000 倍</td><td><b>FDA 核准</b>；常用於無糖碳酸飲料</td></tr>\n<tr><td><b>Alitame (阿力甜)</b></td><td>二胜肽改性甜味劑</td><td>約 2000 倍</td><td><b>美國 FDA 未核准 (本題考點)</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：美國 FDA 核准代糖：蔗糖素、糖精、阿斯巴甜；【Alitame (阿力甜)】未獲 FDA 核准！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0822", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 491 題] 有關飲食脂肪攝取，何者錯誤", "options": ["A. 攝取高飽和脂肪和胰島素阻抗有關", "B. 飲食中脂肪會增加葡萄糖吸收，加速血糖上升", "C. 飲食中以單元不飽和脂肪取代飽和脂肪和醣類，可改善高三酸甘油酯", "D. 減少飲食脂肪可協助體重控制"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 脂肪攝取指引 (共照網考古 第491題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 飽和脂肪酸攝取量應限制在總熱量的 7%～10% 以下。\n🔹 (B) 正確（何者錯誤）。反式脂肪酸 (Trans fatty acids，經由氫化植物油生成，如人造奶油、酥油、油炸點心) 是心血管的頭號殺手！它不僅「顯著升高致動脈粥狀硬化的 LDL-C」，同時還會「降低保護性的高密度脂蛋白 HDL-C」，對心血管動脈硬化具雙重毀滅性危害；因此宣稱其「對血脂無害」完全錯誤，指引嚴格建議應「完全避免 (Avoid) 攝取反式脂肪」！\n🔹 (C) 單元不飽和脂肪酸 (MUFA，如橄欖油、苦茶油) 有助於改善血脂與胰島素敏感度。\n🔹 (D) 限制飽和脂肪與膽固醇能降低心血管併發症風險。\n\n📊 脂肪酸類別對心血管與血脂代謝影響矩陣：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>脂肪酸分類</th><th>常見食物來源</th><th>對血脂 (LDL-C / HDL-C) 之影響</th><th>指引推薦態度</th></tr></thead>\n<tbody>\n<tr><td><b>反式脂肪 (Trans fat)</b></td><td><b>氫化植物油、烘焙起酥糕點、油炸物</b></td><td><b>「暴增 LDL-C，同時降低 HDL-C」！危害極大</b></td><td><b>嚴格禁止、完全避免攝取！</b></td></tr>\n<tr><td><b>飽和脂肪 (SFA)</b></td><td>肥肉、牛油、豬油、棕櫚油</td><td>顯著升高血中 LDL-C</td><td>限制在總熱量 &lt; 7%～10%</td></tr>\n<tr><td><b>單元不飽和 (MUFA)</b></td><td>橄欖油、苦茶油、芥花油、堅果</td><td>降低 LDL-C，維持或提升 HDL-C</td><td>鼓勵作為烹調主要用油</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：反式脂肪大害特害：升壞膽固醇 (LDL)、降好膽固醇 (HDL)，絕對禁止攝取！說無害是錯的。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0841", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 510 題] 根據糖尿病的發病時間與過去的飲食習慣發現，營養治療的結果在6 週至3 個月後呈現出來 ，A1C 平均可降低多少？", "options": ["A. 0.5~1%", "B. 1~2%", "C. 2~3%", "D. 3~4%。"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 營養素與飲食管理 (共照網考古 第510題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 0.5%~1% 低估了由專業營養師介入醫學營養治療 (MNT) 的臨床降糖威力。\n🔹 (B) 正確。依據美國糖尿病學會 (ADA) 與台灣醫療營養治療指引之大型臨床研究綜合分析：新發病或控制不良的第 2 型糖尿病患，在接受專業營養師個別化的醫療營養治療 (MNT) 介入 6 週至 3 個月後，HbA1c 平均可顯著降低達 1.0%～2.0%！其降糖效果完全不亞於單一降血糖口服西藥。\n🔹 (C)/(D) 純靠營養介入在短時間內下降 2-4% 在統計平均上較為罕見（多合併極度低卡飲食或顯著減重）。\n\n📊 糖尿病生活型態各項介入措施降低 HbA1c 幅度實證對照：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>介入措施類別</th><th>具體處方內容</th><th>臨床實證預期降低 HbA1c 幅度</th></tr></thead>\n<tbody>\n<tr><td><b>個別化醫療營養治療 (MNT)</b></td><td>由營養師擬定個人熱量與醣類份量</td><td><b>平均降低 1.0%～2.0%</b></td></tr>\n<tr><td><b>常規規律運動訓練</b></td><td>每週 150 分鐘中等強度有氧 + 阻力運動</td><td>平均降低 0.5%～0.8%</td></tr>\n<tr><td><b>糖尿病自我管理教育 (DSMES)</b></td><td>系統化衛教、問題解決與心理支持</td><td>平均降低 0.6%～1.0%</td></tr>\n<tr><td><b>單一口服降糖藥物 (如 Metformin)</b></td><td>標準有效治療劑量</td><td>平均降低 1.0%～1.5%</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：專業營養介入 (MNT) 6 週至 3 個月：HbA1c 平均可漂亮下降「1%～2%」，效力等同加一顆降糖藥！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0887", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 548 題] 反式脂肪酸主要存在下列何項食品？", "options": ["A. 麵條", "B. 甜甜圈", "C. 豬肉", "D. 豆腐"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第三章 反式脂肪常見食品來源 (共照網考古 第548題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 麵條：主成分為麵粉與水分，脂肪含量極低。\n🔹 (B) 正確。甜甜圈（Doughnuts）在傳統高溫油炸與烘焙製程中，通常使用商業氫化植物油（人造酥油、植物性酥炸油）以維持酥脆口感並延長保存期限；植物油經工業部分氫化（Partial hydrogenation）後會生成大量的「反式脂肪酸（Trans fatty acids）」，是市售加工烘焙食品中反式脂肪的最典型代表。\n🔹 (C) 豬肉：主要含有動物性飽和脂肪酸與單元不飽和脂肪酸，天然反式脂肪極其微量。\n🔹 (D) 豆腐：天然黃豆製品，主要為大豆優質不飽和脂肪與蛋白質。\n\n📊 常見加工食品中反式脂肪隱形地雷分佈表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>食品分類</th><th>代表性高反式脂肪食品</th><th>反式脂肪生成來源</th></tr></thead>\n<tbody>\n<tr><td><b>高溫深層油炸點心</b></td><td><b>甜甜圈、炸薯條、炸雞、洋芋片</b></td><td><b>商業高溫酥炸油 (氫化棕櫚油/大豆油反覆油炸)</b></td></tr>\n<tr><td><b>烘焙西點糕餅</b></td><td>起酥麵包、牛角可頌、蛋塔、千層派、奶油餅乾</td><td>人造奶油 (Margarin)、酥油 (Shortening)</td></tr>\n<tr><td>沖調飲品與抹醬</td><td>奶精粉、奶精奶茶、花生抹醬</td><td>植物性氫化油脂乳化劑</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：反式脂肪大地雷：【甜甜圈】、烘焙酥油點心！引發 LDL 暴增、HDL 劇降。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0888", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 549 題] 採取低醣飲食時，每日醣量不可低於多少公克？", "options": ["A. 130", "B. 120", "C. 110", "D. 100"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第三章 每日醣類最低需求生理標準 (共照網考古 第549題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。依據世界衛生組織 (WHO)、美國國家科學院國立醫學研究院（IOM / DRI）以及美國糖尿病學會 (ADA) 的生理代謝規範，人體的中樞神經系統與大腦在無極端適應下每日必須消耗約 120-130 公克的葡萄糖；因此臨床營養指引明訂，「採取任何健康低醣飲食時，每日醣類攝取總量不可低於 130 公克（相當於約 8.5 份醣類）」，以確保大腦足夠能量供應，並防止體內脂肪失控分解引發嚴重的飢餓性酮酸蓄積。\n🔹 (B)(C)(D) 120、110、100 公克均低於國際公認之 130 公克最低生理防線。\n\n📊 醣類攝取標準與不同低醣飲食模式定義對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>飲食定義分類</th><th>每日醣類攝取公克數</th><th>佔每日總熱量比例</th><th>臨床生理與安全性評估</th></tr></thead>\n<tbody>\n<tr><td><b>常規健康最低標準</b></td><td><b>≧ 130 公克 / 天</b></td><td><b>約 45 - 60%</b></td><td><b>滿足大腦葡萄糖專一性消耗，防止飢餓性酮症</b></td></tr>\n<tr><td>溫和低醣飲食 (Low-carb)</td><td>約 50 - 130 公克 / 天</td><td>約 20 - 40%</td><td>可短期改善餐後血糖，需定期監測腎功能與血脂</td></tr>\n<tr><td>極低醣生酮飲食 (VLCKD)</td><td>&lt; 20 - 50 公克 / 天</td><td>&lt; 10% (極端)</td><td>大量產生酮體供能；易引發脫水、便秘、低血糖與心血管疑慮</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：每日醣類攝取最低生理防線：【不可低於 130 公克】！確保大腦腦細胞正常運作。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0909", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 570 題] 下列那項不是單元不飽和脂肪含量高的油脂？", "options": ["A. 橄欖油", "B. 芥花油", "C. 花生油", "D. 葵花油。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 食用油脂肪酸分類矩陣 (共照網考古 第570題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 橄欖油：單元不飽和脂肪酸（油酸 Oleic acid）含量高達 70-80%，為典型高 MUFA 油脂代表。\n🔹 (B) 芥花油（Canola oil / 菜籽油）：單元不飽和脂肪酸含量約 60-65%，屬於高 MUFA 油脂。\n🔹 (C) 花生油：單元不飽和脂肪酸含量約 45-50%，屬於單元不飽和脂肪含量較高之傳統油脂。\n🔹 (D) 正確（何者不是）。「葵花油（Sunflower oil）」傳統上是以「多元不飽和脂肪酸（PUFA，特別是 Omega-6 亞麻油酸，含量高達 60-70%）」為主的植物油，其單元不飽和脂肪酸比例通常較低（約 15-20%），因此不屬於單元不飽和脂肪含量高的油脂。\n\n📊 常見烹調植物油主要脂肪酸分佈比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>植物油品名稱</th><th>單元不飽和脂肪酸 (MUFA)</th><th>多元不飽和脂肪酸 (PUFA)</th><th>主要歸屬屬性</th></tr></thead>\n<tbody>\n<tr><td><b>苦茶油 / 橄欖油</b></td><td><b>70 - 80% (極高)</b></td><td>10%</td><td><b>單元不飽和油脂 (首選)</b></td></tr>\n<tr><td><b>芥花油 / 花生油</b></td><td><b>50 - 65% (高)</b></td><td>25 - 30%</td><td><b>單元不飽和油脂</b></td></tr>\n<tr><td><b>葵花油 / 大豆沙拉油</b></td><td><b>僅 15 - 25% (偏低)</b></td><td><b>高達 55 - 65% (極高)</b></td><td><b>多元不飽和油脂 (PUFA)</b></td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：高單元不飽和 (MUFA) 油脂：橄欖油、芥花油、苦茶油、花生油；【葵花油】富含多元不飽和 (PUFA)！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0997", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 694 題] 下列何者屬營養性甜味劑？", "options": ["A. 糖醇類", "B. 醋磺內酯鉀", "C. 蔗糖素", "D. 糖精"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第三章 甜味劑分類：營養性 vs 非營養性 (共照網考古 第694題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。「糖醇類（Polyols / Sugar alcohols，如木糖醇 Xylitol、山梨糖醇 Sorbitol、麥芽糖醇 Maltitol、甘露醇 Mannitol 等）」在化學與營養學上歸屬於「營養性甜味劑 (Nutritive sweeteners)」！因為它們雖然吸收率較蔗糖緩慢且不完全，但在人體內「仍會產生熱量（平均每公克約提供 1.5 - 2.6 大卡熱量）」，且過量攝取仍會微幅影響血糖，故屬於營養性甜味劑。\n🔹 (B) 醋磺內酯鉀 (Acesulfame K)：人工化學合成，人體無法代謝，熱量為 0，屬於「非營養性甜味劑」。\n🔹 (C) 蔗糖素 (Sucralose)：三氯蔗糖，零熱量，屬於「非營養性甜味劑」。\n🔹 (D) 糖精 (Saccharin)：人工化學合成，零熱量，屬於「非營養性甜味劑」。\n\n📊 營養性甜味劑 vs 非營養性甜味劑分類對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>甜味劑分類</th><th>代表成分與品項</th><th>熱量提供特性</th><th>對血糖與胃腸道之生理影響</th></tr></thead>\n<tbody>\n<tr><td><b>營養性甜味劑 (Nutritive)</b></td><td><b>糖醇類 (木糖醇、山梨糖醇、麥芽糖醇)、果糖</b></td><td><b>有熱量！(糖醇約 2 kcal/g，果糖 4 kcal/g)</b></td><td><b>多食仍會升高血糖；一次過量會引發滲透性腹瀉</b></td></tr>\n<tr><td><b>非營養性甜味劑 (Non-nutritive)</b></td><td>糖精、阿斯巴甜、蔗糖素、醋磺內酯鉀、甜菊糖苷</td><td><b>零熱量 (或極微量可忽略)</b></td><td>不刺激胰島素分泌，不影響餐後血糖</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：【糖醇類】屬於「營養性甜味劑（有熱量約 2 kcal/g）」！糖精、蔗糖素、醋磺內酯鉀為非營養性。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0998", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 695 題] 對醣類定義的名詞，不包括下列何項？", "options": ["A. 糖", "B. 澱粉", "C. 纖維質", "D. 複合性醣類"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第三章 醣類化學結構與法規名詞定義 (共照網考古 第695題)\n💡 臨床深度題解與選項剖析：\n🔹 依據食品化學與世界衛生組織 (WHO) / 聯合國糧農組織 (FAO) 的標準碳水化合物分類體系，醣類（Carbohydrates）依分子聚合度嚴謹定義為三大化學實體名詞：\n1. **糖 (Sugars)**：單醣（葡萄糖、果糖、半乳糖）與雙醣（蔗糖、乳糖、麥芽糖）。\n2. **澱粉 (Starch)**：多醣類（Polysaccharides），由長鏈葡萄糖分子組成之植物儲存形式。\n3. **纖維質 (Dietary fiber)**：人體消化酵素無法水解之非澱粉多醣類與木質素。\n🔹 (D) 正確（不包括下列何項）。「複合性醣類 (Complex carbohydrates)」是臨床營養衛教、流行病學或大眾飲食指南中為方便衛教溝通而使用的「通俗描述性名詞（通常指全穀雜糧等未精緻多醣）」，其分子結構模糊且缺乏排他性，在標準化學定義與食品標示法規定義名詞中「不包括複合性醣類」。\n\n📊 醣類化學結構與法規標準名詞定義架構表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>標準化學/法規定義名詞</th><th>分子聚合度 (DP) 與代表品項</th><th>臨床生理功能與代謝特質</th></tr></thead>\n<tbody>\n<tr><td><b>糖 (Sugars)</b></td><td>DP 1-2：單醣 (葡萄糖、果糖) 與雙醣 (蔗糖、乳糖)</td><td>吸收極快速，誘發餐後血糖急速竄升</td></tr>\n<tr><td><b>澱粉 (Starch)</b></td><td>DP &gt; 9：直鏈澱粉與支鏈澱粉多醣</td><td>經消化酵素逐步水解成葡萄糖，主要熱量來源</td></tr>\n<tr><td><b>纖維質 (Dietary fiber)</b></td><td>DP &gt; 9：非澱粉多醣 (纖維素、果膠、半纖維素)</td><td>不被人體小腸水解，促進腸道益菌與穩定血糖</td></tr>\n<tr><td><b>複合性醣類 (非標準定義)</b></td><td><b>通俗俗稱，非嚴謹法定科學名詞 (本題考點)</b></td><td>大眾衛教溝通詞彙，無排他性化學定義</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：醣類法規化學標準定義：【糖、澱粉、纖維質】！「複合性醣類」只是通俗名詞，非標準定義。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1013", "chapter": "第三章 糖尿病之醫療營養治療（一）：營養素與飲食管理", "stem": "[共照網考古題 第 714 題] 王先生是位低讀寫能力的糖尿病患，在營養衛教時，下列口頭說明何者較適合", "options": ["A. 糖尿病飲食是一個涵蓋六大營養素的均衡飲食", "B. 含糖甜的食物與含澱粉的食物都會影響血糖", "C. 食物中的碳水化合物食物對血糖的影響最直接", "D. 飲食中應減少飽和脂肪酸的攝取量"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 低健康識能病患之溝通指引 (共照網考古 第714題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 提到「六大營養素的均衡飲食」過於抽象概念化，缺乏具體生活指導力。\n🔹 (B) 正確。對低讀寫能力（Low literacy）或低健康識能（Low health literacy）的糖尿病患者，衛教的成功關鍵在於「避免艱澀學術專有名詞，改用個案聽得懂、直觀且能直接落實於餐桌上的白話語言」！臨床上許多長輩常誤以為「只有甜的糖才會讓血糖升高，不甜的飯麵可以隨便吃」，因此明確用口語告訴他「含糖甜的食物，以及吃起來不甜但含有澱粉的食物（如米飯、麵條、地瓜），吃進去都會變成血糖」，最能打破迷思、易懂且有效。\n🔹 (C) 使用「碳水化合物」等學術術語，對低讀寫能力者理解困難。\n🔹 (D) 使用「飽和脂肪酸」等生化化學名詞，個案難以連結到日常食物。\n\n📊 面向低讀寫能力患者之衛教語言轉譯原則表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>學術專業術語 (應避免)</th><th>白話轉譯生活語言 (建議首選)</th><th>溝通轉譯核心目的</th></tr></thead>\n<tbody>\n<tr><td>碳水化合物 (Carbohydrate)</td><td><b>「會讓血糖上升的澱粉與甜食（如白飯、麵條、地瓜、含糖飲料）」</b></td><td>打破「不甜就可以無限多吃」的錯誤迷思</td></tr>\n<tr><td>飽和脂肪酸 (SFA)</td><td>「動物肥肉、豬油、雞皮、牛油」</td><td>將化學名詞具象化為日常餐盤食材</td></tr>\n<tr><td>低密度脂蛋白膽固醇 (LDL)</td><td>「血管裡的壞膽固醇、血管垃圾」</td><td>建立直觀危機感，提高服藥遵從性</td></tr>\n</tbody></table></div>", "memory_core": "【第三章 必考考點】：低讀寫能力衛教原則：用白話！「甜的糖和不甜的澱粉（飯麵）都會影響血糖」最適合。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0146", "chapter": "第九章 低血糖", "stem": "長期罹患糖尿病之個案若發生「無自覺性低血糖（Hypoglycemia Unawareness）」，其臨床最危險的特徵與衛教對策為何？", "options": ["A. 代表患者自主神經系統功能超常發達，體內能完全耐受極低血糖衝擊而終生不會產生腦部缺糖病理損傷", "B. 臨床處置應將空腹血糖標準進一步嚴格緊縮至 50 mg/dL 以下，以強迫大腦神經元重新適應低糖環境", "C. 屬於心理暗示引起之精神官能障礙，只需進行心理諮商輔導，日常自我血糖監測頻率可直接減半進行", "D. 自主神經警告信號消失使患者直接陷入嚴重視力模糊或意識喪失；應短期適度放寬控糖目標以重置神經敏感度"], "answer": "D", "explanation": "反覆低血糖會抑制下視丘與腎上腺交感神經對低血糖的警示反應，導致患者在血糖極低時完全沒有顫抖、出汗等前兆，直接進入大腦神經低血糖症狀（Neuroglycopenia：神智不清、昏迷）。處置策略應在 2-3 週內刻意稍微放寬血糖目標，嚴格避免再次低血糖，使自主神經反向調節中樞重新校準復原。", "memory_core": "【無自覺性低血糖】：缺乏交感警訊（不出汗、不心悸）直接昏迷！需暫時放寬目標數週，避免任何低血糖以喚醒神經敏感度。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0161", "chapter": "第九章 低血糖", "stem": "長期反覆發生嚴重低血糖對中樞神經系統與心血管系統造成的長期危害，下列何者敘述「錯誤」？", "options": ["A. 顯著增加中老年糖尿病患者認知功能退化、腦萎縮及次發性失智症（Dementia）風險", "B. 每次嚴重低血糖發作皆能透過代謝適應顯著增強心臟冠狀動脈彈性並降低中風機率", "C. 引發交感神經劇烈放電，誘發心肌缺血、心律不整（QT 間期延長）與心因性猝死風險", "D. 破壞大腦皮質與海馬迴神經細胞之能量代謝，長期反覆發作恐造成永久性神經認知損傷"], "answer": "B", "explanation": "嚴重低血糖誘發兒茶酚胺大量釋放，導致心跳過速、心肌缺血、QT 間期延長誘發致命心律不整，並損害海馬迴神經細胞加速失智症，絕無增強心血管保護之可能。故 C 錯誤。", "memory_core": "【低血糖致命代價】：誘發致命心律不整（QT延長）、心肌缺血猝死，並加速腦部退化失智！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0451", "chapter": "第九章 低血糖", "stem": "[共照網考古題 第 23 題] 某位患者母親打電話前來諮詢，訴說其女兒暑假每天下午4~6 點學游泳，其晚餐前血糖值為 200~250mg/dL，清晨3~4 點會因飢餓感醒來，已發生過3 次，身為衛教師除了告訴母親此現 象為延遲性低血糖症，你還會如何處理？ 1 增加睡覺前的點心量，2 減少午餐前中效型胰島素劑量，3 監測睡前及清晨3~4 點的血糖， 4 減少晚餐量，5 減少晚餐前中效型胰島素劑量，6 增加午餐的醣類份量", "options": ["A. 1+2+3", "B. 1+5+6", "C. 2+4+6", "D. 1+3+5"], "answer": "D", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第九章 低血糖）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. 1+2+3</b>：選項包含 (2) 減少「午餐前」中效胰島素，但下午 4～6 點游泳引發的是「半夜清晨 3～4 點」延遲性低血糖，主要與「晚餐前 NPH」及夜間肝醣回補有關，而非午餐前 NPH。</li><li><b>(B) B. 1+5+6</b>：選項包含 (6) 增加「午餐」醣類份量，無法預防半夜 3～4 點的延遲性低血糖。</li><li><b>(C) C. 2+4+6</b>：選項包含 (4) 減少晚餐量，反而會使半夜低血糖更加嚴重！</li><li><b>(D) D. 1+3+5（正確答案）</b>：<b>本題正確答案（1+3+5）</b>。患者下午 4～6 點進行高消耗游泳運動後，骨骼肌在運動後 <b>6～15 小時內會大量攝取血中葡萄糖以回補消耗的肌肉肝醣</b>，加上晚餐前注射之 NPH 在半夜達到作用高峰，導致清晨 3～4 點發生「<b>運動後延遲性低血糖</b>」。正確處置為：<b>1. 增加睡覺前的點心量</b> ＋ <b>3. 監測睡前及清晨 3～4 點的血糖</b> ＋ <b>5. 減少晚餐前中效型胰島素（NPH）劑量</b>！</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 下午運動引發「半夜延遲性低血糖」之三大標準處置表：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">措施編號</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">處置內容</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">正誤與生理依據</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>(1) 增加睡前點心量</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">補充複合性碳水化合物與蛋白質</td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 正確</b>：提供夜間肌肉回補肝醣所需之葡萄糖來源</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>(3) 監測睡前及清晨 3~4 點血糖</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">確認夜間血糖最低點（Nadir）</td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 正確</b>：避免無症狀夜間低血糖昏迷</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>(5) 減少晚餐前 NPH 劑量</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">調降涵蓋夜間時段之基礎/中效胰島素</td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 正確</b>：消除半夜 NPH 作用尖峰疊加運動後胰島素敏感度上升之效應</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\">(2)減午餐NPH / (4)減晚餐量 / (6)加午餐醣</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">時段錯誤或反向惡化低血糖</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">❌ 錯誤：排除含 2、4、6 之選項，故選 <b>D (1+3+5)</b></td></tr></tbody></table></div>", "memory_core": "【下午運動半夜延遲性低血糖三對策】：(1) 增加睡前點心 ＋ (3) 測睡前與凌晨 3~4 點血糖 ＋ (5) 減少晚餐前 NPH 劑量！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0495", "chapter": "第九章 低血糖", "stem": "[共照網考古題 第 71 題] 王先生曾因為服用降血糖藥物發生低血糖，而拒絕服糖尿病藥物， 只靠飲食、運動控制，血糖仍偏高，此時何項衛教措施較合適？", "options": ["A. 瞭解王先生對血糖控制的想法", "B. 教導低血糖的症狀及處理方法", "C. 說明並不是所有糖尿病藥物都會引起低血糖", "D. 提供舒壓技巧，終止負面情緒"], "answer": "A", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第九章 低血糖）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. 瞭解王先生對血糖控制的想法（正確答案）</b>：<b>本題正確答案</b>。王先生因過去曾發生低血糖產生恐懼（Fear of hypoglycemia）而拒絕服藥，依據現代糖尿病自我管理教育（DSMES）與賦能（Empowerment）諮商原則，衛教師第一步應採取 <b>以病人為中心的同理傾聽，優先「瞭解王先生對血糖控制與低血糖恐懼的想法與感受」</b>，建立信任關係後，再共同討論調整不具低血糖風險的藥物方案！</li><li><b>(B) B. 教導低血糖的症狀及處理方法</b>：未先傾聽病人的恐懼與想法就直接單向灌輸低血糖處理方法，無法化解病人對藥物的抗拒心理。</li><li><b>(C) C. 說明並不是所有糖尿病藥物都會引起低血糖</b>：雖然說明藥物差異是後續知識衛教的一環，但在晤談初期若未先同理並瞭解病人的想法（選項 A），直接說教容易引發防衛抗拒。</li><li><b>(D) D. 提供舒壓技巧，終止負面情緒</b>：病人的核心問題是「因曾發生藥物低血糖而害怕服藥」，並非單純生活壓力，直接給舒壓技巧文不對題。</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 面對「因曾低血糖而拒服藥患者」之賦能衛教優先順序表：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">晤談步驟</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">選項對應</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">臨床諮商與賦能（Empowerment）解析</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>第一步（最優先）</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>A. 瞭解王先生對血糖控制的想法</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>本題正解：運用開放式提問（OARS）探索病人的低血糖陰影、擔憂與控糖期待</b></td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\">第二步（資訊共享）</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">B、C. 討論不易低血糖之藥物與低血糖預防</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">待同理接納後，再提供醫療資訊並與醫師協商調整處方</td></tr></tbody></table></div>", "memory_core": "【衛教諮商考題秒殺原則】：病人拒服藥或抗拒胰島素時，第一步永遠優先選「先瞭解病人對血糖控制/治療的想法與感受」！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0628", "chapter": "第九章 低血糖", "stem": "[共照網考古題 第 227 題] 下列何者情況發生低血糖的相對風險最低？", "options": ["A. 懷孕初期三個月", "B. 懷孕末期三個月", "C. 產後", "D. 哺乳"], "answer": "B", "explanation": "【2026 核心課本出處：第九章 低血糖（第五節 導致低血糖的原因 二、生理的因素）】\n• 核心課本第九章第五節原文逐字記載懷孕與產後各階段的低血糖風險：\n  (1) 懷胎初期三個月（第一孕期）：「低血糖的機率在懷胎初期三個月明顯增加，這是由於胎兒對糖分的需求以及母體對胰島素敏感度的增加。時常嘔吐（害喜）也增加低血糖的危險。」\n  (2) 懷孕中後期（尤其懷孕末期三個月，第三孕期）：「隨著懷胎過程，低血糖危險與機率就減少，這是因為胎盤激素導致周邊胰島素阻抗。」\n  (3) 產後及哺乳期：「產後期間低血糖機率明顯上升，因對胰島素敏感度增加，且哺乳會增加糖分消耗。」\n• 此外，老年糖尿病患者因腎功能退化及反調節荷爾蒙反應減弱，亦屬低血糖高風險群。因此四個選項中發生低血糖相對風險最低的階段為 (B) 懷孕末期三個月。", "memory_core": "【孕產婦低血糖風險口訣】：懷孕初期（孕吐）、產後（胎盤娩出）、哺乳（耗糖造奶）皆易低血糖；唯獨「懷孕末期三個月」因胎盤荷爾蒙阻抗最強，低血糖風險最低！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0818", "chapter": "第九章 低血糖", "stem": "[共照網考古題 第 487 題] 陳小明為第1 型糖尿病患者，近日半夜常發生低血糖。對於引起低血糖發生的飲食可能因素 ，下列何者正確？ 1. 晚餐醣類攝取量;2. 晚餐纖維質攝取量; 3 夜點醣類攝取量; 4 夜點蛋白質攝 取量5. 晚餐蛋白質攝取量", "options": ["A. 1＋2＋3", "B. 1＋3＋4", "C. 2＋4＋5", "D. 1＋3"], "answer": "D", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第九章 低血糖）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. 1＋2＋3</b>：錯誤，(2) 晚餐纖維質攝取量不是導致半夜低血糖之直接核心主因。</li><li><b>(B) B. 1＋3＋4</b>：錯誤，(4) 夜點蛋白質攝取量不是直接影響半夜血糖維持的主因（影響血糖最直接的永遠是「醣類/碳水化合物」總量）。</li><li><b>(C) C. 2＋4＋5</b>：錯誤，蛋白質與纖維質均非直接決定血糖高低之主要營養素。</li><li><b>(D) D. 1＋3（正確答案）</b>：<b>本題正確答案（1＋3）</b>。第 1 型糖尿病患者每日固定注射胰島素，直接決定傍晚至半夜血糖濃度的核心飲食因素就是 <b>「碳水化合物（醣類）攝取量」</b>！若 <b>1. 晚餐醣類攝取量不足</b>（而晚餐前胰島素未減量），或 <b>3. 睡前夜點醣類攝取量不足/未吃夜點</b>（無法銜接睡前中效胰島素 NPH 在半夜的作用高峰），就會直接引發半夜低血糖！</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 第 1 型糖尿病患「半夜低血糖」之飲食可能因素分析表：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">飲食因素項目</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">對夜間血糖之直接影響程度</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">是否為引起半夜低血糖之主因？</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>1. 晚餐醣類攝取量</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">直接決定晚餐後至睡前之血糖基準與肝醣儲備</td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 是（攝取太少易致夜間低血糖）</b></td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>3. 夜點醣類攝取量</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">直接緩衝睡前基礎/中效胰島素於半夜之作用高峰</td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 是（合選 D: 1＋3）</b></td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\">2. 纖維質 / 4, 5. 蛋白質攝取量</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">不直接轉化為快速血糖，非半夜低血糖之核心肇因</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">❌ 否</td></tr></tbody></table></div>", "memory_core": "【半夜低血糖飲食主因】：直接決定血糖高低的永遠是「醣類」！故選「1.晚餐醣類攝取量 ＋ 3.夜點醣類攝取量」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0969", "chapter": "第九章 低血糖", "stem": "[共照網考古題 第 655 題] 下列哪些口服藥物單獨使用不易造成低血糖？ (1) glimepiride (2) nateglinide (3) gliclazide(4) pioglitazone (5) acarbose  (6) metformin", "options": ["A. (2)(4)(5)", "B. (1)(3)(4)(5)", "C. (4)(5)(6)", "D. (2)(5)(6)"], "answer": "C", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第九章 低血糖）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. (2)(4)(5)</b>：錯誤，(2) nateglinide 屬於 Glinide 類促泌劑，單獨使用會造成低血糖。</li><li><b>(B) B. (1)(3)(4)(5)</b>：錯誤，(1) glimepiride 與 (3) gliclazide 皆屬於磺醯脲素類（SU）促泌劑，單獨使用最容易造成低血糖。</li><li><b>(C) C. (4)(5)(6)（正確答案）</b>：<b>本題正確答案（(4)(5)(6)）</b>。將題幹 6 種口服藥依機轉分類：<b>(1) Glimepiride</b> 與 <b>(3) Gliclazide</b> 為磺醯脲素類（SU），<b>(2) Nateglinide</b> 為美格替耐類（Glinide），這三者 <b>(1)(2)(3) 皆為直接刺激胰島素分泌之促泌劑，單獨使用容易造成低血糖</b>！相對地，<b>(4) Pioglitazone（TZD 增敏劑）</b>、<b>(5) Acarbose（$\\alpha$-GI 延緩腸道吸收）</b> 與 <b>(6) Metformin（雙胍類抑制肝糖）</b> 皆<b>不刺激胰島素分泌，單獨使用不易造成低血糖</b>！</li><li><b>(D) D. (2)(5)(6)</b>：錯誤，(2) nateglinide 單獨使用會造成低血糖。</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 6 種常用口服降血糖藥「單獨使用低血糖風險」分類總表（第 655 題）：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">題幹藥物代號與名稱</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">藥理分類</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">單獨使用是否易致低血糖？</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\">(1) Glimepiride / (3) Gliclazide</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">磺醯脲素類 (SU) 促泌劑</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">⚠️ 易造成低血糖</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\">(2) Nateglinide</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">Glinide 類短效促泌劑</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">⚠️ 易造成低血糖</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>(4) Pioglitazone</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>TZD 胰島素增敏劑</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 單用不易低血糖</b></td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>(5) Acarbose</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>α-葡萄糖苷酶抑制劑</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 單用不易低血糖</b></td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>(6) Metformin</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>雙胍類 (Biguanide)</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>✓ 單用不易低血糖（合選 C: 4, 5, 6）</b></td></tr></tbody></table></div>", "memory_core": "【口服藥單用低血糖秒殺分類】：看到字尾 -piride / -clazide (SU) 與 -glinide (Glinide) 必會低血糖；剩下的「(4)Pioglitazone、(5)Acarbose、(6)Metformin」單用皆不易低血糖！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0302", "chapter": "第二十一章 應用激勵式晤談與健康輔導模式", "stem": "在動機式晤談（MI）中，當個案表現出強烈「維持現狀的對話（Sustain Talk）」，抗拒衛教師的建議時，衛教師最推薦採取的互動技巧為：", "options": ["A. 嚴肅端出晚期失明與洗腎數據進行權威說服，要求個案立刻服從以消除其僥倖心理", "B. 順應抗拒並與阻抗共舞，運用反映性傾聽探索阻抗背後的深層顧慮與生活難處", "C. 立即中斷晤談並將衛教重點轉移至家屬身上，要求家屬全權接管其所有日常飲食決策", "D. 保持全然沉默並記錄其不依從行為，直接判定衛教失敗並終止當季之個案追蹤排程"], "answer": "B", "explanation": "動機式晤談鐵律為「避免正面爭辯（Avoid Argumentation）」。當個案抗拒改變時，強加說服只會迫使個案強化維持現狀的防衛壁壘。衛教師應「順應抗拒、與阻抗共舞（Rolling with resistance）」，以同理與反映性傾聽探索阻抗背後的擔憂，引導個案自主覺察內在矛盾。", "memory_core": "【與抗拒共舞 Rolling with Resistance】：嚴禁正面爭辯對立！以反映傾聽同理抗拒，順勢引導其自省改變。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0304", "chapter": "第二十一章 應用激勵式晤談與健康輔導模式", "stem": "動機式晤談的精神強調四大核心心態（MI Spirit: PACE），下列何者為 PACE 的四個英文維度？", "options": ["A. 夥伴協作（Partnership）、全然接納（Acceptance）、慈悲同理（Compassion）、誘發動機（Evocation）", "B. 專業權威（Professionalism）、全面評估（Assessment）、循規指導（Compliance）、衛教解說（Education）", "C. 個案保護（Protection）、處方指引（Advice）、常規查核（Check）、情感支持（Empathy）", "D. 問題導向（Problem-focus）、積極處置（Action）、認知重塑（Cognition）、賦權管理（Empowerment）"], "answer": "A", "explanation": "動機式晤談精神（MI Spirit: PACE）：(1) Partnership（夥伴協作，非專家主宰）；(2) Acceptance（接納尊重自主權，給予絕對價值與肯定）；(3) Compassion（慈悲心，全心促進個案最佳福祉）；(4) Evocation（誘發，相信個案具備內在動機與資源，透過引導喚出而非外部硬塞）。", "memory_core": "【動機式晤談四大精神 PACE】：Partnership（夥伴）、Acceptance（接納）、Compassion（慈悲）、Evocation（喚醒）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0314", "chapter": "第二十一章 應用激勵式晤談與健康輔導模式", "stem": "激勵式晤談（Motivational Interviewing, MI）的四大核心精神（Spirit of MI），被統稱為「PACE」，下列哪一項代表其中的「E（Evocation）」？", "options": ["A. 專家導向（Expert-driven）：由衛教師以專業權威直接指導並糾正生活錯誤", "B. 成效評量（Evaluation）：在會談中嚴格審核個案各項自我管理紀錄之達標率", "C. 誘發引導（Evocation）：相信個案內在改變資源，透過雙向探索引出自主動機", "D. 認知消除（Elimination）：運用說服技巧徹底消除個案心中對既有生活之留戀"], "answer": "C", "explanation": "MI 精神四大支柱 PACE 中的「E」代表 Evocation（誘發 / 引出）。其核心信念認為：改變所需的智慧、力量與動機早已存在於個案內心，衛教師的角色不是由外向內強行「灌輸（Install）」，而是透過啟發性對話將其內在動機「引導誘發（Evoke）」出來。", "memory_core": "【動機式晤談精神 PACE】：夥伴關係 (P)、接納 (A)、慈悲 (C)、引出動機 (E)，拒絕由上而下說教！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0315", "chapter": "第二十一章 應用激勵式晤談與健康輔導模式", "stem": "在動機式晤談（MI）的「反映性傾聽（Reflective Listening）」技巧中，當個案沮喪地說：「我每天量血糖，數值都在 180 上下，我覺得我再怎麼努力都沒有用！」衛教師給予下列哪一種反映回饋最能展現「複合反映（Complex Reflection）」並引導前進？", "options": ["A. 「血糖 180 確實還在可接受安全範圍內，您不需要過度焦慮給自己那麼大壓力」", "B. 「既然天天量血糖會讓您這麼沮喪，不如先暫停自我監測兩週讓心情沉澱一下再說」", "C. 「數值一直降不下來代表飲食控制肯定有重大漏洞，我們必須重新審核您的三餐菜單」", "D. 「您感到非常挫折，因為您明明投入了極大心力認真監測，數值卻未能達到預期目標」"], "answer": "D", "explanation": "複合反映（Complex Reflection）超越了單純表面的字面重複，能深入捕捉個案話語背後的情緒（深沉挫折感）與背後的正向價值（個案其實非常在乎健康且天天認真量糖）。D 能讓個案感受到被全然理解與接納，為下一步探討問題成因奠定互信基礎。", "memory_core": "【深層反映傾聽】：辨識情緒、肯定背後努力付出，讓個案感到被全然聽懂與接納。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0316", "chapter": "第二十一章 應用激勵式晤談與健康輔導模式", "stem": "動機式晤談旨在引導個案說出「改變對話（Change Talk，DARN-CAT 模型）」，下列個案所說的哪一句話代表最強烈的「承諾性改變語言（Commitment Language）」？", "options": ["A. 「如果我的膝蓋關節狀況允許的話，我或許有能力（Ability）在晚餐後散步一刻鐘」", "B. 「我已做出決定，從下週一開始我一定會（Commitment）每天提早一站下車快走」", "C. 「我打從心底非常希望（Desire）下一次門診抽血檢驗時糖化血色素能夠稍微好看一點」", "D. 「考量到醫師提及的視網膜病變失明風險，我覺得我真的應該（Need）少喝一點含糖飲料」"], "answer": "B", "explanation": "DARN-CAT 模型將改變語言分為兩大層次：前期預備語言（DARN：Desire 願望、Ability 能力、Reason 理由、Need 需要）與動員承諾語言（CAT：Commitment 承諾、Activation 行動準備、Taking steps 採取行動）。「我一定會（I will / I promise）」代表最高層級的承諾語言（Commitment），對後續真實行動具有最強的預測力。", "memory_core": "【改變對話最高階】：DARN 是準備，CAT 是行動！「我承諾一定會做（Commitment）」最強！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0317", "chapter": "第二十一章 應用激勵式晤談與健康輔導模式", "stem": "當個案在晤談中流露出「既想減重改善健康，又割捨不下宵夜美食的快樂」之猶豫矛盾心態時，動機式晤談將此種心理現象定義為下列何者？", "options": ["A. 「兩難矛盾心理（Ambivalence）」，視為行為改變歷程中極為正常且關鍵之過渡階段", "B. 「病態性格解離（Dissociation）」，視為個案逃避現實自我責任之心理退縮防衛機制", "C. 「認知功能退化（Cognitive Decline）」，視為前額葉決策中樞受損之早期臨床徵候", "D. 「依從性障礙（Non-compliance）」，視為個案對醫療團隊之消極對抗與不合作表徵"], "answer": "A", "explanation": "矛盾心理（Ambivalence）是人們面對改變時的普遍正常反應（既想改變帶來的益處，又留戀現狀的舒適）。動機式晤談不將其視為病態或抗拒，而是通往實質改變的必經十字路口，透過開展「決定天平（Decisional Balance）」，引導個案自主將天平傾斜向健康改變。", "memory_core": "【矛盾心理（Ambivalence）本質】：想改又捨不得改！改變過程的必經十字路口，引導利弊天平傾斜。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0386", "chapter": "第二十七章 特殊族群護理照護", "stem": "針對嚴重視覺障礙（如增殖型網膜病變伴隨視野缺損）之糖尿病患者，衛教其居家獨立注射胰島素時，下列何項輔具或技巧最具實用安全性？", "options": ["A. 指導個案使用高倍率光學放大鏡在弱光環境中辨識微小數字，並請家屬於電話中口頭確認", "B. 指導個案每次直接將刻度旋鈕轉動到底至最大行程，隨後以目測推估注射量並於腹部注射", "C. 利用注射筆轉動之喀嗒聲（Click）計數單位，並於筆身纏繞橡皮筋等觸覺標記以區分劑型", "D. 建議視障個案全面放棄皮下注射，改採高頻率超音波透皮霧化吸收技術以取代傳統針頭"], "answer": "C", "explanation": "視障者居家胰島素安全注射技巧：善用筆型注射器轉動時之喀嗒聲（Click Count，每聲代表 1 單位）聽音計數；並在筆身黏貼橡皮筋或不同材質膠帶作為觸覺標記，精準區分基礎與餐食胰島素。", "memory_core": "【視障病患注射安全】：善用筆型胰島素「喀噠聲（Click）聽聲辨劑量」＋ 語音血糖機 ＋ 專用觸覺標記輔具。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0389", "chapter": "第二十七章 特殊族群護理照護", "stem": "在長照機構（機構養護型）之失能失智高齡糖尿病長者，照護團隊在進行日常照護品質管理時，最關鍵的預防目標為何？", "options": ["A. 隱匿性低血糖（以嗜睡、跌倒或譫妄表現）與足部感覺神經病變導致之未察覺壓瘡潰瘍", "B. 機構內高強度團體復健運動導致骨骼肌過度肥大，進而引發橫紋肌溶解與急性腎小管壞死", "C. 長者交感神經反射過度敏銳導致每次進餐後血壓極速飆高，引發急性主動脈剝離出血", "D. 認知障礙長者自發性熱量攝取
