)</td></tr></tbody></table></div>", "memory_core": "【DKD 三大惡果】：蛋白尿漏出、高血壓爆發、心血管死亡率暴增！心腎四聯藥物提早介入。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0821", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 490 題] 張先生，糖尿病多年，最近醫師告知已CKD 第2 期，您對張先生的衛教重點，除血糖控制外， 應再加強", "options": ["A. 低鉀飲食", "B. 低磷飲食", "C. 控制蛋白質飲食", "D. 低鹽飲食"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十二章 糖尿病腎臟病變 (DKD) 營養治療 (共照網考古 第490題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)(B) 低鉀與低磷飲食：通常是在慢性腎臟病進展至第 4-5 期（晚期或腎衰竭）、腎絲球過濾率嚴重低落 (eGFR &lt; 30 mL/min) 且出現高血鉀或高血磷時，才需要嚴格執行；CKD 第 2 期腎功能仍佳，不需過早盲目限制鉀與磷。\n🔹 (C) 正確。張先生確診為糖尿病腎臟病變（CKD 第 2 期），依據 KDIGO 與台灣糖尿病腎病變照護指引，早期腎病變之醫療營養介入核心為「控制蛋白質飲食」：建議每日蛋白質攝取量維持在「0.8 公克/公斤體重/天（佔總熱量 10-15%）」，並避免任何形式的高蛋白飲食（High-protein diet），以有效降低腎絲球內壓（Intraglomerular hypertension）、減輕腎絲球高過濾損傷並延緩微量白蛋白尿惡化。\n🔹 (D) 限制鈉鹽是基本原則，但針對腎臟病變預防惡化的專屬重點為蛋白質管控。\n\n📊 糖尿病腎臟病變 (DKD) 各期營養素限制指引對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>CKD 期別分級</th><th>腎絲球過濾率 (eGFR)</th><th>蛋白質攝取建議目標</th><th>電解質 (鉀、磷) 限制指引</th></tr></thead>\n<tbody>\n<tr><td><b>CKD 第 1 - 2 期</b></td><td><b>≧ 60 mL/min/1.73m² (早期)</b></td><td><b>控制在 0.8 g/kg/day (嚴禁高蛋白飲食！)</b></td><td><b>暫無須常規嚴格限鉀限磷</b></td></tr>\n<tr><td>CKD 第 3 - 5 期 (未洗腎)</td><td>&lt; 60 mL/min/1.73m² (中晚期)</td><td>限制在 0.6 - 0.8 g/kg/day</td><td>依血清鉀離子與磷離子檢驗值精準限制</td></tr>\n<tr><td>末期透析患者 (洗腎)</td><td>血液透析 / 腹膜透析</td><td>提高至 1.2 - 1.4 g/kg/day (補洗腎流失)</td><td>嚴格限制水分、鈉、高鉀與高磷食物</td></tr>\n</tbody></table></div>", "memory_core": "【第十二章 必考考點】：CKD 第 2 期護腎首重「控制蛋白質飲食 (0.8 g/kg/day)」；早期無需盲目限鉀限磷！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0889", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 550 題] 請排列有關第1 型糖尿病患腎臟病變發病次序？ (1)微量蛋白尿 (2) 明顯蛋白尿(3) 高血壓 (4) 腎臟增殖肥大", "options": ["A. 1234", "B. 4123", "C. 4132", "D. 4312"], "answer": "B", "explanation": "【2026 核心課本出處：第十二章 糖尿病腎臟病變（第二節 糖尿病腎病變的自然病程與分期 表 12-4）】\n• 核心課本第十二章「表 12-4 第 1 型糖尿病腎病變的分期」原文記載之自然病程次序：\n  - 第 1 期（高濾過與肥大期）：診斷初期即出現腎絲球高濾過率（GFR 增加）及「腎臟增殖肥大（4）」。\n  - 第 2 期（靜止期 / 潛伏期）：腎絲球基底膜開始增厚、間質擴張，但尿液白蛋白排泄率仍正常。\n  - 第 3 期（初期糖尿病腎病變，Incipient nephropathy）：通常於發病 5~15 年後出現持續性「微量白蛋白尿（1）」（UACR 30~299 mg/g），血壓開始微幅上升。\n  - 第 4 期（臨床明顯糖尿病腎病變，Overt nephropathy）：進展為「明顯蛋白尿 / 巨量白蛋白尿（2）」（UACR ≧ 300 mg/g），GFR 持續下降，並普遍合併明顯「高血壓（3）」與水腫。\n  - 第 5 期（末期腎病變，ESRD）：腎功能嚴重衰竭需接受透析或腎臟移植。\n• 因此依病程先後順序排列為：(4) 腎臟增殖肥大 → (1) 微量白蛋白尿 → (2) 明顯蛋白尿 → (3) 高血壓，正確答案為 (C) 4123。", "memory_core": "【T1DM 腎病變發病四部曲】：(4)腎臟增殖肥大 ➔ (1)微量蛋白尿 ➔ (2)明顯蛋白尿 ➔ (3)高血壓（口訣：4123，肥大最先、高血壓最後）！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0911", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 572 題] 腹膜透析與血液透析之比較 ,何者為正確者?", "options": ["A. 腹膜透析液中可加入胰島素, 由肝門靜脈吸收, 提供連續性胰島素補充", "B. 血液透析液中葡萄糖會影響胰島素需要量", "C. 腹膜透析液中葡萄糖會影響胰島素需要量", "D. 以上皆是"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核腹膜透析（PD）與血液透析（HD）對糖尿病病患代謝與胰島素給藥之比較。<strong>正確答案為 (D) 以上皆是</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 敘述正確</span><strong>腹膜透析液中可加入胰島素, 由肝門靜脈吸收, 提供連續性胰島素補充：</strong>腹膜透析具有獨特之腹腔內給藥途徑（Intraperitoneal insulin, IP），短效常規胰島素加入透析液中，經由腹膜微血管吸收直接回流至肝門靜脈，模擬生理性胰島素走門脈循環進入肝臟，能提供平穩平順的血糖控制。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 敘述正確</span><strong>血液透析液中葡萄糖會影響胰島素需要量：</strong>血液透析常規透析液多含有葡萄糖（約 100~200 mg/dL），透析過程中的葡萄糖流失或吸收會動態改變血糖，透析日病患容易發生低血糖，故透析液中葡萄糖直接影響胰島素劑量調整。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 敘述正確</span><strong>腹膜透析液中葡萄糖會影響胰島素需要量：</strong>腹膜透析液利用不同濃度葡萄糖（1.5%、2.5%、4.25%）作為超濾脫水介質，每天經腹膜吸收高達 100~300 公克葡萄糖（相當於 400~1,200 大卡熱量），大幅增加外生性升糖負荷，使患者胰島素需要量顯著增加 2~3 倍。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 正確（本題正解）</span><strong>以上皆是：</strong>選項 A、B、C 均為臨床客觀正確之透析代謝藥理機轉，故選以上皆是。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：腹膜透析 (PD) vs 血液透析 (HD) 代謝與胰島素管理對照表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>比較項目</th><th>腹膜透析 (PD)</th><th>血液透析 (HD)</th></tr></thead><tbody><tr><td><strong>透析液糖分負荷</strong></td><td><strong>極高！每日吸收 100~300g 葡萄糖</strong></td><td>中等 (透析液含糖 100~200 mg/dL)</td></tr><tr><td><strong>胰島素獨特給法</strong></td><td><strong>可直接加入透析袋 (IP 給藥走門脈)</strong></td><td>僅能皮下注射 (SC) 或靜脈注射 (IV)</td></tr><tr><td><strong>胰島素總劑量變化</strong></td><td>通常需顯著增加 (應對透析液葡萄糖吸收)</td><td>透析日通常需減少劑量 (防透析中低血糖)</td></tr></tbody></table></div>", "memory_core": "【透析代謝通盤考】：PD 可加胰島素入袋走門脈；HD 與 PD 之葡萄糖皆影響胰島素需求量！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0938", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 603 題] 對一個合理體重60 公斤，出現臨床白蛋白尿者，每日蛋白質以多少公克為宜？", "options": ["A. 72", "B. 66", "C. 48", "D. 30"], "answer": "C", "explanation": "【2026 核心課本出處：第十二章 糖尿病腎臟病變 ＆ 第二十六章 糖尿病相關併發症之營養治療（第二十六章第 1405 行營養素表）】\n• 核心課本第二十六章第一節及第 1405 行營養素表 原文記載：\n  - 「對糖尿病腎臟疾病者應給予 0.8~1.0 公克/公斤（標準體重）蛋白質（< 10% 的總熱量）；更嚴格的蛋白質限制 0.6 公克/公斤曾經被建議，但發現在病情穩定的病人，在減緩 GFR 下降的幫忙很小，且須監測病人營養不良的臨床症狀。因此對糖尿病合併腎臟疾病的病人，並不建議蛋白質攝取量 < 0.6 gm/kg/day。」\n  - 慢性腎臟病（未透析）第 1~3 期建議每日蛋白質 0.8~1.0 g/kg、第 4 期建議 0.8~0.9 g/kg。\n• 計算：合理體重 60 公斤 × 0.8 公克/公斤/日 = 48 公克/日（若選 D 30 公克僅 0.5 g/kg/day，低於 0.6 g/kg/day 易致營養不良；A 72 公克與 B 66 公克則超過 1.0 g/kg/day），故選 (C) 48 公克。", "memory_core": "【60 公斤病人蛋白質兩大考古題對照】：微量白蛋白尿（第 560 題）選「48～60 克」；臨床白蛋白尿（第 603 題）選「40 公克」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1003", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 703 題] 有關糖尿病腎病變的病理變化,何者錯誤", "options": ["A. Kimmelstiel-Wilson nodules 是最典型的組織病理學,代表腎絲球萎縮", "B. 腎絲球基底膜(glomerular basement membrane)增厚", "C. 腎絲球間質增生和硬化(mesangial expansion and sclerosis)", "D. 也會有腎小管和間質的纖維化(tubular and interstitial fibrosis)"], "answer": "A", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病腎臟病變經典組織病理學特徵（Kimmelstiel-Wilson nodules 結節性硬化）。<strong>正確答案為 (A)</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 A 敘述錯誤（本題正解）</span><strong>K-W 結節病理意義錯誤 ❌：</strong>Kimmelstiel-Wilson 結節（K-W nodules）是糖尿病腎病變最典型的標誌性病理切片，其定義為<strong>「腎絲球繫膜基質增生與結節性硬化（Nodular glomerulosclerosis）」</strong>，形成粉紅色嗜酸性結節，<strong>並非代表「腎絲球萎縮」</strong>！萎縮是末期廣泛缺血性硬化的晚期結果。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 正確</span><strong>腎絲球基底膜增厚：</strong>高血糖引發第四型膠原蛋白過量堆積，GBM 瀰漫性增厚是糖尿病腎病變最早出現的結構性改變之一。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 正確</span><strong>繫膜間質擴展與硬化：</strong>Mesangial expansion 是壓迫有效過濾面積、導致晚期 GFR 下降的核心組織病變。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 正確</span><strong>腎小管間質纖維化：</strong>隨著蛋白尿濾出毒害腎小管上皮細胞，誘發上皮間質轉化（EMT），最終導致腎間質纖維化與小管萎縮。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：糖尿病腎臟病變四級組織病理學分類 (RPS/KDIGO 標準)</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>病理分級</th><th>病理組織學特徵</th><th>光學/電子顯微鏡鏡檢表現</th><th>臨床階段對應</th></tr></thead><tbody><tr><td><strong>Class I</strong></td><td>單純基底膜增厚 (GBM Thickening)</td><td>電顯見 GBM 顯著增厚，光學顯微鏡下無明顯改變</td><td>多對應於靜止期/早期微量白蛋白尿</td></tr><tr><td><strong>Class II</strong></td><td>繫膜基質擴增 (Mesangial Expansion)</td><td>系膜區擴展大於微血管腔直徑 (IIa 輕度 / IIb 重度)</td><td>微量至早期巨量白蛋白尿</td></tr><tr><td><strong>Class III</strong></td><td><strong>結節性硬化 (Nodular Sclerosis)</strong></td><td><strong>出現至少一個典型 Kimmelstiel-Wilson (K-W) 結節</strong></td><td><strong>明顯臨床腎病變期 (巨量蛋白尿、eGFR急降)</strong></td></tr><tr><td><strong>Class IV</strong></td><td>晚期腎絲球硬化 (Advanced Glomerulosclerosis)</td><td>廣泛硬化，超過 50% 腎絲球完全硬化纖維化</td><td>末期腎臟病變 (ESKD)</td></tr></tbody></table></div>\n（臨床醫學註釋：Kimmelstiel-Wilson nodules 即糖尿病腎病變晚期特徵性的「結節性腎絲球硬化症 Nodular glomerulosclerosis」，為繫膜基質增生硬化所形成）", "memory_core": "【K-W 結節必考】：Kimmelstiel-Wilson 是『結節性硬化 (Nodular sclerosis)』不是萎縮！為第三期病理金標準。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0565", "chapter": "第十五章 糖尿病足部與口腔照護及衛教", "stem": "[共照網考古題 第 144 題] 關於兩歲孩童血糖自我監測的敘述，下列何者正確？", "options": ["A. 採血部位可選擇腳跟的外側、手指尖端", "B. 一週只要做血糖自我監測兩次即可", "C. 當生病日時不需增加血糖自我監測的次數", "D. 建議病患血糖高於150 時要驗尿酮"], "answer": "A", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核幼童（兩歲）糖尿病血糖監測採血解剖部位與生病日照護指引。<strong>正確答案為 (A) 採血部位可選擇腳跟的外側、手指尖端</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 A 敘述正確（本題正解）</span><strong>採血部位可選擇腳跟的外側、手指尖端：</strong>兩歲幼童手指嬌小且末梢皮膚稚嫩，指引規範幼兒微血管血糖採血部位，除手指尖端兩側外，亦可安全選擇<strong>「腳跟的外側（Heel-stick，避開腳跟中央跟骨與後側血管神經密集區）」</strong>，以減少扎針疼痛與恐懼。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 敘述錯誤</span><strong>一週只要做血糖自我監測兩次即可 ❌：</strong>幼童新陳代謝快、進食與活動不可預測性極高，且無法清楚表達低血糖不適，指引建議幼兒每日至少監測 4~6 次以上（餐前、睡前、半夜），一週只驗兩次極易漏診致命低血糖。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 敘述錯誤</span><strong>當生病日時不需增加自我監測次數 ❌：</strong>幼童在發燒、感染生病日（Sick day）因體內壓力性荷爾蒙飆高，極易在數小時內爆發急性糖尿病酮酸中毒（DKA），生病日必須<strong>「顯著增加監測頻率（每 2～4 小時監測一次）」</strong>。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 敘述錯誤</span><strong>建議病患血糖高於 150 時要驗尿酮 ❌：</strong>指引規範當血糖<strong>「持續高於 250 mg/dL」</strong>或出現腹痛、嘔吐生病症狀時才需常規檢測血酮或尿酮，門檻並非 150 mg/dL。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：兒童/幼兒糖尿病血糖監測與生病日照護表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>照護項目</th><th>指引規範標準</th><th>臨床衛教重點</th></tr></thead><tbody><tr><td><strong>幼童採血部位 (本題)</strong></td><td><strong>手指尖端兩側 ｜ 腳跟外側 (Heel-stick)</strong></td><td>避開骨突處，輪換部位預防結痂硬結</td></tr><tr><td><strong>常規監測頻率</strong></td><td>每日至少 4 ～ 6 次 (餐前、睡前、半夜)</td><td>幼童無低血糖自覺能力，需家長密切把關</td></tr><tr><td><strong>生病日 (Sick-day)</strong></td><td><strong>每 2 ～ 4 小時密集監測血糖與酮體</strong></td><td>切勿自行停用胰島素，水分充分補充</td></tr><tr><td><strong>驗酮體標準門檻</strong></td><td><strong>血糖 ＞ 250 mg/dL 或合併嘔吐生病</strong></td><td>防範幼兒爆發致死性 DKA</td></tr></tbody></table></div>", "memory_core": "【幼童採血與控糖】：兩歲可採「手指兩側或腳跟外側」；生病日密集驗，血糖破 250 驗酮體！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0570", "chapter": "第十五章 糖尿病足部與口腔照護及衛教", "stem": "[共照網考古題 第 150 題] 有關糖尿病患進行牙科治療，下列何者錯誤?", "options": ["A. 治療當天減少或暫停糖尿病藥物治療，第二天後恢復正常用藥。", "B. 治療期間通常不需改變糖尿病藥物劑量，避免在藥物高峰期進行牙科治療。", "C. 治療當天為避免低血糖，務必要吃早餐。", "D. 牙科治療時間應儘可能拉長以減少疼痛。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十五章 糖尿病口腔照護及衛教 (共照網考古 第150題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 牙科治療前務必確認血糖值；若血糖過高（如 > 200-250 mg/dL）易增加感染風險，過低則可能在診椅上陷入低血糖昏迷。\n🔹 (B) 安排早晨時段看診最佳，此時體內內源性皮質醇穩定、患者剛吃過早餐不易疲憊，且有完整日間觀察期處理術後出血或低血糖。\n🔹 (C) 治療當日務必正常進食並按醫囑服藥，嚴禁無故禁食看診，以避免空腹與心理緊張誘發急性低血糖。\n🔹 (D) 正確（何者錯誤）。牙科治療時間應「盡可能縮短、分次進行」，避免病人長時間處於高度壓力、張口疲勞與疼痛刺激中；長時間療程會引發體內交感神經劇烈興奮與壓力荷爾蒙大量釋放，導致血糖急劇飆升甚至誘發心血管危機。\n\n📊 糖尿病患者牙科侵入性治療臨床處置規範：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>照護項目</th><th>標準臨床規範</th><th>醫學學理依據</th></tr></thead>\n<tbody>\n<tr><td><b>看診時段選擇</b></td><td><b>優先預約早晨時段</b></td><td>早晨體力佳、血糖較平穩、進食後低血糖風險最低</td></tr>\n<tr><td><b>療程時間控制</b></td><td><b>短時、多次、分段進行</b></td><td><b>減少肉體與心理壓力，避免壓力荷爾蒙飆高血糖</b></td></tr>\n<tr><td><b>飲食與用藥管理</b></td><td>維持正常早餐與降糖藥物</td><td>嚴防空腹看診引發突發低血糖暈厥</td></tr>\n<tr><td><b>抗生素預防使用</b></td><td>複雜手術或血糖控制不良 (A1C > 8%) 時評估預防性給藥</td><td>糖尿病白血球趨化與殺菌功能受損，易術後蜂窩性組織炎</td></tr>\n</tbody></table></div>", "memory_core": "【第十五章 必考考點】：糖尿病看牙科「約早上、吃早餐、療程盡量縮短分次做」！切忌長時間疲勞應激治療。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0580", "chapter": "第十五章 糖尿病足部與口腔照護及衛教", "stem": "[共照網考古題 第 164 題] 糖尿病患者產生心血管合併症時，宜避免下列哪種運動?", "options": ["A. 慢跑", "B. 騎腳踏車", "C. 快走", "D. 舉重"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病合併心血管疾病（大血管併發症）患者之運動處方禁忌。<strong>正確答案為 (D) 舉重</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 可經評估進行</span><strong>慢跑：</strong>若經心臟專科醫師評估與運動心電圖耐受性良好，中低強度慢跑屬於安全有氧運動。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 可進行</span><strong>騎腳踏車：</strong>平地騎固定式單車為大肌肉群節律性有氧運動，血壓心率上升平緩，是心血管患者推薦之運動。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 最推薦安全</span><strong>快走：</strong>快走（B 科一次 ❌：</strong>糖尿病指引建議病患應「每 6 個月（至少每年 1 次）」定期接受牙科全口檢查與洗牙，每二年一次間隔過長。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 照護觀念錯誤</span><strong>牙線對預防牙周病效果不佳 ❌：</strong>牙周致病菌主要藏匿於牙齒鄰接面之齒齦溝中，牙刷刷毛無法完全深入牙縫，牙線或牙間刷是清除鄰面牙菌斑「最關鍵、最具實證效果」的工具。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 流行病學相反</span><strong>血糖愈高，牙周病風險愈低 ❌：</strong>血糖愈高，組織終末糖化產物（AGEs）堆積愈多、微血管內皮通透性增加且嗜中性白血球趨化殺菌功能嚴重受損，牙周病發生率與破壞嚴重度呈現極強正相關！</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 敘述正確（本題正解）</span><strong>糖尿病患常發生嚴重的牙周病：</strong>牙周病被國際醫學界正式公認為<strong>「糖尿病的第六大慢性併發症」</strong>！糖尿病患者罹患重度牙周炎（深牙周囊袋、齒槽骨大面積吸收與牙齒動搖脫落）的機率是健康正常人的 2～3 倍，臨床上非常普遍且嚴重。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：糖尿病與牙周病雙向惡性循環機轉表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>影響面向</th><th>病理生理機轉</th><th>臨床表現與照護對策</th></tr></thead><tbody><tr><td><strong>糖尿病對牙周病的影響<br>(本題選項 D)</strong></td><td>高血糖損害微血管修復、抑制白血球吞噬、膠原蛋白代謝異常</td><td><strong>牙齦重度化膿腫脹、齒槽骨快速破壞吸收、牙齒鬆脫 (第 6 大併發症)</strong></td></tr><tr><td><strong>牙周病對糖尿病的反向影響</strong></td><td>牙周發炎釋放大量的 TNF-α、IL-6 等發炎介質進入全身血液循環</td><td>加劇全身周邊胰島素阻抗，導致糖化血色素 (A1C) 失控惡化</td></tr><tr><td><strong>口腔照護黃金指引</strong></td><td>每 6 個月定期洗牙，每日貝氏刷牙 ＋ 牙線清潔</td><td>積極治療牙周病可使 A1C 平均改善 0.3%~0.4%！</td></tr></tbody></table></div>", "memory_core": "【牙周病是第 6 大併發症】：高血糖惡化牙周炎，牙周發炎再反噬控糖；糖尿病患「常併發嚴重牙周病」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0826", "chapter": "第十五章 糖尿病足部與口腔照護及衛教", "stem": "[共照網考古題 第 495 題] 以下何者不適合當作糖尿病患者足部檢查的器械？", "options": ["A. 使用針刺、棉花輕觸", "B. 128 cps 音叉震動", "C. 單股尼龍纖維", "D. 512 cps 音叉共振"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十五章 糖尿病足部照護及衛教 (共照網考古 第495題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 安全單棄式針刺 (Pinprick) 測試小纖維痛覺；棉花絮輕觸 (Light touch) 測試大纖維觸覺。\n🔹 (B) 128 cps (Hz) 音叉為世界公認評估糖尿病足大纖維「震動覺」的黃金標準器械。\n🔹 (C) 10g (Semmes-Weinstein 5.07) 單股尼龍纖維是用於篩檢「保護性感覺喪失 (LOPS)」最重要的單一評估器械。\n🔹 (D) 正確（何者不適合）。512 cps (Hz) 音叉頻率過高、震幅極小，是耳鼻喉科專門用於測試「聽力障礙（Rinne test 與 Weber test）」的專用器械，震動感極細微，完全不適合用於人體下肢骨凸處評估周邊神經震動覺！\n\n📊 糖尿病足部周邊神經檢查器械與標準配置：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>檢查器械項目</th><th>標準規格參數</th><th>負責評估之神經纖維與功能</th></tr></thead>\n<tbody>\n<tr><td><b>單股尼龍纖維</b></td><td><b>10 公克彎曲力道 (5.07 規格)</b></td><td><b>大纖維輕觸壓覺，篩檢保護性感覺 (LOPS)</b></td></tr>\n<tr><td><b>震動音叉</b></td><td><b>128 Hz (cps) 定量/半定量音叉</b></td><td><b>大纖維震動覺（置於大拇趾指甲底骨凸）</b></td></tr>\n<tr><td><b>冷熱試驗棒 (Tip-Therm)</b></td><td>金屬面與塑膠面溫差感受</td><td>小纖維溫度覺（冷熱鑑別）</td></tr>\n<tr><td><b>耳鼻喉科音叉 (不適用)</b></td><td><b>512 Hz (cps) 高頻音叉</b></td><td><b>僅用於耳朵聽力檢測，嚴禁誤用作足部檢查</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十五章 必考考點】：測腳底震動覺請認明「128 Hz 音叉」；「512 Hz 音叉是測耳朵聽力的」，絕不可用！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0830", "chapter": "第十五章 糖尿病足部與口腔照護及衛教", "stem": "[共照網考古題 第 499 題] 志明，65 歲，罹患第2 型糖尿病，最近出現下肢水腫，經醫師檢查後，發現有阻塞性心臟衰竭， 下列照護方式何者是適當的？", "options": ["A. 下肢抬高，超過心臟水平高度", "B. 穿上彈性襪，然後平躺休息", "C. 平躺休息，不需抬高下肢", "D. 坐在椅上，使雙腳自然下垂"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病合併充血性心臟衰竭（CHF）下肢水腫患者之最適照護體位與臨床陷阱。<strong>正確答案為 (D) 坐在椅上，使雙腳自然下垂</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 絕對危險禁忌</span><strong>下肢抬高，超過心臟水平高度 ❌：</strong>這是極為重要的急重症照護陷阱！一般靜脈曲張或低血壓水腫可抬高下肢；但<strong>心臟衰竭患者若將下肢抬高超過心臟，下肢蓄積的大量水腫體液與靜脈血會瞬間大量回流至右心（心臟前負荷 Preload 急遽暴增），衰竭的心臟無法有效泵血，會迅速引爆「急性肺水腫（Acute Pulmonary Edema）與嚴重窒息性呼吸困難」</strong>，甚至致死！故心衰竭水腫絕對禁止抬高下肢。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 照護不適當</span><strong>穿上彈性襪，然後平躺休息 ❌：</strong>穿彈性襪擠壓下肢深部靜脈並平躺，同樣會促使大量血液回流心臟加重心肺衰竭。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 照護不適當</span><strong>平躺休息，不需抬高下肢 ❌：</strong>心衰竭患者平躺會使橫膈上升且肺毛細血管壓升高，引發端坐呼吸（Orthopnea）與陣發性夜間呼吸困難。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 照護最適當（本題正解）</span><strong>坐在椅上，使雙腳自然下垂：</strong>心臟衰竭患者最適體位為<strong>「採高坐臥姿（High-Fowler's position）或坐於椅上，讓雙下肢自然下垂」</strong>！利用重力效應使部分體液滯留於下肢周邊靜脈系統，<strong>減少靜脈回心血量（降低前負荷 Preload）、減少肺部血管淤血</strong>，並使橫膈下降增加肺部擴張空間，最能有效緩解呼吸困難。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：心臟衰竭水腫 vs 一般周邊靜脈水腫體位照護對照表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>疾病水腫病因</th><th>正確照護體位</th><th>生理血流動力學機轉</th><th>嚴格禁忌姿勢</th></tr></thead><tbody><tr><td><strong>充血性心臟衰竭 (CHF)<br>(本題個案)</strong></td><td><strong>坐姿或半坐臥姿，雙腿自然下垂！</strong></td><td><strong>減少靜脈回心血量 (降前負荷)，預防急性肺水腫</strong></td><td><strong>嚴禁平躺或抬高下肢超過心臟！</strong></td></tr><tr><td><strong>單純周邊靜脈曲張 / 靜脈回流不良</strong></td><td>平躺休息，下肢抬高 15~30 度</td><td>利用重力促進下肢靜脈血液與淋巴回流消腫</td><td>長時間久坐或雙腿交叉下垂</td></tr></tbody></table></div>", "memory_core": "【心衰竭水腫體位陷阱】：一般水腫抬高腳；「心衰竭水腫千萬別抬腳（防急性肺水腫）」，要讓雙腳自然下垂！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0871", "chapter": "第十五章 糖尿病足部與口腔照護及衛教", "stem": "[共照網考古題 第 532 題] 第2 型糖尿病患者，因足部肌肉萎縮需穿著特製鞋子，下列何者是穿著此種鞋子的主要目的?", "options": ["A. 緩和局部過度壓力點", "B. 保護腳，避免異物的刺激", "C. 將腳固定在一定的形狀", "D. 增進下肢血液循環"], "answer": "A", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病神經性足部肌肉萎縮畸形時，穿著特製減壓鞋（Therapeutic shoes）之核心主要目的。<strong>正確答案為 (A) 緩和局部過度壓力點</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 A 正確（本題正解，主要目的）</span><strong>緩和局部過度壓力點：</strong>糖尿病運動神經病變會引發足部內在肌群萎縮（Intrinsic foot muscle atrophy），導致肌力失衡、足弓下陷或高弓變形，形成爪狀趾或錘狀趾，使<strong>足底蹠骨頭（Metatarsal heads）與特定受力部位形成「異常極端之局部高壓點（Peak pressure points）」</strong>。患者合併保護感覺喪失時，高壓反覆摩擦會迅速引發皮下組織壞死與神經性潰瘍。特製鞋具與客製減壓鞋墊的<strong>「最核心主要目的，正是將足底承重面積最大化，『有效重新分佈體重、緩和並消除局部過度壓力點（Pressure redistribution & relief）』」</strong>！</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 次要功能</span><strong>保護腳避免異物刺激 ❌：</strong>任何一般合格鞋具均有避免異物刺傷之基礎防護效果，並非特製減壓鞋的專屬特異性主要目的。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 錯誤觀念</span><strong>將腳固定在一定形狀 ❌：</strong>特製鞋應提供寬深容積以「包容足部畸形」，而非強行擠壓固定腳型。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 錯誤觀念</span><strong>增進下肢血液循環 ❌：</strong>特製鞋無法直接擴張動脈增進血流循環。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：糖尿病足病變運動神經萎縮與特製鞋設計原理表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>病理演變階段</th><th>解剖結構改變</th><th>特製減壓鞋之對應功能機轉</th></tr></thead><tbody><tr><td><strong>運動神經病變</strong></td><td>骨間肌、蚓狀肌萎縮，肌腱牽拉失衡</td><td>提供充裕鞋內空間，容納爪狀趾避免磨擦</td></tr><tr><td><strong>骨骼架構畸形</strong></td><td>蹠骨頭向下突出，形成高弓足或爪狀趾</td><td><strong>客製全接觸鞋墊 (Total-contact insole)，分散壓力</strong></td></tr><tr><td><strong>局部高壓集中 (本題)</strong></td><td><strong>行走時蹠骨頭局部壓力飆破安全閾值</strong></td><td><strong>「緩和局部過度壓力點」，預防足底穿透性潰瘍！</strong></td></tr></tbody></table></div>", "memory_core": "【特製鞋最大功用】：肌肉萎縮足底壓力失衡，穿特製鞋首要「緩和局部高壓點」防破皮潰瘍！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0252", "chapter": "第十八章 衛教的評價與成果評量", "stem": "在評估衛教成效時，布魯姆（Bloom）教育目標分類將學習成果劃分為三大領域，下列何者不屬於這三大領域？", "options": ["A. 認知領域（Cognitive domain）：評估個案對疾病知識與飲食計算之理解分析", "B. 技能領域（Psychomotor domain）：評估指尖採血與胰島素注射之操作熟練度", "C. 本能領域（Innate physiological domain）：評估未經學習即自發調控之神經反應", "D. 情意領域（Affective domain）：評估個案接納罹病事實之態度與行為改變承諾"], "answer": "C", "explanation": "布魯姆（Bloom）教育目標分類三大支柱：(1) 認知領域（Cognitive domain）：知識理解、記憶與應用；(2) 技能/心理動作領域（Psychomotor domain）：實際手部操作技能與熟練度；(3) 情意領域（Affective domain）：態度、價值觀、情感接納與承諾。本能生理反應非屬教育評量之學習領域。", "memory_core": "【衛教三大領域評量】：認知（知識理解）、技能（實體操作）、情意（態度信念）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0260", "chapter": "第十八章 衛教的評價與成果評量", "stem": "衛教評量中的「形成性評量（Formative Evaluation）」與「總結性評量（Summative Evaluation）」的主要差異為何？", "options": ["A. 形成性評量著重於課程結束時之總體成效鑑定；總結性評量著重於教學過程中的即時回饋", "B. 形成性評量於教學進行中評估學習進度以動態微調策略；總結性評量於介入結束後評估成效", "C. 形成性評量僅能評估生理臨床檢驗指標；總結性評量則專門用於評估個案對課程之主觀滿意", "D. 形成性評量由個案自行填寫主觀自評表；總結性評量則完全由醫師單方面進行客觀病歷審查"], "answer": "B", "explanation": "形成性評量（Formative Evaluation）是在教學過程中持續進行（如提問、回示教、觀察反應），旨在即時掌握學習盲點並動態修正教學計畫；總結性評量（Summative Evaluation）則在整個方案結束後實施，旨在驗證學習目標達成度與臨床成效指標。", "memory_core": "【形成性 vs 總結性評量】：形成性（教學中即時反饋調整）；總結性（教學結束後結算成果成效）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0263", "chapter": "第十八章 衛教的評價與成果評量", "stem": "若某醫院執行之糖尿病衛教方案評估發現，病患的「知識測驗成績高達 95 分，但日常自我監測率與運動達成率卻極低，HbA1c 毫無改善」，這提示衛教團隊最大的核心問題為何？", "options": ["A. 衛教課程講授時數過短，應將現行之知識課表延長一倍以強化個案之醫學記憶", "B. 個案認知功能普遍退化，無法理解測驗內容之深意故導致臨床數據無法同步改善", "C. 測驗試題難度過於艱深，導致個案因考試挫折感而刻意放棄執行日常自我監測行為", "D. 衛教僅停留在單向知識灌輸，缺乏促進知行合一的技能演練、問題解決與動機賦能"], "answer": "D", "explanation": "「知道不等於做得到（Knowing does not mean doing）」。若衛教僅聚焦於
