 {"id": "CDE-EXAM-0283", "chapter": "第十八章 衛教的評價與成果評量", "stem": "衛教師評估一位個案的足部照護衛教成果時，下列何者屬於「行為層次（Behavioral Level）」的評量結果？", "options": ["A. 個案於日常生活中確實做到每日睡前以鏡子檢視足底並穿著合適保護鞋襪之習慣", "B. 個案於滿意度問卷中對足部衛教課程之實用性與講師態度給予高度正向肯定評價", "C. 個案於門診紙筆測驗中能完整默寫出預防糖尿病足部潰瘍之五大日常防護核心守則", "D. 個案之周邊動脈搏動良好且單絲觸覺檢查顯示未發生周邊感覺神經病變臨床徵象"], "answer": "A", "explanation": "成效評量層次區分：B 屬反應層次（滿意度）；C 屬學習層次（知識默寫）；D 屬結果層次（臨床神經檢查）；唯有 A（個案在真實日常生活中切實執行每日檢查足底行為）屬於真正的「行為層次（Behavior level）」。", "memory_core": "【行為層次評量準則】：不是考病患「懂不懂、背不背得出來」，而是檢視病患「做到了沒有」！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0992", "chapter": "第十六章 衛教評估臨床應用及衛教計劃之擬定", "stem": "[共照網考古題 第 688 題] 為促使計畫有效推展，須注意下列哪一項原則", "options": ["A. 以專業的考量提供病人適當的計畫", "B. 訂定學習目標來代替行為目標", "C. 選擇教學策略時優先考慮時間成本", "D. 教育計畫由專業人員及病人共同決定"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十六章 衛教評估臨床應用 (共照網考古 第688題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 單憑專業人員的主觀考量單向指派計畫，缺乏病患參與感，病患遵從度必然低下。\n🔹 (B) 行為目標（能在生活中實踐的具體動作）是自我管理成效的基石，絕不能單以認知上的學習目標來代替行為目標。\n🔹 (C) 教學策略應以病患的學習效益、理解力與生活可行性為優先，絕非單純圖省事的「時間成本」。\n🔹 (D) 正確。現代糖尿病自我管理教育與支持 (DSMES) 國家標準指引第一原則：為確保衛教計畫能被病患長期接受並有效推展落實，整個教育計畫必須建立在「專業醫護團隊與病患雙方共同協商決定（Collaborative decision making）」之上，以病人為中心，賦予病患決策自主權。\n\n📊 以病人為中心 (Patient-Centered) 衛教計畫推動準則：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>評鑑指標</th><th>符合指引標準做法</th><th>威權傳統錯誤做法</th></tr></thead>\n<tbody>\n<tr><td><b>計畫主導權</b></td><td><b>「專業人員與病人雙方共同決定」</b></td><td>醫療人員單方下達命令指派</td></tr>\n<tr><td><b>目標訂定</b></td><td>落實具體、可觀察量化的<b>「行為目標」</b></td><td>僅列模糊的知識口號</td></tr>\n<tr><td><b>策略選擇</b></td><td>配合病人的生活作息、學習偏好與文化</td><td>以衛教師省時間或醫院便利為優先</td></tr>\n</tbody></table></div>", "memory_core": "【第十六章 必考考點】：衛教計畫有效推展的黃金原則：計畫必須由「專業人員及病人共同決定」！以病人為中心。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0225", "chapter": "第十四章 糖尿病大血管併發症", "stem": "高血壓衛教之「722 居家血壓量測原則」，其標準具體操作規範為何？", "options": ["A. 就診前連續量測「7」週、每週固定量「2」天、每次於飯後量測「2」次取最低值", "B. 就診前連續量測「7」天、每日早晚「2」個時段、每次量測「2」遍（間隔1分鐘取平均）", "C. 針對年滿「70」歲長者、每日清晨量「2」次、每次需閉氣「2」分鐘後記錄讀數", "D. 門診量測「7」分鐘、休息「20」秒後量「2」次、取最高血壓作為用藥調整依據"], "answer": "B", "explanation": "高血壓衛教 722 原則：就診前連續「7」天量測、每天「2」個時段（晨起排尿服藥前、夜間就寢前）、每次量「2」遍（每次間隔 1 分鐘，取兩次平均值），能有效排除白袍高血壓與隱匿性高血壓，反映真實血壓狀態。", "memory_core": "【血壓量測 722 口訣】：連續 7 天、早晚 2 回、每次量 2 遍取平均值！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0231", "chapter": "第十四章 糖尿病大血管併發症", "stem": "「心肌梗塞（Myocardial Infarction）」在糖尿病患者身上發作時，約有高達三分之一可能表現為「無痛性（Silent Ischemia）」，其臨床最危險的常見非典型症狀為何？", "options": ["A. 雙耳外耳道劇烈搔癢伴隨面頸部瀰漫性急性紅疹與水腫", "B. 顳顎關節自發性僵硬伴隨急性牙齦出血與下顎骨劇痛", "C. 體溫急遽攀升超過 40℃ 伴隨全身劇烈寒顫與肌肉酸痛", "D. 缺乏典型胸痛，而突發嚴重呼吸急促、冒冷汗、虛脫或反胃嘔吐"], "answer": "D", "explanation": "因糖尿病自主神經病變破壞心臟內臟感覺神經傳導，高達三分之一的糖尿病個案在急性心肌缺血發作時「完全不自覺胸痛（無痛性心肌梗塞 Silent MI）」。臨床常僅表現為非典型的突發性嚴重氣喘、不明原因大量冷汗、極度虛弱昏厥、噁心嘔吐或上腹不適，極易被延誤救治而危及生命。", "memory_core": "【無痛性心肌梗塞警訊】：完全無胸痛！突發氣喘、暴冷汗、極度虛弱噁心，應立即做心電圖搶救！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0236", "chapter": "第十四章 糖尿病大血管併發症", "stem": "缺血性腦中風（Ischemic Stroke）在第 2 型糖尿病人之發病率比一般人高出 2-4 倍，在腦中風急性發作之黃金處置窗口中，下列何項原則完全正確？", "options": ["A. 急性期血糖目標宜維持在 140～180 mg/dL，嚴格避免低血糖與極度高血糖", "B. 急性期不論血壓數值高低，應於發病一小時內常規將收縮壓降至 110 以下", "C. 急性期只要血糖高於 150 mg/dL，應立即靜脈推注胰島素使血糖降至 60", "D. 急性中風吞嚥困難患者，應立即開立大劑量口服磺醯尿素類降血糖藥維持"], "answer": "A", "explanation": "急性缺血性腦中風發作時，過度高血糖（> 180 mg/dL）會加劇腦組織無氧代謝乳酸蓄積並擴大腦梗塞缺血半影區損傷；而低血糖則直接剥奪腦神經元能量供應導致不可逆壞死。指引建議急性中風黃金期血糖應穩定控制於 140～180 mg/dL 之間，兼顧神經細胞能量需求與避免低血糖傷害。", "memory_core": "【急性中風控糖靶心】：維持血糖 140~180 mg/dL！既防乳酸中毒腦損傷，又防低血糖腦死亡。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0482", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 58 題] 糖尿病的營養治療目標，成人的三酸甘油脂(TG)值正常範圍為", "options": ["A. ＜150 mg/dl", "B. ＜200 mg/dl", "C. 200~299 mg/dl", "D. 300~400 mg/dl"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第十四章 糖尿病血脂異常管理目標 (共照網考古 第58題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。依據美國糖尿病學會 (ADA)、中華民國糖尿病學會及國際心血管治療指引，成人空腹血清三酸甘油酯（TG）之標準正常理想範圍為「＜ 150 mg/dL」！\n- **正常理想 (Normal)**：＜ 150 mg/dL。\n- **臨界偏高 (Borderline-high)**：150 - 199 mg/dL。\n- **偏高 (High)**：200 - 499 mg/dL。\n- **極高 (Very high)**：≧ 500 mg/dL（具急性胰臟炎致命風險，需優先使用 Fibrate 藥物降 TG）。\n🔹 (B)(C)(D) 皆屬於臨界偏高或異常區間。\n\n📊 成人空腹血清三酸甘油酯 (TG) 臨床分級與照護處置表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>三酸甘油酯 (TG) 數值</th><th>臨床風險等級定義</th><th>主要致病隱患</th><th>第一線臨床治療介入策略</th></tr></thead>\n<tbody>\n<tr><td><b>＜ 150 mg/dL</b></td><td><b>標準正常範圍 (理想目標)</b></td><td><b>心血管硬化風險最低</b></td><td><b>維持均衡飲食、規律運動生活型態</b></td></tr>\n<tr><td>150 - 199 mg/dL</td><td>臨界偏高 (Borderline)</td><td>代謝症候群潛伏</td><td>減重、嚴格限制含糖飲料與精緻澱粉、戒酒</td></tr>\n<tr><td>200 - 499 mg/dL</td><td>偏高 (High)</td><td>致粥瘤性殘留顆粒增加</td><td>生活型態改變 + 優先以 Statin 治療達標 LDL</td></tr>\n<tr><td><b>≧ 500 mg/dL</b></td><td><b>極高 (Very High)</b></td><td><b>誘發急性壞死性胰臟炎！</b></td><td><b>緊急首選 Fibrate 降 TG，預防急性胰臟炎</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：成人三酸甘油酯 (TG) 正常範圍：【＜ 150 mg/dL】！≧ 500 mg/dL 易引發急性胰臟炎。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0489", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 65 題] 有關與病人共同設定短期目標，下列何者為非 ?", "options": ["A. 僅提供個人在一小段時間的努力焦點", "B. 訪談時須了解目標達成的過程", "C. 主要目的是為了達成長期目標", "D. 需設定每次訪談時間的間隔"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 目標設定理論 (Goal Setting) 與賦權衛教 (共照網考古 第65題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者為非）。依據行為改變心理學與自我效能理論，與病患共同設定短期目標（Short-term goals）絕非「僅僅提供個人在一小段時間的努力焦點」；短期目標的核心價值在於「化整為零」，藉由具體、可達成的小步驟（如每週多走 3 天路），讓病患不斷累積微小成功的自我效能感（Self-efficacy），進而逐步搭建通往「長期終極健康目標」的堅實橋樑。因此選項武斷使用「僅提供...」，徹底抹煞了短期目標轉化為長期生活習慣的本質意義，故敘述錯誤。\n🔹 (B) 訪談時需深入了解目標達成歷程與執行障礙，以利滾動式修正。\n🔹 (C) 短期目標的終極目的正是為了循序漸進達成長期目標。\n🔹 (D) 必須設定清晰的追蹤回診間隔（如 2-4 週），以維持動能與回饋。\n\n📊 SMART 原則在糖尿病短期目標設定中之應用：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>SMART 原則要素</th><th>臨床衛教具體實務意義</th><th>衛教設定良好範例</th></tr></thead>\n<tbody>\n<tr><td><b>S (具體明確 Specific)</b></td><td>明確指出改變之行為動作與情境</td><td>「每週一、三、五晚餐後快走」</td></tr>\n<tr><td><b>M (可測量 Measurable)</b></td><td>具備客觀計量次數或時間</td><td>「每次快走 30 分鐘，計步 4000 步」</td></tr>\n<tr><td><b>A (可達成 Achievable)</b></td><td>符合病患體能，累積微小成功經驗</td><td>循序漸進建立自信，避免目標過高挫折放棄</td></tr>\n<tr><td><b>R / T (相關性與時限)</b></td><td>切合降糖目標，設定明確追蹤時程</td><td><b>「兩週次回診檢視執行日誌並給予正向回饋」</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：短期目標不僅是短期焦點，更是「累積自我效能、達成終極長期目標」的關鍵基石！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0516", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 94 題] 有關糖尿病對冠心症的敘述何者為錯誤？", "options": ["A. 糖尿病為冠心症危險因子", "B. 血脂異常為冠心症危險因子", "C. 高血壓為冠心症危險因子", "D. 男性糖尿病因合併高血壓而增加冠心症的風險高於女性"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十四章 冠心症性別流行病學與血管風險 (共照網考古 第94題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)(B)(C) 糖尿病、血脂異常（高 LDL-C）與高血壓為舉世公認之動脈粥狀硬化性冠心症（CHD/CAD）三大確立獨立危險因子。\n🔹 (D) 正確（何者為錯誤）。在非糖尿病人群中，停經前女性因雌激素保護，冠心症風險顯著低於同齡男性；然而「糖尿病會徹底摧毀女性天生對心血管的保護優勢」！大型流行病學研究（如 Framingham Heart Study）明確證實：糖尿病合併高血壓時，女性罹患冠心症的相對風險增幅（Relative Risk 增加 3-4 倍）遠高於男性（男性增加約 2 倍），且女性糖尿病患者在急性心肌梗塞後的預後與死亡率亦顯著劣於男性！故「男性因高血壓增加冠心症風險高於女性」是完全錯誤的陳述。\n\n📊 糖尿病對男性 vs 女性心血管風險衝擊流行病學對比表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>心血管評估指標</th><th>女性糖尿病患者 (Females)</th><th>男性糖尿病患者 (Males)</th><th>臨床核心考點結論</th></tr></thead>\n<tbody>\n<tr><td><b>相較非糖尿病同性之冠心症相對風險</b></td><td><b>暴增 3 至 4 倍以上！</b></td><td>增加約 2 倍</td><td><b>糖尿病抹平女性心血管荷爾蒙保護傘！</b></td></tr>\n<tr><td>心肌梗塞後死亡率</td><td>顯著較高，預後較差</td><td>相對略低</td><td>女性糖尿病心血管篩檢需更積極嚴格</td></tr>\n<tr><td>典型症狀表現</td><td>非典型胸悶、呼吸急促、疲憊常見</td><td>典型胸骨後壓榨性疼痛較多</td><td>非典型症狀易被延誤就醫</td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：糖尿病徹底摧毀女性的心血管優勢！女性糖尿病患心血管發病與死亡相對風險「遠高於男性」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0561", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 140 題] 對減重者，在便利商店購買午餐時，下列何者是較好的選擇?", "options": ["A. 一個御飯糰+一盒500cc 全脂鮮奶", "B. 一盒水果+一盒500cc 全脂鮮奶", "C. 一盒水果+一個茶葉蛋", "D. 一盒生菜沙拉+五枝黑輪"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 便利商店外食外購營養調配實務 (共照網考古 第140題)\n💡 臨床深度題解與選項剖析：\n🔹 減重飲食核心在於「充足蔬菜纖維、適度蛋白質、嚴控精緻糖與脂肪、製造適當熱量赤字」：\n🔹 (A) 御飯糰（全澱粉約 2.5 份主食 = 37g 醣）＋ 500cc 全脂鮮奶（高達 25g 醣、16g 脂肪，熱量約 325 大卡），兩者相加總熱量超過 550 大卡且完全缺乏蔬菜纖維。\n🔹 (B) 一盒水果（純果糖 15-30g）＋ 500cc 全脂鮮奶（高糖高脂），極度不均衡。\n🔹 (C) 水果 + 茶葉蛋：熱量過低（僅約 140 大卡），缺乏主食與足量蔬菜，難以維持下午體能且易引發飢餓暴食。\n🔹 (D) 正確。一盒生菜沙拉（提供大量非澱粉膳食纖維與微量元素，延緩吸收增加飽足感）＋ 五枝關東煮黑輪（如白蘿蔔、蒟蒻絲、竹輪、魚豆腐等提供適量飽足蛋白質與熱量，且避免油炸），熱量控制在 250-350 大卡之間，兼具高纖與飽足感，為超商減重午餐的最佳優選。\n\n📊 便利商店減重午餐四大組合營養優缺點評估表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>午餐配餐組合</th><th>膳食纖維含量</th><th>蛋白質與油脂品質</th><th>臨床減重衛教評價</th></tr></thead>\n<tbody>\n<tr><td>(A) 御飯糰 + 500cc全脂奶</td><td>極低 (幾近無)</td><td>高精緻澱粉、全脂乳高飽和脂肪</td><td>熱量偏高，易誘發餐後嗜睡</td></tr>\n<tr><td>(B) 水果盒 + 500cc全脂奶</td><td>低 (僅果膠)</td><td>雙重高糖份 (果糖+乳糖)</td><td>升糖過速，缺乏正餐滿足感</td></tr>\n<tr><td><b>(D) 生菜沙拉 + 五枝黑輪</b></td><td><b>極豐富 (高纖維)</b></td><td><b>低脂水煮關東煮，適量蛋白質</b></td><td><b>熱量適中 (約300卡)，高飽足首選！</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：超商減重午餐首選：【高纖生菜沙拉搭配低脂關東煮 (黑輪/蒟蒻/蘿蔔)】！避免 500cc 全脂奶。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0596", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 186 題] 糖尿病患旅遊時，下列何項物品可不用攜帶？", "options": ["A. 血糖監測裝備", "B. 升糖素", "C. 糖尿病識別卡", "D. 血壓器"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 糖尿病患外出與旅遊照護指南 (共照網考古 第186題)\n💡 臨床深度題解與選項剖析：\n🔹 糖尿病患旅遊外出時，隨身行李準備應遵循「即時搶救生命、即時監測、預防低血糖」原則：\n🔹 (A) 血糖監測裝備（血糖機、採血針、足量試紙、備用電池）：旅遊時活動量與進食時間異動劇烈，必須隨身攜帶隨時測量。\n🔹 (B) 升糖素（Glucagon 筆針或鼻噴劑）：第 1 型或使用胰島素病患發生嚴重意識不清低血糖時的唯一救命急救藥，必須隨身攜帶。\n🔹 (C) 糖尿病識別卡（或醫療警示手環）：註明病名、緊急聯絡人與急救指示，於發生意外或低血糖昏迷時供外界即時辨識施救。\n🔹 (D) 正確（何項可不用攜帶）。「血壓計」體積與重量較大，且血壓在數天至一兩週的旅遊期間通常處於慢性管理範疇，極罕見在幾小時內發生不可逆急性生命危害；相較於血糖機、升糖素與識別卡等「絕對不可離身之隨身急救防護品」，一般非重症高血壓患者在短期旅遊中「可不用隨身攜帶血壓計」。\n\n📊 糖尿病患旅遊必備清單優先順序分級表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>攜帶優先等級</th><th>必備物品清單內容</th><th>臨床防護與急救目的</th></tr></thead>\n<tbody>\n<tr><td><b>第一級：隨身絕對必需</b></td><td><b>血糖機與試紙、速效糖包、升糖素、胰島素與針頭、糖尿病識別卡</b></td><td><b>防範突發急性低血糖休克與高血糖急症，隨身登機</b></td></tr>\n<tr><td>第二級：常規用藥與備品</td><td>雙倍份量常規口服降糖藥、處方箋影本、舒適包鞋與備用棉襪</td><td>防範行李遺失與海外購藥困難</td></tr>\n<tr><td><b>第三級：非絕對必需</b></td><td><b>常規居家血壓計</b></td><td><b>體積大，短期旅遊無急救迫切性，非必帶物品</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：旅遊隨身必帶：血糖機、升糖素、識別卡、糖包；「血壓計」非隨身急救必需品，可免帶！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0680", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 293 題] 下列有關血糖控制與糖尿病併發症的敘述中，何者錯誤？", "options": ["A. 心血管疾病和腦血管疾病是第2 型糖尿病患者的重要死亡原因。", "B. 嚴格的血糖控制對於改善大血管病變效果相當明顯。", "C. 嚴格的血糖控制能預防糖尿病的小血管病變。", "D. 血糖的良好控制可以減少60%的神經病變。"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第十四章 糖尿病大血管併發症 (共照網考古 第293題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 心血管疾病（冠心病、心肌梗塞）與腦中風是第 2 型糖尿病患者最首要的死亡病因。\n🔹 (B) 正確（何者錯誤）。各大里程碑臨床試驗（如 UKPDS、ACCORD、ADVANCE、VADT）證實：嚴格的血糖控制對於預防「小血管病變（視網膜、腎臟、神經）」效果極為顯著，但對於「大血管病變（ASCVD）」在短期內效果並不顯著，大血管病變主要取決於血壓、血脂（Statin）與抗血小板藥物等多重危險因子綜合控制。\n🔹 (C) 嚴格控制血糖能顯著降低微量白蛋白尿、視網膜病變及光凝固手術需求等微血管併發症。\n🔹 (D) DCCT 等長期追蹤研究證實積極良好控制血糖可降低約 60% 的神經病變發生風險。\n\n📊 血糖控制對小血管 vs 大血管併發症防禦效能對照：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>併發症類別</th><th>受累血管與器官</th><th>嚴格降血糖之預防效益</th><th>主要控制關鍵武器</th></tr></thead>\n<tbody>\n<tr><td><b>小血管併發症</b></td><td>視網膜、腎絲球、滋養神經微血管</td><td><b>極為顯著 (顯著降低 30%～60%)</b></td><td><b>HbA1c 嚴格達標 (&lt; 7.0%)</b></td></tr>\n<tr><td><b>大血管併發症</b></td><td>冠狀動脈、腦動脈、周邊下肢動脈</td><td><b>短期效果相對不明顯（需極長年遺贈效應）</b></td><td><b>綜合 ABCDE 管理：血壓 (&lt;130/80)、血脂 (Statin)、抗血小板藥</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：嚴格控糖防「小血管（眼、腎、神經）」神效（減 60%）；防「大血管（心、腦）」單靠控糖不夠，必靠血壓血脂！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0745", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 379 題] 糖尿病病人合併有血脂肪異常，以下何者為第一個治療目標？", "options": ["A. Total cholesterol", "B. HDL-cholesterol", "C. LDL-cholesterol", "D. Triglyceride"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十四章 糖尿病血脂異常首要治療目標 (共照網考古 第379題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 總膽固醇 (TC)：包含好與壞膽固醇，非特異性治療標靶。\n🔹 (B) 高密度脂蛋白 (HDL-C)：保護性指標，缺乏特異性強力藥物能單純提升 HDL 而明確降低心血管事件。\n🔹 (C) 正確。依據美國糖尿病學會 (ADA)、歐洲心臟學會 (ESC) 及中華民國糖尿病學會臨床照護指引，糖尿病患者合併血脂肪異常時，「低密度脂蛋白膽固醇（LDL-C）是公認且絕對的第一治療目標（Primary Target）」！因為無數大型隨機對照試驗證實，降低 LDL-C 與減少動脈粥狀硬化性心血管事件（心肌梗塞、缺血性中風、心血管死亡）具備最強大、最直接的線性因果關係，故所有降脂策略首選使用 Statin 類藥物將 LDL-C 降至目標值（一般糖尿病人 ＜ 70 mg/dL，合併 ASCVD 極高風險者 ＜ 55 mg/dL）。\n🔹 (D) 三酸甘油酯 (TG)：為次要或第二治療目標（除非極端嚴重 ≧ 500 mg/dL 需先防胰臟炎）。\n\n📊 糖尿病血脂異常管理治療目標優先順序表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>治療目標順位</th><th>血脂監測指標</th><th>臨床控制標準 (2026 最新指引)</th><th>第一線首選藥物介入</th></tr></thead>\n<tbody>\n<tr><td><b>第 1 目標 (Primary Target)</b></td><td><b>低密度脂蛋白 (LDL-C)</b></td><td><b>一般病患 ＜ 70；合併 ASCVD ＜ 55 mg/dL</b></td><td><b>中高強度 Statin 類 (首選必考)</b></td></tr>\n<tr><td>第 2 目標 (Secondary)</td><td>非高密度脂蛋白 (Non-HDL-C)</td><td>比 LDL-C 目標多 30 mg/dL (＜ 100 或 85)</td><td>Statin 劑量強化、併用 Ezetimibe</td></tr>\n<tr><td>輔助次要目標</td><td>三酸甘油酯 (TG)</td><td>維持 ＜ 150 mg/dL</td><td>生活型態戒酒、減重、高純度 EPA / Fibrate</td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：糖尿病血脂異常第一治療目標：【低密度脂蛋白膽固醇 (LDL-C)】！首選 Statin 降脂。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0824", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 493 題] 下述選項中，正確的敘述應包括： (1)所有的第2 型糖尿病患者皆須作嚴格的血糖控制以預防糖尿病的相關併發症。 (2)嚴格的血糖控制常導致高胰島素血症及體重穩定不變。 (3)嚴格血糖控制對於糖尿病小血管病變的預防特別重要。 (4)嚴格血糖控制對改善大血管病變效果不如小血管病變明顯。", "options": ["A. 1+2+3", "B. 2+3+4", "C. 1+3+4", "D. 1+2+3+4"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十四章 大血管併發症與血糖控制 (共照網考古 第493題)\n💡 臨床深度題解與選項剖析：\n🔹 (1) 正確。所有第 2 型糖尿病患者在避免嚴重低血糖的前提下，皆須藉由良好血糖控制預防微血管與各類併發症。\n🔹 (2) 錯誤。嚴格積極的血糖控制常導致體重「增加」（因外源胰島素或促泌劑促進合成、尿糖漏出停止），體重絕非「穩定不變」。\n🔹 (3) 正確。各大型臨床試驗（UKPDS、DCCT 等）證實：嚴格血糖控制對於預防視網膜、腎臟與神經等「小血管病變」效果最為顯著。\n🔹 (4) 正確。流行病學實證顯示，嚴格降血糖對改善「大血管病變（心肌梗塞、中風）」之成效不如小血管病變明顯（大血管需更依賴血脂、血壓及抗血小板藥物之綜合控制）。\n綜上分析，正確敘述為 (1) + (3) + (4)，答案選 C。\n\n📊 嚴格血糖控制對大小血管併發症防護效益矩陣：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>併發症類別</th><th>受累解剖結構</th><th>嚴格控糖之預防效益</th><th>臨床預防核心武器</th></tr></thead>\n<tbody>\n<tr><td><b>小血管病變</b></td><td><b>視網膜、腎絲球、周邊神經</b></td><td><b>成效極為明顯 (風險下降 30%～60%)</b></td><td><b>以嚴格控糖為核心基石 (A1c < 7%)</b></td></tr>\n<tr><td><b>大血管病變</b></td><td>冠狀動脈、腦動脈、下肢動脈</td><td><b>短期成效相對不如小血管明顯</b></td><td><b>需綜合控制：Statin 降脂、降血壓、Aspirin</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：嚴格控糖對「小血管」保護顯著，對「大血管」不如小血管明顯；積極控糖常伴隨「體重增加」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0873", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 534 題] 關於糖尿病患者使用『減肥藥物』，下列何者錯誤？", "options": ["A. 在減重開始進行時，需由醫師仔細評估，以確保藥物的安全及有效。", "B. 血壓及心跳下降是減肥藥諾美婷（sibutramine）的主要副作用。", "C. 脂溶性維生素吸收不良是減肥藥羅氏鮮（orlistat）的副作用。", "D. 使用減肥藥物略優於單獨調整生活型態的減重效果。"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 減重藥物藥理機制與心血管安全性 (共照網考古 第534題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 減重藥物介入前需經醫師嚴謹評估適應症與共病禁忌。\n🔹 (B) 正確（何者錯誤）。**諾美婷（Sibutramine）** 是一種中樞型血清素（5-HT）與正腎上腺素（NE）再吸收抑制劑，透過抑制食慾達到減重；但正腎上腺素濃度增加會產生強烈的擬交感神經作用，導致「**血壓升高與心跳加快 (Tachycardia and Hypertension)**」，在大型 SCOUT 臨床試驗中證實顯著增加心肌梗塞與中風風險而遭全球下架禁用！因此宣稱其副作用為「血壓及心跳下降」完全與事實相反，是錯誤的陳述。\n🔹 (C) 羅氏鮮（Orlistat / 脂樂克）為胃腸道脂解酶抑制劑，阻斷 30% 膳食脂肪吸收，未被吸收的脂肪隨糞便排出時會連帶吸附「脂溶性維生素（A、D、E、K）與 β-胡蘿蔔素」，引發吸收不良，需睡前額外補充綜合維生素。\n🔹 (D) 減重藥物配合生活型態改變，減重幅度通常略優於單純飲食運動。\n\n📊 傳統減重藥物機制與核心副作用比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>減重藥物品名</th><th>藥理作用機轉</th><th>代表性核心不良反應</th><th>心血管與臨床警戒</th></tr></thead>\n<tbody>\n<tr><td><b>諾美婷 (Sibutramine)</b></td><td>中樞血清素/正腎上腺素再吸收抑制</td><td><b>血壓上升、心跳加快、口乾、失眠</b></td><td><b>增加心肌梗塞中風風險，已遭全面撤照下架！</b></td></tr>\n<tr><td><b>羅氏鮮 (Orlistat)</b></td><td><b>抑制胃腸道脂解酶，阻斷脂肪吸收</b></td><td><b>油便、脂肪瀉、排氣排油、干擾脂溶性維生素 A,D,E,K 吸收</b></td><td>需在睡前或與藥物間隔 2 小時補充脂溶性維生素</td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：諾美婷 (Sibutramine) 會使【血壓升高、心跳加快】（非下降！），因心血管風險已下架；羅氏鮮干擾脂溶性維生素！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0953", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 624 題] 原發性高血壓患者，建議每天鈉攝取量為多少毫克可有效降低血壓？", "options": ["A. 5200", "B. 4600", "C. 2400", "D. 1000"], "answer": "C", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第十四章 糖尿病大血管併發症）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. 5200</b>：5,200 毫克鈉（相當於 13 公克食鹽）嚴重超標。</li><li><b>(B) B. 4600</b>：4,600 毫克鈉（相當於 11.5 公克食鹽）嚴重超標。</li><li><b>(C) C. 2400（正確答案）</b>：<b>本題正確答案（2,400 毫克）</b>。依據台灣高血壓與糖尿病臨床照護指引，原發性高血壓及糖尿病患者建議每天 <b>「鈉（Sodium）」攝取量應限制在 2,400 毫克（2.4 公克）以下（相當於每日食鹽氯化鈉 $\\text{NaCl}$ 不超過 6 公克）</b>，即可有效降低收縮壓約 2～8 mmHg！</li><li><b>(D) D. 1000</b>：1,000 毫克鈉（2.5g 鹽）過度嚴苛，非一般高血壓患者之常規建議門檻（一般建議 1,500～2,400 mg）。</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 高血壓與糖尿病患者「每日限鈉 vs 限鹽」換算對照表：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">營養素指標</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">每日建議攝取上限</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">換算關係（1 公克食鹽 ＝ 400 毫克鈉）</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>每日「鈉 (Na)」攝取量</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>2,400 毫克（2.4 公克，本題正解 C）</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">2,400 mg 鈉 ÷ 400 ＝ 6 公克食鹽</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\">每日「食鹽 (NaCl)」攝取量</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">6 公克</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">相當於 1 茶匙食鹽</td></tr></tbody></table></div>", "memory_core": "【限鈉限鹽必背公式】：每日「鈉」≦ 2,400 毫克（2.4 公克）＝ 每日「食鹽」≦ 6 公克！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0985", "chapter": "第十四章 糖尿病大血管併發症", "stem": "[共照網考古題 第 681 題] 評量糖尿病品質改善計畫(Diabetes Quality Improvement Program)之盡責度，不包括下列哪一項？", "options": ["A. 空腹血脂檢查", "B. 腰圍臀圍的測量", "C. HbA1c 檢測", "D. 檢查眼睛"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 糖尿病照護品質改善計畫 (DQIP) 核心指標 (共照網考古 第681題)\n💡 臨床深度題解與選項剖析：\n🔹 美國國家品質保證委員會（NCQA）與美國糖尿病學會（ADA）共同制定的「糖尿病品質改善計畫（Diabetes Quality Improvement Program, DQIP）」明訂了評量醫療院所與照護團隊臨床「盡責度 / 過程品質指標（Accountability Measures / Process Measures）」：\n- **A. 空腹血脂檢查**：DQIP 要求每年至少檢測一次血脂譜（特別是 LDL-C）。\n- **C. HbA1c 檢測**：DQIP 要求每年至少檢測 1-2 次以上糖化血色素。\n- **D. 檢查眼睛**：DQIP 要求每年至少由眼科醫師進行一次散瞳眼底檢查或眼底照相。\n- 其他核心指標包括：每年微量白蛋白尿篩檢（UACR）、每年足部完整視檢評估。\n🔹 (B) 正確（不包括下列哪一項）。「腰圍與臀圍的測量」雖然是評估肥胖與代謝症候群的常見體位指標，但並未列為 DQIP 正式法定的核心「臨床盡責度考核指標」，故為不包括的項目。\n\n📊 糖尿病照護品質計畫 (DQIP / P4P 照護網) 核心評量盡責度指標清單：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>DQIP 核心臨床盡責度指標</th><th>規範執行頻率標準</th><th>臨床考核目的</th></tr></thead>\n<tbody>\n<tr><td><b>糖化血色素 (HbA1c) 檢測</b></td><td><b>每年至少 2 次 (每 3-6 個月一次)</b></td><td>評估中長期血糖代謝達標率</td></tr>\n<tr><td><b>空腹血脂 (Lipid profile) 檢查</b></td><td><b>每年至少 1 次 (包含 LDL/HDL/TG)</b></td><td>評估心血管 ASCVD 動脈硬化風險</td></tr>\n<tr><td><b>散瞳視網膜眼底檢查 (Eye exam)</b></td><td><b>每年至少 1 次</b></td><td>早期攔截增殖型視網膜病變與黃斑部水腫</td></tr>\n<tr><td><b>尿液微量白蛋白 (UACR) 篩檢</b></td><td><b>每年至少 1 次</b></td><td>早期篩檢糖尿病腎病變 (DKD)</td></tr>\n<tr><td><b>完整足部感覺神經檢查</b></td><td><b>每年至少 1 次</b></td><td>預防足部潰瘍與截肢</td></tr>\n<tr><td><b>腰圍臀圍測量 (未列入)</b></td><td><b>非 DQIP 核心盡責度指標 (本題考點)</b></td><td>臨床輔助衛教，非品質強制稽核項目</td></tr>\n</tbody></table></div>", "memory_core": "【第十四章 必考考點】：DQIP 品質盡責度五大支柱：A1c、血脂、眼底、微量蛋白尿、足部；【腰圍臀圍測量】非核心指標！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0148", "chapter": "第十章 高血糖急症", "stem": "有關「高血糖高滲透壓狀態（Hyperosmolar Hyperglycemic State, HHS）」的臨床特徵，下列敘述何者「錯誤」？", "options": ["A. 意識障礙、嗜睡甚至深度昏迷之發生比例與神經學病徵，顯著高於典型之糖尿病酮酸中毒", "B. 常見於高齡之第 2 型糖尿病個案，多伴隨急性肺部感染、腦中風或水分攝取不足而誘發", "C. 患者體內脂肪大量分解，動脈血氣分析必呈現重度代謝性酮酸中毒且陰離子間隙極度擴大", "D. 血糖通常極度攀升（多 > 600 mg/dL），且有效血漿滲透壓顯著升高（> 320 mOsm/kg）"], "answer": "C", "explanation": "HHS 病人體內仍有微量內生性胰島素足以抑制脂肪分解與酮體生成，因此通常「無顯著酸中毒」（動脈血 pH 多 > 7.30，HCO3⁻ > 18 mEq/L，無或微量酮體）。重度代謝性酮酸中毒為重度 DKA 之特徵，非 HHS 特徵。", "memory_core": "【HHS 核心特徵】：血糖極高（> 600）＋ 滲透壓極高（> 320 mOsm/kg）＋ 脫水昏迷；但「無顯著酮酸中毒」（pH > 7.30）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0168", "chapter": "第十章 高血糖急症", "stem": "在 DKA 治療中，常規使用重碳酸鈉（Sodium Bicarbonate）進行靜脈鹼化治療，臨床指引目前抱持極為保守審慎的態度，僅在下列何種極端危急狀況下才考慮謹慎微量使用？", "options": ["A. 只要動脈血 pH < 7.35 呈現任何輕微酸性，即應全面常規大劑量靜脈點滴輸注以防休克", "B. 只要病患呼吸呈現深長之庫斯毛耳呼吸（Kussmaul breathing），即應立即常規給予", "C. 任何嚴重 DKA 個案不論其臨床酸鹼數值如何，皆列為永久絕對禁忌症而終生嚴格禁止使用", "D. 僅在動脈血 pH < 6.9 伴隨嚴重酸血症危及心肌收縮力與誘發致命性高血鉀時極謹慎使用"], "answer": "D", "explanation": "輸注重碳酸鈉會引發腦脊髓液反常性酸中毒、低血鉀及組織缺氧（氧解離曲線左移）。目前指引一致共識：只有在動脈血極度嚴重的酸中毒（pH < 6.9）時，才可謹慎微量補充，pH ≧ 6.9 不建議常規給予。", "memory_core": "【Bicarbonate 嚴格適應症】：僅在 pH < 6.9 極危急時才考慮使用！否則弊大於利（腦反常酸中毒）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0579", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 163 題] 陳先生第1 型糖尿病患者，參加200 公尺賽跑比賽，在跑完後10 分鐘發現血糖高達350 mg/dl， 試問下列處理何者最優先?", "options": ["A. 再跑40 分鐘來降低血糖", "B. 立即多喝水來降低血糖", "C. 測試尿酮反應", "D. 補充一罐含鉀離子的運動飲料"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十章 高血糖急症 (共照網考古 第163題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 200公尺賽跑屬於極高強度的無氧衝刺，跑後血糖飆升至 350 mg/dL 是因交感神經劇烈興奮釋放大量兒茶酚胺刺激肝醣分解。此時體內處於高度應激且可能相對缺乏胰島素，若貿然「再跑40分鐘」，會加劇脂肪分解與脫水，引發致死性高血糖急症。\n🔹 (B) 補充純水能改善高滲透壓脫水，但不是「最優先評估危險分級」的關鍵診斷處置。\n🔹 (C) 正確。第 1 型糖尿病患者在劇烈運動後血糖若異常飆升超過 250~300 mg/dL，臨床最優先之關鍵處置為「立即檢驗尿酮或血酮」，以迅速排查是否已誘發急性糖尿病酮酸中毒 (DKA)，並依結果決定是否施打短效胰島素校正。\n🔹 (D) 運動後在尚未確認腎功能與電解質狀態下盲目飲用高鉀運動飲料，可能引發急性高血鉀心律不整風險。\n\n📊 無氧衝刺運動 vs 有氧耐力運動之血糖荷爾蒙對照：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>運動型態</th><th>典型代表項目</th><th>荷爾蒙主要反應</th><th>運動後立即血糖變化與處置</th></tr></thead>\n<tbody>\n<tr><td><b>高強度無氧運動</b></td><td>200m 衝刺、重訓、舉重</td><td>兒茶酚胺、生長激素爆發性上升</td><td><b>血糖暫時性顯著升高；若 >250 須先測酮體</b></td></tr>\n<tr><td><b>中低強度有氧運動</b></td><td>慢跑、快走、長途游泳</td><td>胰島素敏感度增加、GLUT4 轉位</td><td>血糖平穩下降；主要風險為低血糖與延遲性低血糖</td></tr>\n</tbody></table></div>", "memory_core": "【第十章 必考考點】：短跑無氧衝刺刺激兒茶酚胺使血糖驟升；T1D 運動後血糖 >250~300「最優先測酮體（尿酮/血酮）」以排除 DKA！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0589", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 179 題] 酮酸中毒的診斷其PH 值應小於多少？", "options": ["A. 9", "B. 8.5", "C. 7.3", "D. 6.4"], "answer": "C", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病酮酸中毒（DKA）之動脈血氣體分析（ABG）動脈血 pH 值診斷門檻。<strong>正確答案為 (C)</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 數值偏高</span><strong>pH &lt; 7.40：</strong>正常動脈血 pH 為 7.35~7.45，7.40 是中性基準值，不可作為酸中毒切點。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 數值偏高</span><strong>pH &lt; 7.35：</strong>此為一般臨床輕微酸血症門檻，未達 DKA 診斷標準。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 C 為本題正確答案</span><strong>動脈血 pH 值小於 7.30 (pH &lt; 7.30)：</strong>依據 ADA 與台灣高血糖急症指引，<strong>DKA 的正式診斷標準要求動脈血 pH &lt; 7.30</strong>（輕度 7.25~7.30，中度 7.00~7.24，重度 &lt; 7.00），且血清重碳酸根（HCO3-）需 &lt; 18 mEq/L（重度 &lt; 10），同時伴隨血清或尿液酮體陽性與陰離子隙（Anion gap）&gt; 10~12。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 屬於重度切點</span><strong>pH &lt; 7.00：</strong>此為「重度 DKA」之切點，非通則診斷門檻。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：糖尿病酮酸中毒 (DKA) 輕/中/重度診斷標準對照表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>診斷檢驗項目</th><th>輕度 DKA (Mild)</th><th>中度 DKA (Moderate)</th><th>重度 DKA (Severe)</th></tr></thead><tbody><tr><td><strong>血漿葡萄糖 (mg/dL)</strong></td><td>&gt; 250</td><td>&gt; 250</td><td>&gt; 250 (少數可正常)</td></tr><tr><td><strong>動脈血 pH (Arterial pH)</strong></td><td><strong>7.25 ～ 7.30</strong></td><td><strong>7.00 ～ 7.24</strong></td><td><strong>&lt; 7.00</strong> (死亡高風險)</td></tr><tr><td><strong>血清重碳酸根 (HCO3-)</strong></td><td>15 ～ 18 mEq/L</td><td>10 ～ &lt; 15 mEq/L</td><td><strong>&lt; 10 mEq/L</strong></td></tr><tr><td><strong>尿液/血清酮體</strong></td><td>陽性 (Positive)</td><td>陽性 (Positive)</td><td>強陽性 (Positive)</td></tr><tr><td><strong>陰離子隙 (Anion Gap)</strong></td><td>&gt; 10</td><td>&gt; 12</td><td><strong>&gt; 12</strong></td></tr><tr><td><strong>神智狀態 (Mental Status)</strong></td><td>清醒 (Alert)</td><td>嗜睡/清醒 (Alert/Drowsy)</td><td><strong>木僵/昏迷 (Stupor/Coma)</strong></td></tr></tbody></table></div>", "memory_core": "【DKA 診斷口訣】：血糖 >250、動脈 pH <7.30、HCO3 <18、酮體陽性、陰離子隙 >10~12！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0665", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 274 題] 下列何者荷爾蒙與兒童糖尿病酮酸中毒（DKA）發生的原因無關？", "options": ["A. ↓胰島素Insulin", "B. ↑生糖素Glucagon", "C. ↑腎上腺素Epinephrine", "D. ↓雌性素Estrogen。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十章 糖尿病酮酸中毒 (DKA) 生理機轉 (共照網考古 第274題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) ↓ 胰島素 (Insulin)：胰島素絕對或相對缺乏是 DKA 發生的核心原發始動因子。\n🔹 (B) ↑ 生糖素 (Glucagon)：在胰島素缺乏下，升糖素大幅上升，刺激肝臟肝醣分解與糖質新生，並活化肉鹼棕櫚醯轉移酶-1 (CPT-1) 加速脂肪酸進入粒線體生成酮體。\n🔹 (C) ↑ 腎上腺素 (Epinephrine)：強大的抗調控應激荷爾蒙，大幅加速脂肪組織分解產生游離脂肪酸 (FFA)，為肝臟合成酮體提供原料。\n🔹 (D) 正確（何者無關）。「雌性素（Estrogen）」為主要女性性荷爾蒙，其濃度高低並非驅動急性酮酸中毒病理生理 cascade 的反向調節荷爾蒙，與 DKA 的急性誘發毫無直接關聯。\n\n📊 誘發 DKA 之「一降四升」關鍵反向調控荷爾蒙表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>荷爾蒙名稱</th><th>在 DKA 時的濃度變化</th><th>對糖質代謝與酮體生成的生理推動力</th></tr></thead>\n<tbody>\n<tr><td><b>胰島素 (Insulin)</b></td><td><b>極度劇降 (↓ 絕對或相對不足)</b></td><td><b>核心始動環節：細胞無法攝糖，脂解抑制完全解除</b></td></tr>\n<tr><td><b>升糖素 (Glucagon)</b></td><td><b>顯著暴增 (↑)</b></td><td><b>刺激肝醣分解與糖質新生，活化 CPT-1 生成酮體</b></td></tr>\n<tr><td><b>腎上腺素 (Epinephrine)</b></td><td><b>顯著暴增 (↑)</b></td><td><b>刺激脂肪組織分解，向血液灌注大量游離脂肪酸</b></td></tr>\n<tr><td><b>皮質醇與生長激素</b></td><td>顯著暴增 (↑)</td><td>惡化周邊胰島素阻抗，加劇高血糖滲透壓利尿</td></tr>\n<tr><td><b>雌性素 (Estrogen)</b></td><td>無關聯變化</td><td>不參與急性升糖與急性酮體代謝調控</td></tr>\n</tbody></table></div>", "memory_core": "【第十章 必考考點】：DKA 關鍵荷爾蒙：「胰島素↓」，伴隨「升糖素↑、腎上腺素↑、皮質醇↑」；與「雌性素」無關！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0722", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 350 題] 下列那一項食物不含醣類？", "options": ["A. 香蕉", "B. 牛奶", "C. 馬鈴薯", "D. 蝦米"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核食物六大類代換與碳水化合物（醣類）含量判定。<strong>正確答案為 (D) 蝦米</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 含有醣類</span><strong>香蕉：</strong>屬於「水果類」，每 1 份水果（香蕉大半根約 70g）含有 15 公克碳水化合物（醣類）。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 含有醣類</span><strong>牛奶：</strong>屬於「乳品類」，每 1 份乳品（240 mL 鮮奶）天然含有 12 公克乳糖（碳水化合物）。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 含有醣類</span><strong>馬鈴薯：</strong>屬於「全穀雜糧類（主食類）」，每 1 份主食（熟馬鈴薯約 90g）含有 15 公克碳水化合物。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 不含醣類（本題正解）</span><strong>蝦米：</strong>屬於「豆魚蛋肉類」之海鮮水產，純動物性蛋白質與微量脂肪，在食物代換表規範中「碳水化合物含量為 0 公克」，不含醣類，對餐後血糖無直接升糖影響。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：六大類食物每份醣類與蛋白質含量代換速查表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>食物類別</th><th>每份醣類 (g)</th><th>每份蛋白質 (g)</th><th>每份熱量 (kcal)</th></tr></thead><tbody><tr><td><strong>全穀雜糧類</strong></td><td><strong>15</strong></td><td>2</td><td>70</td></tr><tr><td><strong>水果類</strong></td><td><strong>15</strong></td><td>0</td><td>60</td></tr><tr><td><strong>乳品類</strong></td><td><strong>12</strong></td><td>8</td><td>120 (低脂)</td></tr><tr><td><strong>蔬菜類</strong></td><td><strong>5</strong></td><td>1</td><td>25</td></tr><tr><td><strong>豆魚蛋肉類 (如蝦米)</strong></td><td><strong>0</strong></td><td>7</td><td>55~75</td></tr><tr><td><strong>油脂與堅果種子類</strong></td><td><strong>0</strong></td><td>0</td><td>45</td></tr></tbody></table></div>", "memory_core": "【四大含醣大天王】：全穀 (15g)、水果 (15g)、奶類 (12g)、蔬菜 (5g) 全含醣！豆魚蛋肉與油脂不含醣。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0742", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 376 題] 減輕胰島素注射過程的疼痛處置，下列何者正確？ (1)注射或拔出針頭時不要改變方向(2)快速貫穿皮膚(3)注射前確定空針內無氣泡(4)酒精揮發乾 再注射(5)注射部位肌肉要用力(6)針頭先用酒精消毒", "options": ["A. (1)+(2)+(3)+(4)", "B. (2)+(3)+(4)+(5)", "C. (1)+(3)+(5)+(6)", "D. (1)+(2)+(4)+(6)"], "answer": "A", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核減輕皮下胰島素注射過程疼痛之實務衛教手法。<strong>正確答案為 (A)</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">正解組合 (1) + (2) + (3) 正確</span><strong>各減痛措施深度解析：</strong><br>• <strong>(1) 注射或拔出針頭動作敏捷一致：</strong>進針與拔針時應直線迅速、角度一致，不可在皮下扭轉或遲疑晃動，能大幅減輕皮膚痛覺。<br>• <strong>(2) 酒精消毒後待其「完全揮發乾燥」再下針：</strong>未乾的酒精液滴若隨針頭帶入皮下組織，會刺激神經末梢引發劇烈刺痛與灼熱感！<br>• <strong>(3) 使用中胰島素置於室溫（15~30°C）：</strong>冷藏庫剛拿出的冰冷胰島素直接注射會強烈刺激神經血管引發劇痛與皮下痙攣，使用中的胰島素筆應放在陰涼室溫保存。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">錯誤手法 (4)</span><strong>重複使用針頭 ❌：</strong>針頭重複使用會使矽膠潤滑塗層磨損、針尖產生微觀倒鉤彎曲，再次下針如同鐵絲拉扯皮膚，劇痛無比且增加感染與脂肪增生風險。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：胰島素無痛注射六大黃金標準操作表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>操作環節</th><th>標準無痛操作技巧</th><th>疼痛與組織受損成因</th></tr></thead><tbody><tr><td><strong>1. 藥液溫度</strong></td><td><strong>使用中胰島素常溫保存 (可放室溫 28~30 天)</strong></td><td>冰冷藥液刺激神經末梢引發劇烈抽痛</td></tr><tr><td><strong>2. 皮膚消毒</strong></td><td><strong>酒精消毒後靜待 10~15 秒完全乾燥再進針</strong></td><td>液態酒精被針尖帶入真皮層產生強烈化學灼痛</td></tr><tr><td><strong>3. 肌肉放鬆</strong></td><td>注射部位肌肉完全放鬆，避免緊繃用力</td><td>緊繃肌肉阻抗大，進針疼痛且易出血</td></tr><tr><td><strong>4. 進出針手法</strong></td><td><strong>快速直線進針、平穩推藥、直線拔出不扭轉</strong></td><td>針頭在皮下偏斜拉扯神經纖維</td></tr><tr><td><strong>5. 針頭長度</strong></td><td>優先選用 <strong>4mm 超細超短針頭</strong> (垂直 90 度下針免捏皮)</td><td>避免過長針頭誤打入肌肉層 (IM 注射引發低血糖劇痛)</td></tr><tr><td><strong>6. 拋棄更換</strong></td><td><strong>每次注射完立即更換全新針頭</strong></td><td>重複使用針尖倒鉤破壞皮下脂肪增生硬塊</td></tr></tbody></table></div>", "memory_core": "【無痛打針四口訣】：常溫藥、乾酒精、直線進出不猶豫、針頭一次就丟棄！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0872", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 533 題] 有關糖尿病照護注意事項，下列何者錯誤？", "options": ["A. 不進食就不需要注射胰島素", "B. 生病時須密切監測血糖", "C. 血糖值超過250 mg/dl 應檢測酮體", "D. 了解高血糖症狀隨時注意"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第十章 高血糖急症 (共照網考古 第533題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者錯誤）。這是糖尿病病患最致命的迷思！生病時（如感冒、發燒、腹瀉、創傷），體內皮質醇與腎上腺素等應激荷爾蒙大量釋放刺激肝臟糖質新生，即使完全沒有進食，基礎血糖依然會飆高；若此時自行停打基礎胰島素，將在數小時內誘發致死性「糖尿病酮酸中毒 (DKA)」。生病日「絕對不可擅自停打基礎胰島素」！\n🔹 (B) 生病期間代謝劇烈波動，應增加血糖監測頻率（每 2~4 小時驗一次）。\n🔹 (C) 血糖大於 250 mg/dL 時，代表體內胰島素相對嚴重不足，應立即檢測尿酮或血酮。\n🔹 (D) 衛教病患隨時警覺高血糖與脫水症狀（多尿、劇渴、噁心、嘔吐、腹痛），及時就醫。\n\n📊 糖尿病生病日照護規則 (Sick Day Rules) 黃金五準則：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>生病日守則</th><th>具體執行指引</th><th>臨床處置理由</th></tr></thead>\n<tbody>\n<tr><td><b>1. 絕不停用胰島素</b></td><td><b>即使無法進食，基礎胰島素也必須照常施打</b></td><td>抵抗生病應激荷爾蒙，防堵致命 DKA 發生</td></tr>\n<tr><td><b>2. 密集血糖與酮體監測</b></td><td>每 2～4 小時測血糖；血糖 &gt; 250 mg/dL 必測酮體</td><td>及早發現高血糖危象與酸中毒趨勢</td></tr>\n<tr><td><b>3. 補充水分與電解質</b></td><td>每小時補充 150～200 mL 水分或清湯</td><td>防止滲透性利尿引發嚴重低血容量脫水</td></tr>\n<tr><td><b>4. 易消化碳水化合物</b></td><td>進食困難時以果汁、米湯少量多次補醣 (每小時15g)</td><td>預防饑餓性酮體與低血糖</td></tr>\n<tr><td><b>5. 及時緊急就醫時機</b></td><td>持續嘔吐無法進水 &gt; 4小時、血糖持續 &gt; 250、尿酮中強陽性</td><td>立即急診靜脈輸液與胰島素治療</td></tr>\n</tbody></table></div>", "memory_core": "【第十章 必考考點】：生病日「不吃東西也絕不能停打胰島素」！血糖 >250 驗酮體，多喝水防脫水。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0876", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 537 題] 關於高血糖高滲透壓狀態的敘述，何者錯誤?", "options": ["A. 大多發生於年長者。", "B. 血糖持續升高可能出現神經症狀，包括嗜睡，甚至昏迷。", "C. 高血糖高滲透壓狀態的死亡率，較糖尿病酮酸血症低。", "D. 經常伴有促發因子，如感染、腦中風"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十章 高血糖高滲透壓狀態 (HHS) 臨床預後 (共照網考古 第537題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 大多發生於高齡長者（第 2 型糖尿病老年病患居多，常伴隨失渴感或行動不便）。\n🔹 (B) 有效血清滲透壓 ＞ 320 mOsm/kg 時，腦細胞脫水萎縮，高達 50% 患者出現嗜睡、神智不清、抽搐甚至深部昏迷。\n🔹 (C) 正確（何者錯誤）。在臨床統計與急症預後中，**高血糖高滲透壓狀態（HHS）的死亡率（Mortality rate）「遠高於」糖尿病酮酸中毒（DKA）**！\n- **DKA 死亡率**：在現代加護病房標準靜脈輸液與小劑量胰島素治療下，死亡率通常低於 **1 - 5%**。\n- **HHS 死亡率**：因患者多為高齡、重度脫水休克（流失 8-12 公升體液）、合併敗血症、心肌梗塞或中風等多重器官衰竭，其死亡率高達 **10 至 20%（高達 DKA 的 5-10 倍）**！故宣稱「HHS 死亡率較 DKA 低」完全違反臨床事實，是錯誤的。\n🔹 (D) 常伴有嚴重誘發因子（重症肺炎、敗血症、心肌梗塞、中風）。\n\n📊 高血糖高滲透壓狀態 (HHS) vs 糖尿病酮酸中毒 (DKA) 預後與死亡率比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>評估指標項目</th><th>高血糖高滲透壓狀態 (HHS)</th><th>糖尿病酮酸中毒 (DKA)</th></tr></thead>\n<tbody>\n<tr><td><b>整體死亡率 (Mortality)</b></td><td><b>高達 10 - 20%！(極度凶險，考點核心)</b></td><td><b>約 1 - 5% (遠低於 HHS)</b></td></tr>\n<tr><td>主要死亡原因</td><td>敗血性休克、血管栓塞、高齡多重器官衰竭</td><td>嚴重腦水腫 (兒童)、頑固低血鉀心律不整</td></tr>\n<tr><td>脫水體液赤字</td><td><b>極嚴重 (流失 8 - 12 公升，約 15-20% 體重)</b></td><td>中重度 (流失 3 - 6 公升，約 10% 體重)</td></tr>\n<tr><td>典型發病年齡</td><td>多為 65 歲以上高齡長者</td><td>多為青少年與年輕成人</td></tr>\n</tbody></table></div>", "memory_core": "【第十章 必考考點】：HHS 死亡率 (10-20%)「遠高於」DKA (1-5%)！脫水更嚴重、高齡共病多，極其致命。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0879", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 540 題] 糖尿病人發生高血糖危症（Hyperglycemia crisis）時，其意識狀態的改變與以下何者最有關聯性？", "options": ["A. 酸中毒的嚴重度", "B. 血清滲透壓濃度", "C. 血漿血糖濃度", "D. 以上皆是"], "answer": "B", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核高血糖危症（HHS / DKA）神智意識狀態改變之核心決定生化指標。<strong>正確答案為 (B) 血清滲透壓濃度</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 錯誤</span><strong>酸中毒的嚴重度 ❌：</strong>臨床研究證實，單純代謝性酸中毒（如動脈血 pH 下降）即使嚴重，患者常仍保持清醒或躁動，意識障礙與酸中毒嚴重度的相關性顯著弱於滲透壓。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 B 正確（本題正解）</span><strong>血清滲透壓濃度：</strong>意識狀態的改變（嗜睡、意識混亂、譫妄至昏迷）與「有效血清滲透壓（Effective serum osmolality）」呈現最直接、最顯著的正相關！當有效滲透壓 > 320~330 mOsm/kg 時，高滲透壓驅使水分自腦細胞滲出至細胞外液，引發大腦皮質神經元嚴重脫水與功能衰竭。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 錯誤</span><strong>血漿血糖濃度 ❌：</strong>血糖濃度雖為滲透壓計算成分，但若未綜合評估血鈉濃度與整體滲透濃度，單純血糖數值與昏迷程度之相關性不如滲透壓精準。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 錯誤</span><strong>以上皆是 ❌：</strong>雖然高血糖危症是多重因子，但在各項生化指標中，「血清滲透壓濃度」是決定神智障礙嚴重度的唯一最強關聯指標。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：高血糖急症意識狀態與生化數值相關性矩陣表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>臨床表現階段</th><th>有效血清滲透壓 (mOsm/kg)</th><th>神經意識臨床表現</th></tr></thead><tbody><tr><td><strong>清醒至輕度嗜睡</strong></td><td>&lt; 300 ～ 310</td><td>反應靈敏或輕度疲憊倦怠</td></tr><tr><td><strong>嗜睡與定向力混亂</strong></td><td>310 ～ 320</td><td>嗜睡、注意力不集中、問答遲鈍</td></tr><tr><td><strong>昏睡至深部昏迷</strong></td><td><strong>&gt; 320 ～ 330 (門檻)</strong></td><td><strong>腦細胞重度脫水，陷入深度昏迷與痛覺消失</strong></td></tr></tbody></table></div>", "memory_core": "【意識混亂看滲透壓】：神智昏迷與『血清滲透壓破 320』最相關！腦細胞脫水是昏迷元兇。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0994", "chapter": "第十章 高血糖急症", "stem": "[共照網考古題 第 690 題] 有關糖尿病酮酸中毒（DKA）的臨床表現，下列何者不正確？", "options": ["A. Kussmaul 庫氏呼吸（喘息性呼吸）", "B. 腹部疼痛，噁心嘔吐", "C. 體液容積流失", "D. 呼吸性酸中毒"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病酮酸中毒（DKA）之典型臨床表現與酸鹼失衡本質。<strong>正確答案為 (D) 呼吸性酸中毒</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 為典型表現</span><strong>Kussmaul 庫氏呼吸（喘息性呼吸）：</strong>DKA 因強烈代謝性酸中毒，代償性刺激延腦呼吸中樞，表現出深而快速的庫斯毛耳呼吸（Kussmaul breathing），大量呼出 CO2 以代償酸中毒。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 為典型表現</span><strong>腹部疼痛，噁心嘔吐：</strong>酮體刺激嘔吐中樞與胃排空延遲，加上腸道低灌流，引發劇烈噁心、嘔吐與假性急腹症腹痛。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 為典型表現</span><strong>體液容積流失：</strong>高血糖高滲透性利尿與頻繁嘔吐導致體液嚴重流失（脫水 3~6 公升），呈現黏膜乾燥與血壓偏低。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 敘述錯誤（本題正解）</span><strong>呼吸性酸中毒 ❌：</strong>DKA 是典型的「高陰離子間隙代謝性酸中毒（High anion gap Metabolic Acidosis）」，絕非「呼吸性酸中毒」！呼吸系統此時是健全且代償性過度換氣以呼出揮發性酸（CO2），只有在患者瀕臨呼吸中樞衰竭停頓時才會出現 CO2 蓄積，故臨床表現本質為代謝性酸中毒。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：DKA 酸鹼失衡與動脈血液氣體分析 (ABG) 指標表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>動脈血氣分析指標</th><th>DKA 典型生化數值</th><th>臨床病理代償機轉</th></tr></thead><tbody><tr><td><strong>動脈血 pH</strong></td><td><strong>&lt; 7.30 (重度 &lt; 7.00)</strong></td><td><strong>高陰離子間隙代謝性酸中毒 (絕非呼吸性)</strong></td></tr><tr><td><strong>血清碳酸氫鹽 (HCO3-)</strong></td><td><strong>&lt; 18 mEq/L (重度 &lt; 10)</strong></td><td>體內重碳酸根緩衝消耗殆盡</td></tr><tr><td><strong>動脈二氧化碳分壓 (PaCO2)</strong></td><td><strong>&lt; 35 mmHg (顯著偏低)</strong></td><td><strong>Kussmaul 呼吸過度換氣代償呼出 CO2</strong></td></tr><tr><td><strong>陰離子間隙 (Anion Gap)</strong></td><td><strong>&gt; 12 mEq/L (顯著偏高)</strong></td><td>酸性酮體 (AcAc / $\beta$-OHB) 堆積</td></tr></tbody></table></div>", "memory_core": "【DKA 酸鹼本質】：高陰離子間隙『代謝性酸中毒』！靠庫斯毛耳呼吸深快呼出碳酸。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0035", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "對於正在執行體重管理與血糖控制的上班族，在便利商店選購午餐時，下列何種組合最符合健康減重與醣類控制原則？", "options": ["A. 1 盒大份綜合純水果切盤 ＋ 1 瓶大容量全糖草莓優酪乳 ＋ 1 包高纖蘇打餅乾", "B. 1 個日式肉鬆雙餡御飯糰 ＋ 1 盒 500 mL 全脂鮮乳 ＋ 1 根特大熟香蕉", "C. 1 盒台式微波醬汁油炒麵 ＋ 1 罐含糖檸檬紅茶 ＋ 1 包碳烤五花肉乾", "D. 1 盒田園生菜沙拉（配半包和風醬）＋ 1 顆茶葉蛋 ＋ 1 瓶無糖豆漿 ＋ 1 顆小地瓜"], "answer": "D", "explanation": "D 選項組合提供豐富水溶性與非水溶性纖維（生菜沙拉）、優質蛋白質（茶葉蛋、無糖豆漿）以及低 GI 優質複合碳水化合物（小地瓜約 1-2 份醣），既有飽足感且醣量均衡、油脂熱量低。A、B、C 選項均含過高精緻糖或精緻澱粉且缺乏足夠蛋白質與纖維。", "memory_core": "【外食超商減重組合】：優質蛋白（茶葉蛋/無糖豆漿）＋ 高纖蔬菜（和風沙拉）＋ 原型醣類（地瓜）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0066", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "在糖尿病飲食衛教中推廣的「健康飲食餐盤（Healthy Plate）」原則，其視覺化比例分配下列何者最適當？", "options": ["A. 精緻澱粉主食類佔 1/2，紅肉蛋白質佔 3/8，油脂佔 1/8", "B. 高生物價肉類佔 1/2，甜份水果類佔 1/2，完全不吃澱粉主食", "C. 純全穀雜糧類佔 2/3，加工豆製品佔 1/3，完全不安排蔬菜", "D. 非澱粉蔬菜類佔 1/2，優質蛋白質佔 1/4，全穀雜糧類佔 1/4"], "answer": "D", "explanation": "美國糖尿病學會與各國推薦之「糖尿病餐盤模型」：餐盤的 1/2 為非澱粉類蔬菜、1/4 為優質蛋白質（豆魚蛋肉）、1/4 為全穀雜糧類主食，再搭配適量水或無糖飲品，簡單易懂依從性高。", "memory_core": "【糖尿病黃金餐盤口訣】：1/2 蔬菜、1/4 蛋白質、1/4 原型主食（蔬菜佔半盤，控糖最簡單）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0069", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "在便利商店或自助餐挑選燙青菜時，下列何種蔬菜烹調方式能最有效避免額外攝取隱藏熱量與油脂？", "options": ["A. 蔬菜裹厚粉高溫油炸後，淋上濃稠沙拉美乃滋調味", "B. 蔬菜滾水清燙後瀝乾，以少許蒜末、薄醬油或少許橄欖油提味", "C. 蔬菜清燙後，淋上大量肥肉肉燥、油蔥酥與香濃豬油拌勻", "D. 蔬菜汆燙後，拌入厚重高熱量芝麻花生醬與含糖辣椒醬汁"], "answer": "B", "explanation": "蔬菜類每份熱量僅 25 kcal，但若淋肉燥、豬油、芝麻醬或美乃滋，油脂熱量常比蔬菜本身高出數倍。建議以清燙瀝乾、搭配蒜末、薄醬油或量少優質植物油提味，維持高纖低熱量特性。", "memory_core": "【外食蔬菜陷阱防範】：拒絕肉燥/香油/美乃滋裹醬，善用蒜汁、醋、和風或少許橄欖油調味。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0442", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "[共照網考古題 第 14 題] 有關食物中一份醣類的代換，下列何者正確？", "options": ["A. 一片厚片土司(40 公克)含有15 公克醣類", "B. 1/4 碗飯=2-3 片蘇打餅乾=3 湯匙穀粉(30 公克)", "C. 13 粒葡萄=半個泰國芭樂=半碗稀飯", "D. 一杯全脂牛奶(240 C.C.)=3 湯匙全脂奶粉"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第四章 食物代換與飲食計畫 (共照網考古 第14題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 薄片吐司 1 片（約 25～30 克）含有 15 克醣類（1 份主食）；厚片吐司 1 片重量約 80 克，含醣量約 30～40 克，相當於 2～2.5 份醣類。\n🔹 (B) 1/4 碗飯（50 克）= 蘇打餅乾 3～4 片（約 20 克）= 麥片/穀粉 3 平匙（約 20 克，非 30 克）；30 克穀粉已接近 1.5 份醣。\n🔹 (C) 正確。依據食物代換表，1 份醣類（15 克碳水化合物）的代換量包含：巨峰葡萄 13 粒（約 130 克）= 泰國芭樂 1/3～1/2 顆（約 160 克）= 稀飯半碗（約 125 克）。\n🔹 (D) 1 杯全脂鮮乳（240 mL，含 12g 醣、8g 蛋白質）相當於「4 湯匙全脂奶粉（約 30 克）」，非 3 湯匙。\n\n📊 常見含醣食物「1 份醣 (15g 碳水化合物)」代換速記表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>食物類別</th><th>每份含醣量</th><th>常見代表食物「1 份 (15g 碳水化合物)」標準代換量</th></tr></thead>\n<tbody>\n<tr><td><b>全榖雜糧類</b></td><td>15 克 (熱量 70 kcal)</td><td><b>白飯 1/4 碗 (50g) = 稀飯 1/2 碗 (125g) = 薄吐司 1 片 (30g) = 熟麵 1/2 碗 = 蘇打餅乾 3 片</b></td></tr>\n<tr><td><b>水果類</b></td><td>15 克 (熱量 60 kcal)</td><td><b>葡萄 13 粒 (130g) = 泰國芭樂 1/3~1/2 顆 (160g) = 小型蘋果 1 個 = 香蕉半根 (70g)</b></td></tr>\n<tr><td><b>乳品類</b></td><td>12 克 (熱量依脂肪不同)</td><td>鮮奶 1 杯 (240 mL) = <b>全脂奶粉 4 湯匙 (30g)</b> = 無糖優酪乳 1 杯 (200 mL)</td></tr>\n</tbody></table></div>", "memory_core": "【第四章 必考考點】：1 份醣 = 1/4 碗飯 = 1/2 碗稀飯 = 13 顆葡萄 = 半顆芭樂 = 薄吐司 1 片；全脂奶粉 4 匙為 1 杯奶！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0861", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "[共照網考古題 第 521 題] 依食物代換表所列，下列食物何者碳水化合物含量最高？", "options": ["A. 一份甜不辣", "B. 一份花枝丸", "C. 一份豬肉乾", "D. 一份牛肉乾"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第四章 食物代換與飲食計畫 (共照網考古 第521題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。甜不辣看似魚肉製品，但傳統製作過程中添加了大量的「樹薯粉、地瓜粉等精緻澱粉」攪拌油炸而成；市售 1 份甜不辣（約 3-4 片，100g）常含有高達 20～30 克以上的碳水化合物（相當於 1.5～2 份主食），在四個選項中碳水化合物含量最高，是糖尿病飲食中最常見的「隱藏澱粉陷阱」。\n🔹 (B) 花枝丸主要以花枝、魚漿及少量澱粉製成，每份碳水化合物約 5-8 克。\n🔹 (C)/(D) 豬肉乾與牛肉乾主要成分為禽畜瘦肉蛋白質，製作雖添加少許砂糖醬油調味，但碳水化合物含量遠低於以純澱粉為主要填充物的甜不辣。\n\n📊 常見加工蛋白質食品之「隱形碳水化合物陷阱」比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>食品種類</th><th>主要成分原料</th><th>碳水化合物特性與風險</th></tr></thead>\n<tbody>\n<tr><td><b>甜不辣 / 黑輪</b></td><td>魚漿 ＋ <b>大量樹薯粉/地瓜粉/太白粉</b></td><td><b>實質為「高澱粉高油食物」！碳水化合物含量極高，非純蛋白質</b></td></tr>\n<tr><td><b>花枝丸 / 貢丸</b></td><td>魚肉/豬肉 ＋ 結著劑少量澱粉</td><td>碳水化合物中等（每份約 5～8g）</td></tr>\n<tr><td><b>豬肉乾 / 牛肉乾</b></td><td>純肉纖維 ＋ 醃漬糖醬油</td><td>以蛋白質為主，碳水化合物主要來自表面調味糖</td></tr>\n</tbody></table></div>", "memory_core": "【第四章 必考考點】：小心加工魚漿陷阱！「甜不辣」添加大量樹薯粉，碳水化合物含量在肉製品中最高！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0951", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "[共照網考古題 第 621 題] 有關醣類計算教育內容，下列何者錯誤？", "options": ["A. 對於每份食物醣類含量少於5 公克者，可不限制", "B. 初級著重在餐點中吃固定量的醣量", "C. 中級著重在確認病患血糖、飲食、藥物與運動間關係", "D. 僅適用胰島素幫浦治療的糖尿病患"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第四章 食物代換與飲食計畫 (共照網考古 第621題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 依據醣類計算指引，每份食物含醣量 < 5 公克且熱量 < 20 大卡者屬於自由攝取食物 (Free food)，可不嚴格限制。\n🔹 (B) 初級醣類計算的核心著重在建立均衡飲食、認識含醣食物種類，並做到每餐攝取「固定份量」的醣類。\n🔹 (C) 中級醣類計算著重在透過密集血糖記錄，深入理解血糖變化與進食醣量、運動消耗及藥物作用三者之間的動態因果關係。\n🔹 (D) 正確（何者錯誤）。醣類計算 (Carbohydrate Counting) 是一項普適性的醫學營養技能，適用於「所有糖尿病病患」（包括口服降糖藥者、一天兩次注射者、MDI 多次注射者及幫浦使用者），絕非「僅適用於胰島素幫浦治療者」！進階醣類計算 (Advanced) 更是所有第 1 型糖尿病強化治療之標配。\n\n📊 醣類計算教育三階段進階階梯表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>學習階段</th><th>教學核心重點</th><th>適用對象與臨床目標</th></tr></thead>\n<tbody>\n<tr><td><b>初級醣類計算</b></td><td>辨識六大類含醣食物，落實三餐<b>「定時定量」吃固定份量醣</b></td><td>所有新確診、第 2 型口服藥或預混型注射病患</td></tr>\n<tr><td><b>中級醣類計算</b></td><td>藉由配對血糖記錄，掌握<b>飲食、運動與藥物三者對血糖的影響</b></td><td>開始自我監測並想探索血糖波動規律之病患</td></tr>\n<tr><td><b>高級醣類計算</b></td><td>掌握<b>胰島素-醣類比 (ICR) 與敏感係數 (ISF)</b>，自由彈性配餐注射</td><td><b>MDI 多次注射或胰島素幫浦 (CSII) 使用者</b></td></tr>\n</tbody></table></div>", "memory_core": "【第四章 必考考點】：醣類計算適用於「所有糖尿病人」，絕非僅限幫浦患者！初級重「定時定量」，高級重「ICR 彈性調整」。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1025", "chapter": "第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用", "stem": "[共照網考古題 第 729 題] 下列何者不含醣食物？", "options": ["A. 豬血", "B. 玉米筍", "C. 冬粉", "D. 腰果"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第四章 糖尿病之醫療營養治療（二）：糖尿病營養照顧計畫與實務運用（表 4-2 食物代換表・衛生福利部國民健康署食物代換表）(共照網考古 第729題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（本題正解）。依據 2026 核心課本第四章「表 4-2 食物代換表」與衛福部國健署食物代換表原則：動物血製品（豬血、鴨血）歸屬於「豆魚蛋肉類（低脂）」，每份含蛋白質 7 公克、脂肪 3 公克以下、醣類標記為「-」（實質含醣 0 公克），在六大類食物代換中為標準「不含醣類」之純蛋白質食物。\n🔹 (B) 含微量醣。玉米筍在植物學上雖為未成熟玉米，但在食物代換分類中歸屬於「蔬菜類」，每份蔬菜（煮熟後半碗約 100g）平均含有 5 公克醣類與 1 公克蛋白質，並非零醣。\n🔹 (C) 含顯著醣類。冬粉由綠豆或樹薯澱粉精製而成，在食物代換中歸屬於「全穀雜糧類」，主要成分為純澱粉（一把乾冬粉約 40g 即含約 30g 碳水化合物，約等於 2 份主食醣類），會顯著引起血糖上升。\n🔹 (D) 含有碳水化合物。腰果歸屬於「油脂與堅果種子類」，表 4-2 雖以提供脂肪 5 公克為主要分類（醣類標記為「-」），但在堅果實務分析中，腰果為富含碳水化合物之種子（一份約 5 粒即含 3~5 公克碳水化合物），相較於豬血之絕對零醣，腰果並非理想的不含醣選項。\n（出處說明：課本第四章表 4-2 明載豆魚蛋肉類醣類為「-」；臨床常見食材分類標準依據衛福部國民健康署 2019 食物代換表延伸對照）", "memory_core": "零醣食物判讀：動物血製品（豬血/鴨血）歸屬豆魚蛋肉類（醣類 0g）；蔬菜類（玉米筍）含醣 5g/份；冬粉為全穀雜糧類純澱粉（約 30g 醣/把）；腰果含碳水化合物非純零醣（表 4-2 豆魚蛋肉類醣為 -）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}];
    const STORAGE_KEY = 'cde_audit_adjudications_v1';
    const SYNC_TOPIC = 'cde_audit_sync_isa_cde2026';
    const SYNC_URL = `https://ntfy.sh/${SYNC_TOPIC}`;
    
    let adjudications = {};
    
    // 1. 先載入網頁內建固化進度 (Baked-in)
    QUESTIONS.forEach(q => {
      if (q.baked_passed || (q.baked_comment && q.baked_comment.trim())) {
        adjudications[q.id] = {
          passed: !!q.baked_passed,
          comment: q.baked_comment || ''
        };
      }
    });

    // 2. 疊加本機暫存
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const localData = JSON.parse(saved);
        Object.keys(localData).forEach(qid => {
          adjudications[qid] = localData[qid];
        });
      }
    } catch(e) {
      console.error(e);
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(adjudications));
      updateStats();
    }

    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast-msg');
      t.innerHTML = msg;
      t.style.display = 'flex';
      setTimeout(() => { t.style.display = 'none'; }, duration);
    }

    // ☁️ 核心：雲端儲存 (PUSH)
    async function cloudSave() {
      const btn = document.getElementById('fab-save-btn');
      const icon = document.getElementById('fab-icon');
      const text = document.getElementById('fab-text');
      
      btn.style.opacity = '0.75';
      icon.textContent = '⏳';
      text.textContent = '正在儲存至雲端...';

      const payload = {
        updated_at: new Date().toISOString(),
        device: navigator.userAgent.includes('Mobile') ? '手機' : '電腦',
        adjudications: adjudications
      };

      try {
        const res = await fetch(SYNC_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          saveLocal();
          icon.textContent = '✅';
          text.textContent = '已成功儲存至雲端！';
          btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          showToast('🎉 <b>雲端存檔成功！</b><br>另一台裝置（手機/電腦）只要【重新整理】網頁即可接續進度！', 4000);
          
          document.getElementById('cloud-sync-status').textContent = '🟢 雲端已同步最新進度';
          
          setTimeout(() => {
            btn.style.opacity = '1';
            icon.textContent = '☁️';
            text.textContent = '存檔（雲端同步）';
            btn.style.background = 'linear-gradient(135deg, #10b981, #0284c7)';
          }, 2500);
        } else {
          throw new Error('Server returned ' + res.status);
        }
      } catch (err) {
        console.error('Cloud save failed:', err);
        saveLocal();
        icon.textContent = '💾';
        text.textContent = '已存入本地（雲端暫時離線）';
        showToast('⚠️ 雲端網路瞬斷，進度已完整存入本地瀏覽器！連線恢復後再按一次即可。', 4000);
        setTimeout(() => {
          btn.style.opacity = '1';
          icon.textContent = '☁️';
          text.textContent = '存檔（雲端同步）';
        }, 3000);
      }
    }

    // ☁️ 核心：開頁或重新整理時自動自雲端拉取 (PULL)
    async function cloudSyncPull(showNotice = false) {
      const statusEl = document.getElementById('cloud-sync-status');
      statusEl.textContent = '🔄 檢查雲端更新...';

      try {
        const res = await fetch(`${SYNC_URL}/json?poll=1`);
        if (!res.ok) throw new Error('Fetch failed');
        const textData = await res.text();
        const lines = textData.trim().split('\n').filter(Boolean);
        
        if (lines.length > 0) {
          const lastEnvelope = JSON.parse(lines[lines.length - 1]);
          const remoteData = JSON.parse(lastEnvelope.message);
          
          if (remoteData && remoteData.adjudications) {
            let mergedCount = 0;
            Object.keys(remoteData.adjudications).forEach(qid => {
              adjudications[qid] = remoteData.adjudications[qid];
              mergedCount++;
            });
            saveLocal();
            renderQuestions();
            statusEl.textContent = `🟢 已自雲端同步 (${remoteData.device || '雲端'})`;
            if (showNotice) {
              showToast(`🎉 成功自雲端載入最新進度！共同步 ${mergedCount} 題記錄。`);
            }
            return;
          }
        }
        statusEl.textContent = '🟢 本地與雲端進度一致';
      } catch(err) {
        console.log('No new cloud sync data:', err);
        statusEl.textContent = '🟢 本地儲存運作正常';
      }
    }

    // 初始化章節篩選器
    const chSelect = document.getElementById('chapter-filter');
    const chSet = new Set(QUESTIONS.map(q => q.chapter));
    Array.from(chSet).forEach(ch => {
      const opt = document.createElement('option');
      opt.value = ch;
      opt.textContent = ch;
      chSelect.appendChild(opt);
    });

    // 更新統計與進度條
    function updateStats() {
      const total = QUESTIONS.length;
      let passedCount = 0;
      let commentCount = 0;
      let discCount = 0;

      QUESTIONS.forEach(q => {
        if (q.cat_type === 'DISCREPANCY') discCount++;
        const adj = adjudications[q.id];
        if (adj && adj.passed) passedCount++;
        if (adj && adj.comment && adj.comment.trim()) commentCount++;
      });

      document.getElementById('badge-total').textContent = `共 ${total} 題待審`;
      document.getElementById('badge-disc').textContent = `🚨 衝突 ${discCount} 題`;
      document.getElementById('badge-passed').textContent = `✅ 已放行 ${passedCount} 題`;
      document.getElementById('badge-commented').textContent = `✍️ 已寫意見 ${commentCount} 題`;
      
      const pct = total > 0 ? (passedCount / total) * 100 : 0;
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    // 渲染題目
    const container = document.getElementById('questions-container');
    let currentFilter = 'all';
    let currentChapter = '';
    let searchQuery = '';

    function renderQuestions() {
      container.innerHTML = '';
      
      const filtered = QUESTIONS.filter(q => {
        const adj = adjudications[q.id] || {};
        
        if (currentFilter === 'disc' && q.cat_type !== 'DISCREPANCY') return false;
        if (currentFilter === 'scenario' && q.cat_type !== 'SCENARIO') return false;
        if (currentFilter === 'synonym' && q.cat_type !== 'CLINICAL_SYNONYM') return false;
        if (currentFilter === 'passed' && !adj.passed) return false;
        if (currentFilter === 'commented' && (!adj.comment || !adj.comment.trim())) return false;
        
        if (currentChapter && q.chapter !== currentChapter) return false;
        
        if (searchQuery) {
          const text = (q.id + q.stem + q.options.join(' ') + q.explanation).toLowerCase();
          if (!text.includes(searchQuery.toLowerCase())) return false;
        }
        
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 60px; color:#64748b; font-size:1.1rem;">沒有符合條件的試題！</div>';
        return;
      }

      filtered.forEach(q => {
        const adj = adjudications[q.id] || { passed: false, comment: '' };
        const isPassed = !!adj.passed;
        const comment = adj.comment || '';

        const card = document.createElement('div');
        card.className = `q-card ${isPassed ? 'is-passed' : ''} ${q.cat_type === 'DISCREPANCY' ? 'is-disc' : ''}`;
        card.id = `card-${q.id}`;

        const isDisc = q.cat_type === 'DISCREPANCY';

        card.innerHTML = `
          <div class="card-header">
            <div class="card-meta">
              <span class="meta-id">${q.id}</span>
              <span class="meta-ch">${q.chapter}</span>
              <span class="meta-cat cat-${q.cat_type}">${q.cat_label}</span>
            </div>
            <div>
              <button class="pass-toggle-btn ${isPassed ? 'active' : ''}" data-id="${q.id}">
                ${isPassed ? '✅ 已打勾放行' : '⭕ 點此放行本題'}
              </button>
            </div>
          </div>

          <div class="stem-box">${q.stem}</div>

          <div class="options-grid">
            ${q.options.map(o => {
              const isAns = o.startsWith(q.answer + '.');
              return `
                <div class="opt-row ${isAns ? 'is-correct' : ''}">
                  ${isAns ? '<span class="opt-tag">正解 ' + q.answer + '</span>' : ''}
                  <span>${o}</span>
                </div>
              `;
            }).join('')}
          </div>

          <div class="diagnostic-box ${isDisc ? 'disc' : ''}">
            <b>🔍 系統具體疑點剖析：</b><br>
            ${q.reason}
          </div>

          <button class="accordion-toggle" onclick="toggleExp('${q.id}')">
            <span>📖 點擊展開目前題解與速記考點</span> ▼
          </button>
          <div class="accordion-content" id="exp-${q.id}">
            <div style="font-weight:700; color:#1e293b; margin-bottom:6px;">【目前完整題解原文】：</div>
            ${q.explanation}
            ${q.memory_core ? '<div style="margin-top:12px; font-weight:700; color:#0284c7;">【核心速記考點】：</div>' + q.memory_core : ''}
          </div>

          <div class="action-panel">
            <div class="comment-area">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="font-size:0.85rem; font-weight:700; color:#475569;">✍️ 我的裁決意見與修改指示：</label>
                <span class="save-indicator" id="saved-${q.id}">✓ 已自動儲存</span>
              </div>
              <textarea class="comment-input" data-id="${q.id}" placeholder="在此寫上您的意見，例如：『此題無誤放行』、『夏柯足痛覺需修題幹』、『章節改到第十七章』...">${comment}</textarea>
              <div class="quick-tags">
                <button class="quick-tag-btn" onclick="addTag('${q.id}', '✅ 內容無誤放行')">+ 內容無誤放行</button>
                <button class="quick-tag-btn" onclick="addTag('${q.id}', '📌 題幹敘述需微調')">+ 題幹需微調</button>
                <button class="quick-tag-btn" onclick="addTag('${q.id}', '🏷️ 建議調整所屬章節')">+ 建議調整章節</button>
                <button class="quick-tag-btn" onclick="addTag('${q.id}', '📚 題解補充非課本來源')">+ 補充非課本來源</button>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // 綁定放行按鈕事件
      document.querySelectorAll('.pass-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.getAttribute('data-id');
          if (!adjudications[qid]) adjudications[qid] = { passed: false, comment: '' };
          adjudications[qid].passed = !adjudications[qid].passed;
          saveLocal();
          
          const card = document.getElementById(`card-${qid}`);
          if (adjudications[qid].passed) {
            card.classList.add('is-passed');
            btn.classList.add('active');
            btn.innerHTML = '✅ 已打勾放行';
          } else {
            card.classList.remove('is-passed');
            btn.classList.remove('active');
            btn.innerHTML = '⭕ 點此放行本題';
          }
        });
      });

      // 綁定留言輸入事件
      document.querySelectorAll('.comment-input').forEach(txt => {
        txt.addEventListener('input', () => {
          const qid = txt.getAttribute('data-id');
          if (!adjudications[qid]) adjudications[qid] = { passed: false, comment: '' };
          adjudications[qid].comment = txt.value;
          saveLocal();
          
          const ind = document.getElementById(`saved-${qid}`);
          if (ind) {
            ind.style.display = 'inline';
            setTimeout(() => { ind.style.display = 'none'; }, 1500);
          }
        });
      });
    }

    window.toggleExp = function(qid) {
      const el = document.getElementById(`exp-${qid}`);
      if (el) {
        el.classList.toggle('show');
      }
    };

    window.addTag = function(qid, tagText) {
      const txt = document.querySelector(`.comment-input[data-id="${qid}"]`);
      if (txt) {
        const cur = txt.value.trim();
        txt.value = cur ? cur + '；' + tagText : tagText;
        if (!adjudications[qid]) adjudications[qid] = { passed: false, comment: '' };
        adjudications[qid].comment = txt.value;
        saveLocal();
      }
    };

    // 工具列事件
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderQuestions();
      });
    });

    chSelect.addEventListener('change', () => {
      currentChapter = chSelect.value;
      renderQuestions();
    });

    document.getElementById('search-box').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderQuestions();
    });

    // 匯出 JSON 功能
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const exportData = {
        timestamp: new Date().toISOString(),
        adjudications: adjudications
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cde_adjudications_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // 啟動程序
    updateStats();
    renderQuestions();
    
    // 開啟網頁時自動自雲端同步最新進度
    cloudSyncPull(false);
  </script>
</body>
</html>
