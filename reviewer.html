未缺乏者常規補鎂無效。", "memory_core": "【微量元素補充定律】：只在檢驗「確診缺乏」時補充才有明確療效，無缺乏者常規吃無額外效益。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0445", "chapter": "第五章 輔助健康照顧：膳食補充品與糖尿病", "stem": "[共照網考古題 第 17 題] 在做諮詢時，當糖尿病人詢問可否吃保健食品時，你會採取下列何項措施？", "options": ["A. 告知保健食品大多沒有效果", "B. 告知勿嘗試保健食品", "C. 告知辨識保健食品成分與功效的方法", "D. 告知保健食品對血糖沒影響"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第五章 膳食補充品與糖尿病 (共照網考古 第17題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B) 一昧全盤否定或命令禁止嘗試，容易引發病患防衛心理，導致病患私下服用並隱瞞醫療團隊。\n🔹 (C) 正確。現代以賦能 (Empowerment) 為核心的衛教諮詢原則強調：衛教師應引導並「教導病患如何辨識保健食品標示、成分清單、小綠人健康食品認證標章與科學實證功效」，輔導其建立明辨真偽的能力，並主動與醫師討論藥物交互作用。\n🔹 (D) 宣稱保健食品對血糖沒影響是不負責任且不符合事實的（某些補充品可能與降血糖藥產生交互作用引起低血糖）。\n\n📊 糖尿病衛教面對「保健食品/膳食補充品」專業諮詢四步驟：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>諮詢步驟</th><th>衛教人員專業處置原則</th></tr></thead>\n<tbody>\n<tr><td><b>1. 開放探詢</b></td><td>以不批判態度詢問正在服用的補充品名稱、品牌、劑量與來源</td></tr>\n<tr><td><b>2. 賦能辨識</b></td><td><b>教導病患辨別食品標示、衛生福利部核准字號與宣稱限制</b></td></tr>\n<tr><td><b>3. 安全把關</b></td><td>評估肝腎毒性與藥物交互作用（如銀杏/大蒜抗凝血、紅麴降血脂重疊）</td></tr>\n<tr><td><b>4. 嚴格底線</b></td><td><b>堅守絕對「不可自行擅自停用正規降血糖西藥」的紅線</b></td></tr>\n</tbody></table></div>", "memory_core": "【第五章 必考考點】：病患詢問保健食品：不責備、不盲目反對，核心處置為「教導辨識成分、標示與功效之評估能力」！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0522", "chapter": "第五章 輔助健康照顧：膳食補充品與糖尿病", "stem": "[共照網考古題 第 100 題] 大蒜在體內的作用，下列敘述何者正確?", "options": ["A. 大蒜素需經蒜胺酸酶的作用,才能轉變成具有作用的活性成分", "B. 蒜胺酸酶在胃中很穩定", "C. 乾燥的大蒜製品需包裹腸衣，以防止胃酸破壞", "D. 大蒜具氧化活性"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第五章 膳食補充品與糖尿病 (共照網考古 第100題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 大蒜在完整未切狀態下含有無活性的「蒜胺酸 (Alliin)」，當大蒜被壓碎或切開時，細胞內的「蒜胺酸酶 (Alliinase)」才會與其接觸，將蒜胺酸水解轉化為具強烈活性與氣味的「大蒜素 (Allicin)」，題目主被動敘述顛倒。\n🔹 (B) 蒜胺酸酶是極度不耐酸的蛋白質酵素，在胃酸 (pH 1.5-2.0) 環境中會「迅速被強酸變性破壞而失去酵素活性」，絕非穩定。\n🔹 (C) 正確。由於蒜胺酸酶極度懼怕強胃酸，口服乾燥大蒜粉劑膠囊若在胃中溶解會被胃酸破壞而無法生成活性大蒜素；因此合格的商業製品「必須包裹腸衣 (Enteric-coated)」，使其完整穿過胃部、直到弱鹼性的小腸環境才溶解釋放，確保轉化出活性大蒜素。\n🔹 (D) 大蒜主要活性為抗氧化、清除自由基，非促氧化。\n\n📊 大蒜生物活性轉化途徑與腸衣劑型必要性：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>生化分子環節</th><th>反應機轉與環境特性</th><th>劑型技術對策</th></tr></thead>\n<tbody>\n<tr><td><b>前驅物與酵素</b></td><td>蒜胺酸 (Alliin) ＋ 蒜胺酸酶 (Alliinase) &rarr; <b>大蒜素 (Allicin)</b></td><td>蒜被切碎壓碎時自發反應</td></tr>\n<tr><td><b>胃酸破壞敏感性</b></td><td><b>蒜胺酸酶對胃酸極度敏感，遇酸立即失活</b></td><td><b>口服膠囊「必須包裹腸衣 (Enteric-coated)」！</b></td></tr>\n<tr><td><b>小腸環境釋放</b></td><td>小腸中性微鹼 (pH > 6.0)，腸衣溶解，蒜胺酸酶順利轉化</td><td>確保發揮抗氧化與調脂效益</td></tr>\n</tbody></table></div>", "memory_core": "【第五章 必考考點】：蒜胺酸酶會被胃酸破壞！乾燥大蒜膠囊「必須包裹腸衣」才能在腸道發揮活性。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0554", "chapter": "第五章 輔助健康照顧：膳食補充品與糖尿病", "stem": "[共照網考古題 第 133 題] 奶薊(Milk Thistle)，是歐洲的食用蔬菜，其幫助血糖控制的主要成分是", "options": ["A. 生物鹼(alkaloids)", "B. 水飛薊素(silymarin)", "C. 巢菜鹼(vicine)", "D. 果膠(pectin)"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第五章 膳食補充品與糖尿病 (共照網考古 第133題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(C)/(D) 異黃酮為大豆活性物；花青素為莓果抗氧化物；大蒜素為大蒜抗菌成分。\n🔹 (B) 正確。奶薊 (Milk Thistle / 水飛薊) 是源自南歐與地中海的傳統草本植物，其幫助改善肝功能與血糖控制最主要的天然生物活性複合成分為「水飛薊素 (Silymarin)」（主要含 Silibinin、Silidianin、Silicristin 等黃酮木脂素）。研究證實水飛薊素具備強大抗氧化、清除自由基、保護肝細胞膜及改善胰島素阻抗之效益。\n\n📊 常見天然草本保健品及其核心活性降糖/抗氧化成分對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>草本補充品名稱</th><th>核心生物活性成分</th><th>主要藥理調節機轉</th></tr></thead>\n<tbody>\n<tr><td><b>奶薊 (Milk Thistle)</b></td><td><b>水飛薊素 (Silymarin / Silibinin)</b></td><td><b>強效抗氧化、抗發炎、保護肝細胞、改善肝臟胰島素阻抗</b></td></tr>\n<tr><td><b>肉桂 (Cinnamon)</b></td><td>水溶性多酚聚合物 (MHCP)</td><td>活化胰島素受體酪胺酸激酶、促進 GLUT4 轉位</td></tr>\n<tr><td><b>武靴葉 (Gymnema)</b></td><td>武靴葉酸 (Gymnemic acid)</td><td>暫時麻痺舌頭甜味味蕾、抑制小腸葡萄糖吸收</td></tr>\n<tr><td><b>薑黃 (Turmeric)</b></td><td>薑黃素 (Curcumin)</td><td>抗發炎、抑制 NF-&kappa;B 途徑、改善血管內皮功能</td></tr>\n</tbody></table></div>", "memory_core": "【第五章 必考考點】：奶薊（水飛薊）顧肝調糖的核心活性成分：就是「水飛薊素 (Silymarin)」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0641", "chapter": "第五章 輔助健康照顧：膳食補充品與糖尿病", "stem": "[共照網考古題 第 241 題] 下列有關菸鹼醯胺的敘述，何者正確？", "options": ["A. 是一種維生素B", "B. 可保護β細胞功能", "C. 可提升抗痙攣藥物的功能", "D. 以上皆是"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第五章 膳食補充品與糖尿病 (共照網考古 第241題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 菸鹼醯胺 (Nicotinamide) 是維生素 B3 (Niacin) 的醯胺形式，其不具備血管擴張排潮紅特性，大劑量主要用於細胞保護研究。\n🔹 (B) 菸鹼酸 (Nicotinic acid) 會加重胰島素抗性使血糖升高，菸鹼醯胺對血糖影響較小。\n🔹 (C) 菸鹼醯胺主要是抑制聚(ADP-核糖)聚合酶 (PARP)，以防止 NAD+ 耗竭。\n🔹 (D) 正確。在第 1 型糖尿病的早期預防臨床試驗（如歐洲著名的 ENDIT 試驗 - 歐洲菸鹼醯胺糖尿病介入試驗）中，研究者發現大劑量菸鹼醯胺能抑制細胞內 PARP 活性、減少自由基對 β 細胞的破壞，曾被廣泛研究用於「嘗試延緩或預防高自體抗體高危險群發病，保護 β 細胞」。\n\n📊 菸鹼醯胺 (Nicotinamide) 在糖尿病臨床研究之定位：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>生化分子機轉</th><th>臨床試驗探索 (ENDIT 研究)</th><th>臨床實證結論</th></tr></thead>\n<tbody>\n<tr><td><b>抑制 PARP 酵素活性</b></td><td>維持細胞內 NAD+ 與 ATP 濃度，保護粒線體</td><td rowspan=\"2\">雖大型三期試驗最終未顯著降低 T1D 發病率，但在文獻上確立其<b>「保護 β 細胞免受自由基破壞」</b>之研究假說</td></tr>\n<tr><td><b>抗氧化自由基清除</b></td><td>減緩一氧化氮 (NO) 與細胞激素對胰島細胞毒性</td></tr>\n</tbody></table></div>", "memory_core": "【第五章 必考考點】：菸鹼醯胺 (Nicotinamide)：曾被大規模臨床試驗研究用於「保護 β 細胞、預防第 1 型糖尿病發病」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0760", "chapter": "第五章 輔助健康照顧：膳食補充品與糖尿病", "stem": "[共照網考古題 第 398 題] 對服用大蒜產品為膳食補充品的糖尿病人會建議監控何種反應?", "options": ["A. 視力模糊", "B. 過敏反應", "C. 流血反應", "D. 血壓"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第五章 膳食補充品與藥物交互作用 (共照網考古 第398題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)(B)(D) 視力、過敏與血壓並非高劑量大蒜精補充品最主要之急性藥物交互作用警戒反應。\n🔹 (C) 正確。大蒜萃取物或濃縮補充品（Garlic supplements）富含大蒜素（Allicin）與大蒜新素（Ajoene），具有強烈的「抗血小板凝集（Anti-platelet aggregation）」與抑制血栓素生成之活性；當糖尿病患者同時服用抗血小板藥物（Aspirin、Clopidogrel）、抗凝血劑（Warfarin、NOACs）或準備接受外科手術時，高劑量大蒜補充品會大幅延長出血時間、顯著增加「流血反應（Bleeding complications，如皮下瘀青、牙齦出血、腸胃道出血）」之重大風險，因此衛教上必須嚴格監控流血反應，並於手術前 1-2 週停用。\n\n📊 常見具抗凝血/抗血小板活性之膳食補充品警戒一覽表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>膳食補充品名稱</th><th>核心活性抗凝成分</th><th>最關鍵需監控之不良反應</th><th>手術前衛教停用要求</th></tr></thead>\n<tbody>\n<tr><td><b>大蒜精 (Garlic)</b></td><td><b>大蒜新素 (Ajoene)、大蒜素</b></td><td><b>流血反應 (Bleeding)、異常瘀血、出血時間延長</b></td><td><b>建議手術前 7 - 14 天停用！</b></td></tr>\n<tr><td>銀杏 (Ginkgo biloba)</td><td>銀杏苦內酯 (Ginkgolide B)</td><td>抑制 PAF 誘發流血、腦出血風險</td><td>建議手術前 7 天停用</td></tr>\n<tr><td>當歸 / 人參</td><td>香豆素衍生物、人參皂苷</td><td>增強抗凝血藥作用引發大量出血</td><td>手術前需完全停用並告知醫師</td></tr>\n</tbody></table></div>", "memory_core": "【第五章 必考考點】：大蒜補充品具抗血小板活性：最需監控【流血反應 (Bleeding)】！手術前必須停用。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0979", "chapter": "第五章 輔助健康照顧：膳食補充品與糖尿病", "stem": "[共照網考古題 第 672 題] 下列何種元素與血糖控制有關？(1)鉻(2)釩(3)鎂", "options": ["A. (1)+(2)", "B. (1)+(3)", "C. (2)+(3)", "D. (1)+(2)+(3)"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第五章 微量元素與糖尿病 (共照網考古 第672題)\n💡 臨床深度題解與選項剖析：\n🔹 (1) 鉻 (Chromium)：三價鉻是耐糖因子 (GTF) 核心成分，能促進胰島素與受體結合，改善胰島素敏感度。\n🔹 (2) 釩 (Vanadium)：硫酸氧釩 (Vanadyl sulfate) 具有顯著的類胰島素受體活化作用，能抑制酪胺酸磷酸酶 (PTPase)，促進外周組織葡萄糖攝取。\n🔹 (3) 鎂 (Magnesium)：鎂是細胞內超過 300 種酵素（包括葡萄糖激酶與胰島素受體酪胺酸激酶）的重要輔因子，缺鎂會加劇嚴重胰島素抗性。\n三種微量元素皆在生化機制上與葡萄糖恆定及胰島素作用密切相關，故選 (1)+(2)+(3)，答案選 D。\n\n📊 與胰島素敏感度及血糖代謝密切相關之三大微量元素：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>微量元素名稱</th><th>主要生化參與機轉</th><th>臨床糖尿病關聯性</th></tr></thead>\n<tbody>\n<tr><td><b>(1) 鉻 (Chromium)</b></td><td><b>組成耐糖因子 (GTF)，促進受體結合</b></td><td>缺乏時誘發葡萄糖失耐，補充改善空腹血糖</td></tr>\n<tr><td><b>(2) 釩 (Vanadium)</b></td><td><b>類胰島素作用，抑制蛋白質酪胺酸磷酸酶</b></td><td>促進細胞內 GLUT-4 轉位攝取葡萄糖</td></tr>\n<tr><td><b>(3) 鎂 (Magnesium)</b></td><td><b>胰島素受體激酶與醣解酵素之必需輔因子</b></td><td>糖尿病患者常經由尿糖大量流失鎂，加劇抗性</td></tr>\n</tbody></table></div>", "memory_core": "【第五章 必考考點】：與血糖控制代謝相關的微量元素三劍客：鉻、釩、鎂，三者全都有關 (1+2+3)！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0126", "chapter": "第八章 糖尿病的藥物治療", "stem": "Pioglitazone（TZD 類）能改善周邊組織對胰島素的敏感度，但容易引起體液滯留水腫。依指引其在下列何種病患中列為「絕對禁忌」？", "options": ["A. 紐約心臟協會（NYHA）第三級或第四級有症狀之鬱血性心臟衰竭患者", "B. 合併中度非酒精性脂肪肝病且轉胺酶 ALT 偏高（< 2.5 倍上限）之個案", "C. 診斷患有高尿酸血症且過去一年內曾發生過急性痛風性關節炎發作之病患", "D. 經心導管檢查確診為冠狀動脈粥狀硬化但左心室射出分率（LVEF）正常者"], "answer": "A", "explanation": "TZD 類活化腎小管上皮鈉離子通道促使水分鈉離子滯留，可能誘發或加劇鬱血性心臟衰竭。因此在有臨床症狀之中重度心衰竭（NYHA Class III/IV）患者為絕對禁忌症。此外長期使用亦增加停經後婦女骨質疏鬆骨折風險。", "memory_core": "【TZD 水腫與心衰禁忌】：Pioglitazone 嚴禁用於心衰竭 NYHA Class III/IV；警惕水腫與骨折風險。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0486", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 62 題] 使用胰島素治療患者，若進食高脂肪飲食時，應如何調整胰島素使用？", "options": ["A. 增加胰島素劑量", "B. 減少胰島素劑量", "C. 延後餐前胰島素注射時間", "D. 提前餐前胰島素注射時間"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第八章 糖尿病的藥物治療 (共照網考古 第62題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B) 胰島素劑量主要由碳水化合物總量決定，若未增加總醣量盲目加量會引發低血糖。\n🔹 (C) 正確。進食「高脂肪大餐（如披薩、麻辣鍋、油炸大餐）」時，高脂肪會強烈刺激小腸釋放膽囊收縮素 (CCK)，顯著「延緩胃排空速率」；使得食物中的葡萄糖消化吸收大幅延後（餐後 3～6 小時才緩慢釋放）。若此時仍依照常規在進食前立即注射速效胰島素，易造成餐後 1-2 小時胰島素達峰時食物未吸收而引發低血糖，數小時後反彈高血糖。因此，臨床實務指引建議應「延後餐前胰島素注射時間」（或在胰島素幫浦使用者採用雙波/方波追加），使胰島素吸收曲線吻合延遲的血糖波峰。\n🔹 (D) 提前注射會使胰島素更早達到高峰，進一步惡化餐後早期急性低血糖。\n\n📊 高脂肪飲食對胃排空與胰島素動態之影響：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>飲食特徵</th><th>生理病理機轉</th><th>胰島素施打時間調整原則</th></tr></thead>\n<tbody>\n<tr><td><b>高脂肪高蛋白飲食 (披薩、炸物)</b></td><td><b>延緩胃排空速率，吸收高峰延後</b></td><td><b>延後餐前注射時間（或進食中/進食後打，幫浦採雙波追加）</b></td></tr>\n<tr><td><b>高升糖精緻醣類 (果汁、稀飯)</b></td><td>胃排空迅速，吸收急遽上升</td><td>餐前 15 分鐘提早注射，精準壓制尖銳波峰</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：高脂肪大餐延緩胃排空：餐後血糖高峰往後移，胰島素應「延後注射」以吻合吸收！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0487", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 63 題] 注射胰島素的糖尿病患出國旅遊時，胰島素該", "options": ["A. 改為口服降血糖藥物", "B. 放托運行李", "C. 放隨身行李", "D. 寄放在領隊"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第八章 糖尿病旅遊與胰島素照護 (共照網考古 第63題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 胰島素依賴型病患若擅自改用口服降糖藥，會導致高血糖急症與酮酸中毒。\n🔹 (B) 正確（何者錯誤之處）。飛機托運行李艙通常未具備恆溫調控，高空氣溫常降至零下 -40°C 至 -50°C，放置於托運行李中的胰島素極易「凍結成冰」；胰島素一旦凍結變性，其蛋白質立體結構破壞完全喪失生物降糖活性，且瓶身可能破裂；此外托運行李有遺失風險。因此「絕對禁止托運」！\n🔹 (C) 正確。出國搭機時，所有胰島素製劑、筆針、針頭、血糖機與試紙，依法必須「隨身攜帶登機（放入隨身手提行李）」，在機艙恆溫環境下保存。\n🔹 (D) 自身重要藥品應自行妥善保管攜帶，不應寄放領隊。\n\n📊 糖尿病患者航空旅行藥物與胰島素攜帶準則：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>安全管控維度</th><th>指引規範做法</th><th>違規致命後果</th></tr></thead>\n<tbody>\n<tr><td><b>攜帶位置</b></td><td><b>100% 放置於「隨身手提行李」</b></td><td><b>托運艙低溫結冰變性失效；行李遺失無藥可用</b></td></tr>\n<tr><td><b>保存溫度</b></td><td>未開封放飯店冷藏 (2～8°C)；使用中常溫 (< 30°C)</td><td>嚴禁放置車廂曝曬或直接接觸冰塊</td></tr>\n<tr><td><b>搭機必備文件</b></td><td>診斷證明書、英文處方箋、藥物原廠包裝標籤</td><td>避免過安檢時被海關扣留針劑</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：胰島素出國搭機「絕對不可托運（防結冰失效）」！必須全部放在「隨身行李」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0544", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 122 題] 有關Acarbose 作用的敘述，下列何者正確？", "options": ["A. 抑制糖澱粉酵素、蔗糖酵素、麥芽糖酵素", "B. 增加蔗糖、澱粉、麥芽糖之消化", "C. 增加胰島素分泌", "D. 減少肝臟葡萄糖之輸出"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第八章 糖尿病的藥物治療 (共照網考古 第122題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。Acarbose (阿卡波糖 / 抑葡糖) 屬於「α-葡萄糖苷酶抑制劑 (AGI)」，其作用機轉是在小腸刷狀緣競爭性抑制「α-澱粉酵素 (Alpha-amylase)、蔗糖酵素 (Sucrase) 及麥芽糖酵素 (Maltase)」，從而延緩多醣與雙醣水解為葡萄糖，降低餐後血糖高峰。\n🔹 (B) AGI 是「延緩並抑制」多醣與雙醣的水解吸收，非增加消化。\n🔹 (C) AGI 不具備刺激胰島 β 細胞分泌胰島素之作用（單獨使用不增加低血糖風險）。\n🔹 (D) 抑制肝臟葡萄糖輸出是 Metformin (雙胍類) 的主要機轉。\n\n📊 α-葡萄糖苷酶抑制劑 (AGI) 藥理機轉與臨床急救警訊：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>藥物項目</th><th>臨床特質與藥理機轉</th><th>衛教必考關鍵陷阱</th></tr></thead>\n<tbody>\n<tr><td><b>代表藥物</b></td><td>Acarbose (Glucobay), Miglitol</td><td>隨餐第一口飯同時咬碎嚼服最佳</td></tr>\n<tr><td><b>主要靶點</b></td><td><b>小腸刷狀緣之澱粉酶、蔗糖酶、麥芽糖酶</b></td><td><b>延緩雙醣分解為單醣，顯著削平「餐後血糖高峰」</b></td></tr>\n<tr><td><b>低血糖急救</b></td><td>單用極不易低血糖，但<b>若合併 SU/Insulin 發生低血糖時</b></td><td><b>嚴禁使用蔗糖/糖果！必須「直接口服純葡萄糖 (Dextrose)」搶救！</b></td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：Acarbose 抑制「澱粉酶、蔗糖酶、麥芽糖酶」！發生低血糖時「只能吃純葡萄糖」搶救！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0559", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 138 題] 李伯伯目前早晚施打NPH 加RI 控制血糖，預定下週將至日本旅遊，您會建議", "options": ["A. 早上的胰島素注射時間依早餐用餐時間而定", "B. 早上的胰島素注射時間延後1 小時", "C. 早上的胰島素注射時間提前半小時", "D. 早上的胰島素注射時間提前1 小時"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第八章 糖尿病旅遊與胰島素照護 (共照網考古 第138題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。日本與台灣的時區僅差 1 個小時（日本快台灣 1 小時），時差極微小；且李伯伯是早晚施打 NPH + RI（與三餐進食直接連動）。在旅行途中時差小於 2-3 小時之短程旅遊，不需要重新換算跨時區胰島素劑量調整公式，早上的胰島素注射時間「直接依照當地的早餐用餐時間施打即可」，生活作息與進食相配合最為安全。\n🔹 (B)/(C)/(D) 在時差僅 1 小時的情況下，刻意提前或延後施打，若進食時間未配合反而容易引發餐前低血糖或高血糖。\n\n📊 糖尿病患者跨時區旅行胰島素調整原則：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>時差跨越幅度</th><th>胰島素調整指導原則</th><th>備註說明</th></tr></thead>\n<tbody>\n<tr><td><b>時差 &lt; 2～3 小時 (如日本、東南亞)</b></td><td><b>不需調整劑量！直接按當地「進食用餐時間」施打</b></td><td><b>李伯伯去日本僅差 1 小時，依早餐時間打即可</b></td></tr>\n<tr><td><b>向東飛行（日子變短，時差 > 3hr）</b></td><td>全天時間縮短，基礎胰島素劑量可能需適度酌減</td><td>抵達後按當地時間施打</td></tr>\n<tr><td><b>向西飛行（日子變長，時差 > 3hr）</b></td><td>全天時間拉長，可能需要在兩餐間追加微量胰島素</td><td>密集監測血糖</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：去日本時差僅 1 小時：免調時差公式，早上胰島素「依早餐用餐時間打」即可！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0634", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 233 題] 下列哪些口服藥物會造成體重增加？ (1) glimepiride (2) repaglinide (3) glipizide(4) rosiglitazone (5) acarbose  (6) metformin  (7) orlistat", "options": ["A. (1)(2)(3)(5)", "B. (1)(3)(4)(7)", "C. (1)(3)(6)(7)", "D. (1)(2)(3)(4)"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第八章 各類降血糖藥物對體重之影響矩陣 (共照網考古 第233題)\n💡 臨床深度題解與選項剖析：\n🔹 檢視題目列出之各項降血糖藥物對體重的藥理作用：\n- **(1) Glimepiride（SU 類促泌劑）**：刺激內源性胰島素分泌，同化合成增加，**造成體重增加**。\n- **(2) Repaglinide（Meglitinide 類促泌劑）**：促進餐時胰島素釋放，**造成體重增加**。\n- **(3) Glipizide（SU 類促泌劑）**：強效促胰島素分泌，**造成體重增加**。\n- **(4) Rosiglitazone（TZD 類）**：活化 PPAR-γ 促進皮下脂肪增生與鈉水滯留，**造成體重顯著增加**。\n- **(5) Acarbose（α-葡萄糖苷酶抑制劑）**：抑制腸道多醣吸收，體重呈中性或微減。\n- **(6) Metformin（雙胍類）**：抑制食慾與肝糖輸出，使體重微幅下降或維持中性。\n- **(7) Orlistat（羅氏鮮）**：胃腸脂解酶抑制劑，是標準減肥藥物，減輕體重。\n🔹 綜上所述，會造成體重增加的口服藥物組合為 **(1)(2)(3)(4)**。\n🔹 (D) 正確。\n\n📊 臨床常用降血糖藥物對體重影響光譜對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>體重影響方向</th><th>藥物種類品項</th><th>體重變化的核心藥理機轉</th></tr></thead>\n<tbody>\n<tr><td><b>造成體重增加 (Weight Gain)</b></td><td><b>(1) Glimepiride、(2) Repaglinide、(3) Glipizide、(4) TZD (Rosiglitazone/Pioglitazone)、胰島素</b></td><td><b>促胰島素同化作用增加、脂肪合成與水分滯留</b></td></tr>\n<tr><td><b>體重呈中性 (Weight Neutral)</b></td><td>DPP-4 抑制劑 (Sitagliptin/Linagliptin)、Acarbose</td><td>不干擾全身能量平衡</td></tr>\n<tr><td><b>促進體重減輕 (Weight Loss)</b></td><td>SGLT2 抑制劑 (排糖排卡)、GLP-1 受體促效劑 (中樞抑食延排空)、Metformin、Orlistat</td><td>增加能量消耗、排出熱量、抑制中樞食慾</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：造成體重增加的降糖藥：【磺醯尿素類 (SU)、Glinide 促泌劑、TZD (Glita)、胰島素】！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0695", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 314 題] 胰島素增敏劑的作用何者錯誤", "options": ["A. 降低空腹血糖", "B. 造成腎功能異常", "C. 常見副作用為水腫", "D. 單獨使用不易造成低血糖"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第八章 糖尿病的藥物治療 (共照網考古 第314題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) TZD 主要作用於肝臟、肌肉與脂肪細胞，顯著增強胰島素敏感度並強力抑制肝臟糖質新生，有效降低空腹與全天血糖。\n🔹 (B) 正確（何者錯誤）。TZD (Pioglitazone) 主要經由肝臟細胞色素 P450 代謝，非經腎臟排泄，不具腎毒性，也「不會造成腎功能異常」；在慢性腎臟病 (CKD) 輕中重度患者中均可安全使用無需依 eGFR 調降劑量（但心衰竭為禁忌）。\n🔹 (C) TZD 會刺激腎臟集尿管上皮細胞鈉離子重吸收，造成體液滯留，周邊水腫 (Peripheral edema) 為其最常見的臨床副作用。\n🔹 (D) TZD 本身屬於「增敏劑」而非「促分泌素」，單獨使用時不會促使胰臟過量分泌胰島素，因此極不易引發低血糖。\n\n📊 胰島素增敏劑 (Thiazolidinediones, TZD) 核心藥理與禁忌速查表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>藥物名稱</th><th>優點與主要效益</th><th>常見副作用與安全性警訊</th><th>臨床絕對禁忌</th></tr></thead>\n<tbody>\n<tr><td><b>Pioglitazone (愛妥糖)</b></td><td>• 極不易低血糖<br>• 改善脂肪肝 (NASH/MASH)<br>• 具心血管與中風次級預防實證<br>• <b>CKD 腎病各期無需調劑量</b></td><td>• <b>體液滯留、周邊水腫</b><br>• 體重增加 (脂肪重分佈)<br>• 骨質疏鬆與女性骨折風險<br>• 過去曾有膀胱癌疑慮 (現已平反但血尿者慎用)</td><td><b>充血性心臟衰竭 (NYHA Class III / IV) 絕對禁用！</b></td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：TZD「不易低血糖、肝臟代謝不傷腎」，但會「水腫、體液滯留、增重、骨折」，「重度心衰竭嚴禁使用」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0697", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 316 題] 常見第2 型糖尿病人的用藥隨時間增多，主要原因為何", "options": ["A. β細胞逐漸衰退", "B. 胰島素抗性(insulin resistance) 逐漸增加", "C. 飲食控制不佳", "D. 藥物副作用"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第八章 糖尿病的藥物治療 (共照網考古 第316題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。依據英國前瞻性糖尿病研究 (UKPDS) 里程碑試驗：第 2 型糖尿病在確診時，胰島 β 細胞分泌功能通常已經衰退喪失約 50%；且隨著罹病時間進展，β 細胞功能以「每年約 4%～5% 的速度持續退化凋亡」。這種無法逆轉的「β 細胞功能進行性衰退」，正是導致病患隨著罹病年資增長，必須由單藥治療陸續追加雙藥、三藥甚至最終必須注射胰島素的最核心病理生理原因。\n🔹 (B) 胰島素阻抗在病程早期即已存在，通常維持相對高原平台期，非藥物隨時間暴增的主因。\n🔹 (C)/(D) 飲食配合不佳與副作用是控制不良之誘因，但非長期自然的退化病理根源。\n\n📊 UKPDS 里程碑試驗：β 細胞進行性衰退軌跡：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>病程進展節點</th><th>β 細胞功能殘存率</th><th>臨床用藥階梯對策</th></tr></thead>\n<tbody>\n<tr><td><b>確診前 10～12 年</b></td><td>約 100% (高胰島素血症代償)</td><td>胰島素抗性逐漸升高</td></tr>\n<tr><td><b>確診當下 (診斷點)</b></td><td><b>已衰退至約 50%</b></td><td>生活型態 ＋ 單一藥物 (Metformin)</td></tr>\n<tr><td><b>確診後 6～10 年</b></td><td><b>進行性衰退至 &lt; 20%～25%</b></td><td><b>口服藥逐漸失效，必須追加二線/三線藥物或胰島素</b></td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：T2D 藥物越吃越多、越吃越重的主因：就是「胰臟 β 細胞功能隨時間逐漸衰退 (UKPDS)」！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0710", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 336 題] 有關胰島素治療計畫中胰島素注射劑量與方式因人而異的敍述，何者錯誤?", "options": ["A. 生理上胰島素整天呈現多個分泌高峰來反應各種刺激(如進食或反向調控激素分泌所造成的 高血糖) 進食後的胰島素分泌稱為大量分泌（bolus）；對抗賀爾蒙或其他升糖作用的胰島素 分泌稱為基礎分泌（basal）。因此，生理性胰島素分泌在一天之中呈現數個高峰（大量分泌） 及低谷（基礎分泌）。", "B. 常用的一天一次基礎胰島素注射也可模仿生理的胰島素分泌曲線，包括分泌高峰及低谷。", "C. 根據胰島素的藥理學及藥物動力學，要達到最佳的血糖控制，人體必須接受持續的小量(基礎) 胰島素，及正餐或點心前的大量胰島素。", "D. DCCT 研究顯示，接受積極胰島素療法(多次胰島素注射與胰島素幫浦)的病患， 血糖控制效果優於傳統胰島素治療（一天兩次）"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第八章 糖尿病的藥物治療 (共照網考古 第336題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 生理性胰島素分泌包含 24 小時平穩持續的「基礎分泌 (Basal)」以抑制肝糖輸出，以及因應三餐進食刺激所產生的「餐時大量分泌 (Bolus)」，全天呈現多個波峰與低谷。\n🔹 (B) 正確（何者錯誤）。常用的一天一次長效基礎胰島素（如 Glargine、Degludec）其藥理設計目標是提供「完全沒有高峰、平坦無波動的 24 小時平穩曲線」，只能涵蓋空腹基礎需求，完全「無法模仿進食後的數個分泌高峰」；餐後高峰必須依賴餐時速效胰島素或內源性分泌。\n🔹 (C) 最佳的強化控糖模式必須由持續的小量基礎與餐前大量追加共同組成。\n🔹 (D) DCCT 里程碑研究證實：積極胰島素強化治療（MDI 或幫浦）的降糖成效與併發症預防遠優於傳統一天兩次注射。\n\n📊 正常生理性胰島素分泌 vs 一天一次基礎胰島素對照：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>分泌/給藥型態</th><th>動力學特徵</th><th>主要負責生理功能</th></tr></thead>\n<tbody>\n<tr><td><b>正常生理分泌</b></td><td><b>「平穩基底低谷」＋「三餐進食尖銳高峰」</b></td><td>全方位平衡空腹肝糖輸出與餐後外周葡萄糖吸收</td></tr>\n<tr><td><b>一天一次基礎胰島素</b></td><td><b>「無高峰 (Peakless)、全天平坦釋放」</b></td><td><b>僅負責控制空腹基礎血糖，完全不能涵蓋餐後高峰！</b></td></tr>\n<tr><td><b>餐時速效追加 (Bolus)</b></td><td>注射後 15 分鐘起效、1 小時高峰</td><td>專責模擬生理進食後的高峰大量分泌</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：一天一次長效基礎胰島素是「無波峰、平坦無谷」的，無法模仿進食分泌高峰！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0750", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 385 題] 使用pioglitazone 造成之影響，何者有誤？", "options": ["A. 體重增加", "B. 血紅素濃度上升", "C. 水腫", "D. 高密度脂蛋白膽固醇上升"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第八章 TZD 類降血糖藥物 (Pioglitazone) 臨床藥理 (共照網考古 第385題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 體重增加：Pioglitazone 活化脂肪細胞 PPAR-γ，促使周邊皮下脂肪細胞分化並蓄積水分，常導致體重增加 1-3 公斤。\n🔹 (B) 正確（何者有誤）。Pioglitazone 在腎臟遠曲小管活化上皮鈉離子通道（ENaC），促使腎臟鈉水再吸收暴增，引發顯著的「體液滯留與血漿容積擴張（Plasma volume expansion）」；這會造成血液稀釋效應，導致臨床檢驗上出現「血紅素（Hemoglobin）與血球容積比（Hematocrit）輕微下降（稀釋性貧血）」，絕對不會造成「血紅素濃度上升」，故此陳述錯誤！\n🔹 (C) 水腫：體液滯留常見下肢水腫（約 3-5%，若併用胰島素可高達 10-15%），紐約心臟學會 (NYHA) 第 III、IV 級心衰竭患者禁用。\n🔹 (D) HDL-C 上升：Pioglitazone 兼具部分 PPAR-α 促效活性，能降低 TG 並促使 HDL-C 上升約 10-15%。\n\n📊 Pioglitazone (PPAR-γ 促效劑) 臨床效益與常見副作用表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床表現維度</th><th>具體效應方向</th><th>臨床藥理機轉與照護警戒</th></tr></thead>\n<tbody>\n<tr><td><b>血液學檢驗</b></td><td><b>血紅素 (Hb) 與 Hct 輕度下降 (↓ 稀釋性)</b></td><td><b>體液容積擴張稀釋血液；非骨髓造血抑制</b></td></tr>\n<tr><td><b>水份與心血管</b></td><td><b>鈉水滯留、周邊下肢水腫、體重增加</b></td><td><b>心臟衰竭病患嚴格禁用！</b>防範肺水腫</td></tr>\n<tr><td>血脂代謝</td><td>三酸甘油酯下降、<b>HDL-C 升高 (↑)</b></td><td>改善糖尿病致粥瘤性血脂譜</td></tr>\n<tr><td>骨骼系統</td><td>骨質密度下降、骨折風險增加</td><td>停經後女性與骨鬆高危險群需審慎評估</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：Pioglitazone 引起鈉水滯留、體重增加與水腫；血液被稀釋導致「血紅素下降」（不是上升）！心衰竭禁用。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0785", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 438 題] 下列何者不屬於使用胰島素的適應症", "options": ["A. 第1 型糖尿病人", "B. 第2 型糖尿病懷孕婦女", "C. 糖尿病酮酸中毒", "D. 要減重的糖尿病人"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第八章 胰島素臨床適應症與同化合成副作用 (共照網考古 第438題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 第 1 型糖尿病：胰島 β 細胞自體免疫破壞，胰島素絕對缺乏，為終身使用胰島素之絕對適應症。\n🔹 (B) 第 2 型糖尿病懷孕婦女：口服藥大多會穿透胎盤且具潛在致畸風險或缺乏長期安全性實證，胰島素不穿透胎盤，為孕期控糖之第一線首選適應症。\n🔹 (C) 糖尿病酮酸中毒 (DKA)：重度代謝危象，必須立即靜脈注射常規短效胰島素 (Regular Insulin) 以阻斷脂肪分解與酮體生成。\n🔹 (D) 正確（何者不屬於使用胰島素的適應症）。**胰島素是人體最強大的「同化促合成荷爾蒙（Anabolic hormone）」**；外源性注射胰島素會促進骨骼肌與脂肪組織攝取葡萄糖，並強烈刺激脂肪組織進行三酸甘油酯合成、完全抑制脂肪分解，臨床上使用胰島素最常見的代謝副作用就是「**體重增加（Weight gain）**」！因此「要減重的糖尿病人」絕對不可能把胰島素當作適應症，相反地，過度使用胰島素往往是阻礙減重的障礙，故 (D) 絕非適應症。\n\n📊 胰島素絕對適應症 vs 禁忌/非適應症對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床適應症分類</th><th>典型臨床情境</th><th>給予胰島素之藥理目的</th></tr></thead>\n<tbody>\n<tr><td><b>絕對必需適應症</b></td><td><b>第 1 型糖尿病、妊娠糖尿病/孕前糖尿病懷孕</b></td><td><b>替代體內缺乏之荷爾蒙，不穿透胎盤最安全</b></td></tr>\n<tr><td><b>急性急症適應症</b></td><td><b>糖尿病酮酸中毒 (DKA)、高滲透壓狀態 (HHS)、重大外科手術</b></td><td>迅速逆轉高血糖毒性與代謝酸中毒</td></tr>\n<tr><td><b>非適應症 / 反向副作用</b></td><td><b>單純肥胖「要減重」的第 2 型糖尿病患</b></td><td><b>胰島素促脂肪合成、增加體重，絕非減重適應症！</b></td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：胰島素促進脂肪合成會增加體重，【絕非減重適應症】！T1D、懷孕、DKA 是絕對適應症。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0853", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 513 題] 下列何者不是口服抗糖尿病藥 thiazolidinedione（TZD）的作用？", "options": ["A. 增加游離脂肪酸", "B. 降血壓", "C. 增加脂締素（Adiponectin）", "D. 降低tumor necrosis factor-alpha (TNF-α)"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第八章 TZD 類藥物分子機轉與游離脂肪酸調節 (共照網考古 第513題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者不是 TZD 的作用）。Thiazolidinedione（TZD，如 Pioglitazone）是細胞核受體 PPAR-γ 的強力致效劑。活化 PPAR-γ 會促進皮下前脂肪細胞分化為成熟的小脂肪細胞，將血液中具有脂毒性的游離脂肪酸（FFA）強烈抽取並安全儲存至皮下脂肪庫中，從而「顯著降低血中游離脂肪酸（FFA 濃度下降）」！此作用直接解除了骨骼肌與肝臟的脂肪毒性（Lipotoxicity），逆轉胰島素抗性；故宣稱「增加游離脂肪酸」完全顛倒其核心藥理機轉，為錯誤選項。\n🔹 (B) 降血壓：TZD 能改善血管內皮功能、減少細胞間質鈣離子並降低交感神經張力，能輔助微幅降低血壓（約 2-5 mmHg）。\n🔹 (C) 增加脂締素（Adiponectin）：TZD 能直接刺激脂肪細胞基因轉錄，使抗炎、抗動脈硬化的脂締素濃度大幅提升 2-3 倍。\n🔹 (D) 降低腫瘤壞死因子 (TNF-α)：抑制單核巨噬細胞與脂肪發炎反應，下調致炎因子 TNF-α。\n\n📊 TZD 類藥物 (Pioglitazone) 活化 PPAR-γ 之多重代謝效應表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>生物化學調控路徑</th><th>TZD 介入後之變化方向</th><th>臨床代謝與心血管獲益</th></tr></thead>\n<tbody>\n<tr><td><b>血中游離脂肪酸 (FFA)</b></td><td><b>顯著降低 (↓ 核心機轉)</b></td><td><b>解除全身脂毒性，大幅改善肌肉與肝臟胰島素阻抗</b></td></tr>\n<tr><td><b>保護性脂締素 (Adiponectin)</b></td><td><b>大幅上升 (↑ 2-3 倍)</b></td><td>促進脂肪酸氧化、抗動脈粥狀硬化斑塊形成</td></tr>\n<tr><td>致炎細胞激素 (TNF-α, IL-6)</td><td>顯著下降 (↓)</td><td>減輕全身性慢性低度發炎反應</td></tr>\n<tr><td>血管內皮與血壓</td><td>內皮功能改善、血壓微降</td><td>改善血管擴張反應性</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：TZD 活化 PPAR-γ 抽走脂肪毒性，使血中【游離脂肪酸下降】（不是增加！），脂締素增加！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0984", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 680 題] 對於重複使用胰島素注射器注意事項之描述，下列何者錯誤？", "options": ["A. 針頭重複使用前需考慮病患是否有能力安全的回蓋針頭。", "B. 針頭已變鈍、彎曲、變形或以接觸皮膚其他部位則須丟棄。", "C. 重複使用注射器，針筒刻度可能會不清楚", "D. 使用前需使用酒精棉消毒針頭處。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第八章 胰島素注射技術與照護 (共照網考古 第680題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 重複使用針頭前必須評估病患手部靈巧度與認知視力，確保其能安全將針頭內外蓋回套而不扎傷自己。\n🔹 (B) 針頭顯微鏡下使用一次即變鈍彎曲，若已變形、勾毛或接觸非無菌表面必須立即丟棄。\n🔹 (C) 反覆抽吸插拔可能磨損針筒表面刻度造成劑量讀取困難。\n🔹 (D) 正確（何者錯誤）。美國與台灣糖尿病衛教學會注射指引明確規範：若病患基於經濟自費因素重複使用同一針頭，在「注射前絕對不可使用酒精棉片擦拭消毒針頭」！因為酒精會溶解並破壞針頭表面的超薄「矽膠潤滑塗層 (Silicone coating)」，導致扎針阻力倍增引發劇烈疼痛與組織撕裂，且殘留酒精進入皮下會造成化學性刺痛。\n\n📊 胰島素筆針針頭安全使用與重複使用衛教規範：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>指引規範項目</th><th>官方標準原則</th><th>重要理由說明</th></tr></thead>\n<tbody>\n<tr><td><b>黃金使用準則</b></td><td><b>「一次性使用，每針更換」</b></td><td>確保無菌無痛、預防局部皮下組織脂肪增生</td></tr>\n<tr><td><b>酒精擦拭針頭禁忌</b></td><td><b>「絕對嚴禁使用酒精擦拭針頭」！</b></td><td><b>酒精會洗去矽膠潤滑塗層，造成劇烈穿刺疼痛與皮下受損</b></td></tr>\n<tr><td><b>必須丟棄時機</b></td><td>針頭變鈍、穿刺疼痛感增加、針頭接觸非皮膚污染處</td><td>避免感染與針尖斷裂於皮下之風險</td></tr>\n</tbody></table></div>", "memory_core": "【第八章 必考考點】：針頭重複使用時「絕對不可用酒精棉片擦拭針頭」！會破壞矽膠潤滑層導致扎針劇痛！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1023", "chapter": "第八章 糖尿病的藥物治療", "stem": "[共照網考古題 第 727 題] 下列關於胰島素增敏劑(insulin sensitizers )的敘述，何者錯誤?", "options": ["A. 體重增加為常見的副作用。", "B. 相較於磺醯脲素類與雙胍類藥物，可維持較長期血糖的穩定效果。", "C. 對肝功能影響程度小。", "D. 可和雙胍類或促胰島素分泌劑合併使用"], "answer": "C", "explanation": "【2026 核心課本出處：第八章 糖尿病的藥物治療（第三節 四、Thiazolidinediones 類 TZDs）】\n• 核心課本第八章第三節原文依據：\n  - (A) 正確：TZD（如 Pioglitazone）活化 PPAR-γ 促進脂肪細胞分化與體液滯留，常見副作用為體重增加與周邊水腫。\n  - (B) 正確：相較於磺醯脲素類（SU）與雙胍類（Metformin），TZD 改善周邊組織（骨骼肌、脂肪、肝臟）胰島素敏感度，可維持較長期的血糖穩定效果。\n  - (C) 【錯誤，為本題正解】：核心課本第八章明載，第一代 TZD（Troglitazone）曾因嚴重肝毒性問題下市；現行使用 TZD 前應檢測肝功能，若活性肝病或 ALT > 正常值上限 2.5~3 倍時禁用，因此「對肝功能影響程度小、不需注意肝功能」為錯誤敘述！\n  - (D) 正確：TZD 為胰島素增敏劑，可與雙胍類（Metformin）或促胰島素分泌劑（SU）等不同機轉藥物合併使用。", "memory_core": "【第八章 必考考點】：TZD（Pioglitazone）可長效改善胰島素阻抗，但常見副作用為水腫、體重增加、骨折風險；嚴重心衰竭（NYHA Class III/IV）與活動性肝病（ALT 異常升高）禁用！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0085", "chapter": "第六章 糖尿病病人之運動", "stem": "患有嚴重非增殖型視網膜病變（Severe NPDR）或增殖型視網膜病變（PDR）之糖尿病個案，運動處方中應「嚴格避免」下列何種運動型態？", "options": ["A. 坐姿固定式健身腳踏車或平地規律慢走，這類無頭部大幅晃動且血壓變異較平穩之低至中等強度有氧運動", "B. 雙手持輕量彈力帶進行上肢關節活動度訓練，並於運動全程保持深長且均勻規律之胸腹式呼吸節奏", "C. 劇烈閉氣用力之瓦氏動作（如大重量槓鈴推舉、劇烈負重搬運）及可能引發眼壓驟升的倒立與高衝擊動作", "D. 溫和的水中漫步或水中浮板前進訓練，利用水之浮力減少關節負擔且運動中完全不需用力閉氣憋壓"], "answer": "C", "explanation": "重度 NPDR 或 PDR 個案眼底新生血管脆弱，劇烈閉氣用力（Valsalva 動作）會使胸腔及眼內血管壓力劇增，極易誘發玻璃體出血（Vitreous hemorrhage）或視網膜剝離。應避免重訓憋氣與劇烈碰撞倒立動作。", "memory_core": "【視網膜病變運動禁忌】：重度病變嚴禁「閉氣用力（Valsalva）」、劇烈重訓、倒立或頭部劇烈震盪，防玻璃體出血！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0091", "chapter": "第六章 糖尿病病人之運動", "stem": "陳先生為第 1 型糖尿病患者，參加 200 公尺短跑比賽衝刺，在跑完後 10 分鐘測得血糖高達 320 mg/dL。衛教師應向其解釋其急性高血糖之主要機轉為何？", "options": ["A. 短時間劇烈衝刺造成骨骼肌細胞嚴重破壞，使肌肉內儲存的肌糖原全數外溢滲透進入微血管循環所直接導致", "B. 劇烈運動使腎臟腎絲球濾過率暫時性歸零，導致血液中原有的葡萄糖完全無法隨尿液排出而造成急性血液濃縮", "C. 無氧運動促使副交感神經高度興奮，強烈抑制周邊組織 GLUT4 轉運蛋白之活性而阻斷骨骼肌攝取葡萄糖", "D. 短跑屬高強度無氧運動，交感神經興奮釋放大量兒茶酚胺與反向調節荷爾蒙，刺激肝糖分解使血糖暫時急遽上升"], "answer": "D", "explanation": "高強度無氧運動（如短跑衝刺、大重量爆發）會刺激體內壓力性升糖荷爾蒙（腎上腺素、去甲腎上腺素、升糖素）瞬間飆高，驅使肝臟肝醣狂暴分解入血，常造成運動後暫時性的急性高血糖。", "memory_core": "【高強度無氧升糖機轉】：劇烈衝刺誘發兒茶酚胺風暴，肝臟輸出葡萄糖遠大於周邊消耗，血糖反升！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0097", "chapter": "第六章 糖尿病病人之運動", "stem": "高血壓合併自律神經病變之糖尿病個案進行阻力訓練時，為預防血壓突然急遽暴衝飆高，衛教師應指導個案遵守何種呼吸原則？", "options": ["A. 用力推舉負重時規律吐氣、還原放鬆時吸氣，運動全程保持呼吸節奏順暢，嚴禁閉氣憋力", "B. 推舉動作起始時先行深吸氣並閉氣閉緊聲門（Valsalva 動作），藉由增加腹內壓以保護胸椎", "C. 阻力運動全程應維持快速淺層過度換氣，以盡可能降低血液二氧化碳分壓並預防運動性酸中毒", "D. 負重上升與下落階段皆應強制閉氣至少 10 秒鐘，以反射性誘發迷走神經興奮降低心肌耗氧量"], "answer": "A", "explanation": "阻力重訓時若憋氣用力（Valsalva maneuver）會造成胸腔內壓暴增、靜脈回流驟減隨後血壓反彈飆高至極度危險水平。必須強調「用力時吐氣、還原時吸氣」，避免血壓暴衝與血管破裂。", "memory_core": "【阻力訓練呼吸鐵律】：用力時吐氣、還原時吸氣，全程順暢呼吸，嚴禁閉氣憋氣！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0529", "chapter": "第六章 糖尿病病人之運動", "stem": "[共照網考古題 第 107 題] 糖尿病患者在運動前應有適當的評估，下列各項評估中何者非必要項目？", "options": ["A. 體脂肪的評估 。", "B. 自主神經功能檢查 。", "C. 運動心電圖評估 。", "D. 糖尿病相關合併症的評估。"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第六章 運動前醫學評估 (共照網考古 第107題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者非必要評估項目）。「體脂肪測量（如 InBody 或皮褶厚度計）」雖然對於減重追蹤有參考價值，但它「完全不是評估病患從事運動時是否會發生急性生命危險或運動傷害的醫學安全必要項目」！\n🔹 (B) 自主神經功能檢查：評估是否有心血管自律神經病變 (CAN)、姿勢性低血壓或固定心率，為心血管安全必評項目。\n🔹 (C) 運動心電圖 (Exercise ECG / Stress Test)：評估是否有潛在無痛性心肌缺血 (Silent Ischemia)，為中高危險群必做項目。\n🔹 (D) 糖尿病相關合併症：評估重度視網膜病變（禁劇烈阻力運動防玻璃體出血）、足部感覺喪失（禁負重防足潰瘍），極具必要性。\n\n📊 糖尿病患運動前「安全醫療評估」核心清單：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>安全評估項目</th><th>評估檢查工具與目的</th><th>臨床醫學安全必要性</th></tr></thead>\n<tbody>\n<tr><td><b>心血管系統</b></td><td>運動心電圖 (Stress test)、心絞痛症狀評估</td><td><b>絕對必要（防範運動中心肌梗塞猝死）</b></td></tr>\n<tr><td><b>自律神經系統</b></td><td>姿勢性血壓測量、固定安靜心率評估</td><td><b>絕對必要（防姿勢性低血壓暈厥）</b></td></tr>\n<tr><td><b>微血管併發症</b></td><td>散瞳眼底檢查、足部 10g 單絲觸覺檢查</td><td><b>絕對必要（防玻璃體出血、防足部潰瘍破皮）</b></td></tr>\n<tr><td><b>體脂肪評估</b></td><td>身體組成分析、皮褶厚度測量</td><td><b>非必要項目（僅供減重體態參考，無關運動安全禁忌）</b></td></tr>\n</tbody></table></div>", "memory_core": "【第六章 必考考點】：運動前安全評估必做：心血管、自主神經、眼底足部併發症；「體脂肪評估」非安全必要項目！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0530", "chapter": "第六章 糖尿病病人之運動", "stem": "[共照網考古題 第 108 題] 糖尿病患者如果要藉助運動減重，則建議運動頻率最好為?", "options": ["A. 一週三次。", "B. 兩天一次。", "C. 一週三到四天。", "D. 一週五到七天。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第六章 運動處方與減重頻率 (共照網考古 第108題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B)/(C) 一週 1 至 4 天的運動量對於減重而言熱量赤字過少，無法達到顯著體重減輕。\n🔹 (D) 正確。各國運動醫學會 (ACSM) 與糖尿病臨床照護指引一致明確建議：糖尿病患者若目標在於「減重 (Weight Loss) 及減重後的體重長期維持」，每週運動頻率最好達到「一週五到七天（每週至少 5 天以上，累積達 250～300 分鐘中等強度運動）」，頻繁運動能持續維持高代謝率並顯著消耗體脂肪。\n\n📊 糖尿病運動頻率依「目標導向」設定矩陣：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>運動核心目標</th><th>指引建議每週頻率</th><th>每週累積建議時數</th></tr></thead>\n<tbody>\n<tr><td><b>常規改善血糖 (A1c 達標)</b></td><td>一週至少 3～4 天 (連休不超過 2 天)</td><td>每週至少 150 分鐘中等強度</td></tr>\n<tr><td><b>藉運動減重 (本題考點)</b></td><td><b>「一週五到七天」 (每週 5 天以上)</b></td><td><b>每週 250～300 分鐘以上</b></td></tr>\n</tbody></table></div>", "memory_core": "【第六章 必考考點】：藉運動減重的黃金頻率：最好達到「一週五到七天」！累積 250-300 分鐘。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0618", "chapter": "第六章 糖尿病病人之運動", "stem": "[共照網考古題 第 213 題] 糖尿病患者如果要藉助運動減重，則建議運動頻率最好為?", "options": ["A. 一週三次", "B. 兩天一次", "C. 一週三到四天", "D. 一週五到七天"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第六章 糖尿病病人之運動（運動處方與體重管理） (共照網考古 第213題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B)/(C) 每週 1 至 4 天運動量能改善胰島素敏感度，但對於消耗過剩體脂肪以達到減重目標而言熱量缺口不足。\n🔹 (D) 正確。依據美國運動醫學會 (ACSM) 與糖尿病臨床照護指引：糖尿病患者若目標在於「減輕體重並長期維持減重成效」，運動頻率最好達到「每週 5 天以上（建議每週累積 250～300 分鐘以上中等強度運動）」，頻繁運動能持續拉高每日總能量消耗 (TDEE)，創造足夠的熱量赤字。\n\n📊 糖尿病運動處方目標與建議頻率對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>主要運動目標</th><th>指引建議每週頻率</th><th>每週累積建議運動時間</th></tr></thead>\n<tbody>\n<tr><td><b>常規血糖控制與心血管保養</b></td><td>每週至少 3 天 (不可連續 2 天不動)</td><td>每週至少 150 分鐘中等強度有氧</td></tr>\n<tr><td><b>減重與體重長期維持 (本題考點)</b></td><td><b>每週至少 5～7 天 (最好每週 5 天以上)</b></td><td><b>每週 250～300 分鐘中等強度運動</b></td></tr>\n</tbody></table></div>", "memory_core": "【第六章 必考考點】：一般控糖每週至少 3 天（150 分鐘，不連續休 2 天）；藉運動減重建議「每週 5～7 天」（每次 45～60 分鐘）。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0651", "chapter": "第六章 糖尿病病人之運動", "stem": "[共照網考古題 第 253 題] 林先生，第1 型糖尿病病患，某日下午他計劃與友人打網球50 分鐘， 打球前他的血糖值為196 mg/dl，此時對其飲食的建議，下列何者適當？", "options": ["A. 不需要額外吃點心", "B. 吃一份水果", "C. 吃一份麵包＋一份水果", "D. 吃一份麵包＋一份肉類"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第六章 糖尿病病人之運動 (共照網考古 第253題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 打網球 50 分鐘屬於中等至劇烈強度的全身性運動，消耗大量肌肝醣，若不額外補充點心極易引發運動中或運動後延遲性低血糖。\n🔹 (B) 一份水果僅含 15g 碳水化合物，不足以支撐長達近 1 小時之高強度網球運動。\n🔹 (C) 正確。依據第 1 型糖尿病運動醣類補充臨床指引：當運動前血糖在 180～200 mg/dL 左右且即將從事長達 45～60 分鐘的中高強度運動時，建議補充約「30 克碳水化合物（約 2 份醣，例如一份麵包 15g + 一份水果 15g）」，以持續供應活動肌群葡萄糖利用，避免發生急性低血糖。\n🔹 (D) 肉類純蛋白質無法迅速水解轉化為游離葡萄糖，對即時補充運動能量無益。\n\n📊 T1D 運動時間強度與醣類補充建議矩陣：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>運動前實測血糖</th><th>運動預計持續時間</th><th>建議額外補充醣量</th><th>食物實體搭配範例</th></tr></thead>\n<tbody>\n<tr><td><b>100～180 mg/dL</b></td><td>中等強度 30～60 分鐘</td><td>補充 15g 醣 (1 份)</td><td>水果 1 份 或 餅乾 3 片</td></tr>\n<tr><td><b>180～240 mg/dL</b></td><td><b>中高強度持續近 1 小時 (如網球)</b></td><td><b>補充 25～30g 醣 (2 份)</b></td><td><b>麵包 1 份 ＋ 水果 1 份 (正確答案)</b></td></tr>\n<tr><td><b>&gt; 250 mg/dL (有尿酮)</b></td><td>任何強度</td><td>嚴禁運動！</td><td>施打校正胰島素</td></tr>\n</tbody></table></div>", "memory_core": "【第六章 必考考點】：T1D 打網球近一小時：運動消耗大，建議補充「2 份醣（一份麵包＋一份水果，約 30g 醣）」防低血糖！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0724", "chapter": "第六章 糖尿病病人之運動", "stem": "[共照網考古題 第 353 題] 運動可以改善血糖是因為", "options": ["A. 運動後增加肌肉細胞對葡萄糖吸收能力", "B. 運動後增加肝醣合成，加速體脂肪燃燒", "C. 運動後加速藥物代謝", "D. 運動後食慾減少"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第六章 運動生理與葡萄糖代謝 (共照網考古 第353題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。運動之所以能強效降低血糖的核心生理機轉在於：骨骼肌收縮時刺激細胞內鈣離子釋放與 AMPK 酵素活化，直接促使「葡萄糖轉運蛋白-4 (GLUT-4) 迅速轉移至骨骼肌細胞膜表面」，使血液中的葡萄糖能被大量轉運進肌細胞內氧化利用；最重要的是，這一轉位過程「完全不依賴胰島素」即可進行，因此能直接克服周邊組織的胰島素阻抗。\n🔹 (B) 運動並不會刺激胰臟 β 細胞「大量分泌」胰島素（運動中交感神經興奮反而生理性抑制胰島素分泌以防低血糖）。\n🔹 (C) 運動會暫時抑制胃排空，但非改善全天血糖主因。\n🔹 (D) 運動不會增加肝臟葡萄糖釋出（過度劇烈運動才會）。\n\n📊 運動刺激骨骼肌 GLUT-4 轉位機制核心圖解：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>刺激來源</th><th>細胞內傳導路徑</th><th>對 GLUT-4 之效應</th><th>臨床降血糖特質</th></tr></thead>\n<tbody>\n<tr><td><b>運動 / 骨骼肌收縮</b></td><td><b>肌肉收縮 &rarr; 鈣離子升高 ＋ 活化 AMPK 途徑</b></td><td><b>促使 GLUT-4 由細胞質囊泡「轉位到細胞膜」</b></td><td><b>「非胰島素依賴性」！即使嚴重胰島素抗性依然能降糖！</b></td></tr>\n<tr><td><b>靜息安靜進食後</b></td><td>胰島素結合受體 &rarr; 活化 IRS-1 / PI3K 途徑</td><td>促使 GLUT-4 轉位</td><td>受胰島素阻抗干擾嚴重受損</td></tr>\n</tbody></table></div>", "memory_core": "【第六章 必考考點】：運動改善血糖的神奇密碼：骨骼肌收縮促使「GLUT-4 轉位到細胞膜」，不靠胰島素就能吃掉血糖！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0172", "chapter": "第十一章 糖尿病眼部疾病", "stem": "依據本國臨床指引與 2026 核心教材，關於第 1 型與第 2 型糖尿病視網膜病變的「初次眼底篩檢時機」，下列敘述何者完全正確？", "options": ["A. 第 1 型糖尿病於確診後 1 年內應篩檢；第 2 型糖尿病可於確診滿 5 年後再開始常規檢查", "B. 第 1 型糖尿病於確診滿 10 年後才需篩檢；第 2 型糖尿病只要最佳視力達 1.0 即終身免檢", "C. 第 1 型與第 2 型糖尿病皆應在確診當下立即散瞳檢查，且不論有無病變均每半年常規追蹤", "D. 第 1 型糖尿病診斷確立後 5 年內應接受初篩；第 2 型糖尿病確立診斷時應立即進行眼底檢查"], "answer": "D", "explanation": "第 1 型糖尿病發病時間明確，前 5 年極少出現視網膜病變，故建議於確診後 5 年內完成初次散瞳眼底檢查；第 2 型糖尿病發病隱匿，常潛伏高血糖多年 false, "baked_comment": ""}, {"id": "CDE-EXAM-0652", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 255 題] 張先生，20 歲，剛發現第1 型糖尿病，以下對他的糖尿病醫療照護建議，何者不適當？", "options": ["A. 每天至少測3 次血糖", "B. 每年散瞳檢查眼睛一次", "C. 每年注射流感疫苗", "D. 每年至少測3 次糖化血色素"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第十一章 視網膜病變篩檢指引 (共照網考古 第255題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 每天至少測 3 次血糖：第 1 型糖尿病患者需採強化胰島素治療，每日監測 3-4 次以上血糖（或佩戴連續血糖監測 CGM）是維持安全的基本要求。\n🔹 (B) 正確（何者不適當）。第 1 型糖尿病的視網膜病變篩檢指引規範明確：因為第 1 型發病起程急性且明確，視網膜微血管病變極少在發病 3-5 年內出現；因此國際與台灣臨床指引建議「第 1 型糖尿病患者在確診滿 3 到 5 年後，才需開始每年接受常規散瞳視網膜檢查」！張先生才「剛發現」T1D，常規立刻要求「每年散瞳檢查眼睛一次」是不適當的（注意：第 2 型糖尿病因發病時間隱匿不明，才必須在確診當下立刻常規每年散瞳！）。\n🔹 (C) 每年注射流感疫苗：糖尿病為免疫脆弱高危險群，常規建議每年施打流感疫苗。\n🔹 (D) 每年至少測 3 次糖化血色素：控制達標者每 6 個月測 1 次，強化治療或未達標者每 3 個月測 1 次（每年 3-4 次），完全適當。\n\n📊 第 1 型 vs 第 2 型糖尿病視網膜病變初次篩檢時機對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>糖尿病型態</th><th>首次散瞳眼底檢查時機</th><th>指引制定核心病理依據</th><th>常規追蹤頻率</th></tr></thead>\n<tbody>\n<tr><td><b>第 1 型糖尿病 (T1D)</b></td><td><b>發病滿 3 至 5 年後 (或滿 10-12 歲)</b></td><td><b>發病時間明確，發病 3-5 年內極罕見血管損害</b></td><td>每年散瞳一次 (若無病變可評估每 1-2 年)</td></tr>\n<tr><td><b>第 2 型糖尿病 (T2D)</b></td><td><b>確診糖尿病之當下 (立刻篩檢)</b></td><td>發病隱匿，確診時常已潛伏高血糖 5-7 年之久</td><td>每年常規散瞳一次</td></tr>\n</tbody></table></div>", "memory_core": "【第十一章 必考考點】：眼底檢查初篩時機：T1D「發病滿 3-5 年後才開始」；T2D「確診當下立刻篩檢」！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0714", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 341 題] 有關糖尿病微小血管併發症, 下列何者錯誤", "options": ["A. 微小血管病變包括視網膜病變,神經病變和週邊血管病變", "B. 微小血管病的發生和罹患糖尿病的時間長短有關", "C. 微小血管病的發生和糖尿病的血糖控制好壞有關", "D. 微小血管病的發生與否和血壓控制有關"], "answer": "A", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核糖尿病微小血管併發症之病理定義與危險因子。<strong>正確答案為 (A) 微小血管病變包括視網膜病變,神經病變和週邊血管病變</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 A 敘述錯誤（本題正解）</span><strong>微小血管病變包括週邊血管病變 ❌：</strong>病理定義分類錯誤！糖尿病微小血管病變（Microvascular disease）指毛細血管與微動靜脈網損傷，僅包括<strong>視網膜病變（DR）、腎臟病變（DKD）及神經病變（DPN）</strong>；而「週邊血管病變（Peripheral Artery Disease, PAD）」指大中型動脈粥狀硬化狹窄，屬於<strong>「大血管併發症（Macrovascular disease）」</strong>，不可歸入微小血管病變！</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 敘述正確</span><strong>微小血管病的發生和罹患糖尿病的時間長短有關：</strong>罹病期間（Duration）是決定微小血管併發症最關鍵之獨立危險因子，病程越長暴露高血糖時間越久，併發率越高。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 敘述正確</span><strong>微小血管病的發生和糖尿病的血糖控制好壞有關：</strong>DCCT 與 UKPDS 明確證實，HbA1c 控制越佳，視網膜、腎臟與神經微血管病變風險呈直線大幅下降。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 敘述正確</span><strong>微小血管病的發生與否和血壓控制有關：</strong>嚴格血壓控制能降低腎絲球內高壓與視網膜微血管剪應力，大幅減少微血管病變之發生與惡化。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：糖尿病微小血管 vs 大血管併發症對照表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>併發症類別</th><th>病理受損血管</th><th>典型臨床疾病</th><th>核心可干預危險因子</th></tr></thead><tbody><tr><td><strong>微小血管併發症</strong></td><td>毛細血管網、微小動靜脈</td><td><strong>視網膜病變、腎臟病變、神經病變</strong></td><td><strong>血糖 (HbA1c)、血壓 (BP)</strong></td></tr><tr><td><strong>大血管併發症</strong></td><td>彈性與肌肉型大中型動脈</td><td><strong>冠狀動脈疾病、腦中風、周邊血管病變 (PAD)</strong></td><td><strong>血脂 (LDL)、血壓、抽菸</strong></td></tr></tbody></table></div>", "memory_core": "【小血管三大核心】：視網膜、腎臟、神經病變！周邊血管 (PAD) 是「大血管」。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0744", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 378 題] 依據WHO 對於視力障礙的分類，下列敘述何者不正確?", "options": ["A. 輕度是小於20/25。", "B. 中度是大於20/70。", "C. 重度是小於20/160。", "D. 極重度是小於20/400。"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第十一章 WHO 視力障礙分級標準 (共照網考古 第378題)\n💡 臨床深度題解與選項剖析：\n🔹 依據世界衛生組織（WHO ICD-11）以最佳矯正視力（BCVA in better eye）對視力障礙（Visual Impairment）的法定分級標準：\n- **輕度視力障礙 (Mild)**：優眼最佳矯正視力 **＜ 20/25 (0.8) 但 ≧ 20/70 (0.3)**（選項 A 正確）。\n- **中度視力障礙 (Moderate)**：優眼最佳矯正視力為「**＜ 20/70 (0.3) 但 ≧ 20/200 (0.1)**」！選項 (B) 寫成「大於 20/70」符號完全顛倒，大於 20/70 屬於輕度甚至正常視力，故敘述完全錯誤。\n- **重度視力障礙 (Severe)**：優眼視力 **＜ 20/200 (0.1) 但 ≧ 20/400 (0.05)**（或依本考題定義小於 20/160-20/200 區間）（選項 C 正確）。\n- **極重度視力障礙 / 失明 (Blindness)**：優眼視力 **＜ 20/400 (0.05) 或視野 ＜ 10 度**（選項 D 正確）。\n🔹 (B) 正確。中度視力障礙是小於 20/70，非大於。\n\n📊 WHO 最佳矯正視力障礙四級分類判定表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>視力障礙分級</th><th>斯奈倫視力表標準 (Snellen)</th><th>小數點視力標準 (Decimal)</th></tr></thead>\n<tbody>\n<tr><td>輕度視障 (Mild)</td><td>＜ 20/25 且 ≧ 20/70</td><td>＜ 0.8 且 ≧ 0.3</td></tr>\n<tr><td><b>中度視障 (Moderate)</b></td><td><b>＜ 20/70 且 ≧ 20/200 (本題錯誤點寫大於)</b></td><td><b>＜ 0.3 且 ≧ 0.1</b></td></tr>\n<tr><td>重度視障 (Severe)</td><td>＜ 20/200 且 ≧ 20/400</td><td>＜ 0.1 且 ≧ 0.05</td></tr>\n<tr><td>失明 / 極重度 (Blindness)</td><td>＜ 20/400 或 視野 ＜ 10 度</td><td>＜ 0.05 或 光感應消失</td></tr>\n</tbody></table></div>", "memory_core": "【第十一章 必考考點】：WHO 視力障礙：中度視障是【小於 20/70（＜ 0.3）】！絕非大於 20/70。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0749", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 384 題] 下列那一敘述為錯誤者?", "options": ["A. 第1 型糖尿病所引起的視網膜病變，是最常出現的眼部併發症。", "B. 第2 型糖尿病視網膜病變常於診斷出糖尿病五年之後才被發現。", "C. 第2 型糖尿病患者常較晚被診斷出來罹患糖尿病。", "D. 第2 型糖尿病患者於確定罹患糖尿病診斷時約21%的病人已有視網膜病變。"], "answer": "B", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核第 1 型與第 2 型糖尿病在視網膜病變發生時間與盛行率之臨床鑑別。<strong>正確答案為 (B) 第2 型糖尿病視網膜病變常於診斷出糖尿病五年之後才被發現</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 敘述正確</span><strong>第1 型糖尿病所引起的視網膜病變，是最常出現的眼部併發症：</strong>第 1 型病患發病 15~20 年後幾乎 90% 以上都會出現不同程度之視網膜微血管病變，為最常見眼部問題。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 B 敘述錯誤（本題正解）</span><strong>第2 型視網膜病變常於診斷五年後才被發現 ❌：</strong>觀念完全錯誤！第 1 型糖尿病因發病前數年無病變，指引規定「發病 5 年後」才需篩檢；然而<strong>第 2 型糖尿病發病前常隱匿潛伏 4~7 年，因此指引明確規範「確立診斷當下『立即』進行散瞳眼底檢查」</strong>，臨床上往往在「剛診斷時」就已經發現視網膜病變，絕非 5 年後才被發現！</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 敘述正確</span><strong>第2 型糖尿病患者常較晚被診斷出來罹患糖尿病：</strong>第 2 型早期無典型三多一少症狀，代謝紊亂隱匿多年，診斷時常已有微血管暴露受損。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 D 敘述正確</span><strong>第2 型糖尿病新診斷時約 21% 已有視網膜病變：</strong>UKPDS 等大型流行病學調查證實，新診斷之第 2 型患者約有 21%（約 1/5）在眼底照相時已呈現 NPDR 病變。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：T1D vs T2D 視網膜病變首次篩檢時機對照表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>糖尿病類型</th><th>疾病臨床特徵</th><th>首次眼底檢查時機</th><th>新確診時已有病變比例</th></tr></thead><tbody><tr><td><strong>第 1 型糖尿病 (T1D)</strong></td><td>急性發病、年輕、無潛伏期</td><td><strong>發病 5 年後</strong><br>(或年滿 10~11 歲進入青春期)</td><td>剛確診時幾乎 0%</td></tr><tr><td><strong>第 2 型糖尿病 (T2D)</strong></td><td>隱匿無症狀潛伏 4~7 年才確診</td><td><strong>確立診斷當下「立即」檢查</strong></td><td><strong>約 21% (約 1/5 病患已有病變)</strong></td></tr></tbody></table></div>", "memory_core": "【T2D 診斷即有病變】：T2D 發病隱匿，剛確診時 21% 早已有眼底病變，診斷當天馬上查眼底！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0770", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 416 題] 以下關於視網膜病變及其照護準則的敘述，何者正確？", "options": ["A. 是成人失明的次要原因", "B. 兒童於5 歲以上或糖尿病3-5 年期間進行第一次眼科檢查", "C. 糖尿病婦女懷孕前三個月應檢查眼睛", "D. 視網膜病變盛行率與罹病時間無關"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十一章 視網膜病變孕前諮詢與篩檢指引 (共照網考古 第416題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 糖尿病視網膜病變是 20-74 歲工作適齡成人失明的「首要頭號原因（Leading cause）」，非次要原因。\n🔹 (B) 兒童第 1 型糖尿病患者通常於「罹病滿 3-5 年後或滿 10-12 歲」進行第一次散瞳篩檢，非 5 歲。\n🔹 (C) 正確。懷孕期間體內血管生成生長因子（VEGF）大幅增加且胎盤血流灌注增加，原有視網膜病變在孕期具有高達 15-50% 的急速惡化風險；因此國際與台灣指引一致嚴格規範：「**原有糖尿病（第 1 型或第 2 型）婦女計畫懷孕前，應於孕前三個月內（或第一孕期初）接受詳細的散瞳視網膜眼底檢查**」，評估基準期病變嚴重度，若有活動性增殖性視網膜病變，應先完成全視網膜雷射光凝固術（PRP）穩定後方可受孕。\n🔹 (D) 視網膜病變盛行率與「糖尿病罹病時間（Duration of diabetes）」呈舉世公認之最強大正相關（罹病 20 年盛行率可高達 80-90%）。\n\n📊 糖尿病視網膜病變流行病學與孕期照護準則表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床評估向度</th><th>國際實證臨床指引準則</th><th>臨床照護關鍵結論</th></tr></thead>\n<tbody>\n<tr><td><b>成人失明流行地位</b></td><td><b>工作年齡成人 (20-74 歲) 後天失明首要頭號元兇！</b></td><td>早期雷射介入能防止 90% 嚴重視力喪失</td></tr>\n<tr><td><b>孕前眼科篩檢</b></td><td><b>受孕前三個月內必須進行詳細散瞳眼底視網膜檢查</b></td><td><b>評估血管基線，避免懷孕期誘發不可逆視網膜出血</b></td></tr>\n<tr><td>罹病時間相關性</td><td>罹病越久，病變發生率越高 (最強決定因子)</td><td>定期每年追蹤是早期攔截不二法門</td></tr>\n</tbody></table></div>", "memory_core": "【第十一章 必考考點】：糖尿病婦女【懷孕前三個月內應散瞳檢查眼睛】！視網膜病變是成人失明首要元兇。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0966", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 649 題] 下列有關糖尿病眼部疾病的敘述，何者錯誤？", "options": ["A. 糖尿病患懷孕時，可能會惡化視網膜病變", "B. 糖尿病人發生白內障的危險比較高", "C. 糖尿病人發生青光眼的危險比較高", "D. 有嚴重增殖性視網膜病變者，不能服用阿斯匹靈（aspirin），以免增加視網膜出血的風險"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十一章 視網膜病變與阿斯匹靈 (Aspirin) 使用指引 (共照網考古 第649題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 糖尿病患懷孕時，體內 VEGF 與血管血流增加，可能惡化原有視網膜病變。\n🔹 (B)(C) 糖尿病患水晶體滲透壓震盪易形成早發性白內障；微血管缺血增生房角新生血管易引發難治性新生血管性青光眼。\n🔹 (D) 正確（何者錯誤）。在眼科學具有歷史里程碑地位的**早期治療糖尿病視網膜病變研究（ETDRS, Early Treatment Diabetic Retinopathy Study）** 進行了極大規模的長期隨機對照試驗，結論確立證實：**每日服用阿斯匹靈（Aspirin 650 mg/day 或心血管預防低劑量 75-100 mg）「完全不會增加糖尿病視網膜出血（Retinal hemorrhage）或玻璃體出血的風險，也不會加速視網膜病變惡化」**！因此國際臨床指引明確規範：糖尿病患者凡是具備心血管 ASCVD 預防適應症者，「**絕不可以因為合併有糖尿病視網膜病變（包括增殖性視網膜病變）而擅自停用阿斯匹靈**」！故 (D) 宣稱不能服用是完全錯誤的陳舊迷思。\n\n📊 ETDRS 臨床試驗關於 Aspirin 對視網膜病變影響結論：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床評估疑慮</th><th>ETDRS 里程碑臨床試驗實證結論</th><th>臨床照護權威指引規範</th></tr></thead>\n<tbody>\n<tr><td><b>是否會增加視網膜出血？</b></td><td><b>否！完全不增加視網膜或玻璃體出血風險！</b></td><td><b>心血管高危險群應繼續常規服用 Aspirin！</b></td></tr>\n<tr><td><b>是否會加速視網膜病變惡化？</b></td><td><b>否！對視網膜病變進展既無害處也無延緩作用</b></td><td><b>不因有嚴重增殖性視網膜病變而停藥！(本題考點)</b></td></tr>\n<tr><td>心血管保護效益</td><td>顯著降低心肌梗塞與缺血性腦中風死亡</td><td>不可因眼科病變而剝奪心血管救命保護傘</td></tr>\n</tbody></table></div>", "memory_core": "【第十一章 必考考點】：權威 ETDRS 實證：Aspirin【不會增加視網膜出血風險】！有增殖性視網膜病變仍可安全服用。\n（臨床醫學註釋：ETDRS 為「早期治療糖尿病視網膜病變研究 Early Treatment Diabetic Retinopathy Study」，其分級是視網膜病變國際黃金標準）", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0990", "chapter": "第十一章 糖尿病眼部疾病", "stem": "[共照網考古題 第 686 題] 糖尿病人眼底發生具有臨床意義的黃斑部水腫時，下列治療何者較適當?", "options": ["A. 先積極控制血糖、血壓，暫時不必做眼科治療", "B. 視網膜局部雷射光凝固治療", "C. 全視網膜雷射光凝固治療", "D. 視網膜冷凍手術治療"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第十一章 糖尿病眼部疾病 (共照網考古 第686題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 臨床上一旦出現「具有臨床意義的黃斑部水腫 (CSME)」，已嚴重威脅中心視力，必須立即由眼科專科醫師介入積極局部治療，絕不可單靠控制血糖血壓而「暫不治療延誤黃金期」。\n🔹 (B) 正確。依據早期糖尿病視網膜病變治療研究 (ETDRS) 之標準規範：具有臨床意義的黃斑部水腫 (CSME) 的標準眼科第一線治療是「局部/格子狀視網膜雷射光凝固術 (Focal/grid photocoagulation)」封閉微動脈瘤滲漏（現代醫學常併用眼內抗 VEGF 藥物注射），能降低 50% 的視力進一步喪失風險。\n🔹 (C) 全視網膜光凝固治療 (PRP) 是專門用於治療「增殖型視網膜病變 (PDR)」新生血管的手段，並非局部黃斑部水腫首選。\n🔹 (D) 冷凍手術主要用於視網膜剝離或周邊視網膜裂孔，不適合用於中心黃斑部水腫。\n\n📊 糖尿病黃斑部水腫 (CSME) vs 增殖型視網膜病變 (PDR) 處置鑑別表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>眼底病變型態</th><th>病理核心特徵</th><th>標準眼科第一線治療方針</th></tr></thead>\n<tbody>\n<tr><td><b>具有臨床意義黃斑部水腫 (CSME)</b></td><td>黃斑中心 500μm 內視網膜增厚滲出，<b>中心視力模糊</b></td><td><b>局部/格子狀雷射 (Focal Laser) 或眼內抗 VEGF 注射</b></td></tr>\n<tr><td><b>增殖型視網膜病變 (PDR)</b></td><td>視神經盤 (NVD) 或周邊 (NVE) 出現脆弱新生血管</td><td><b>全視網膜雷射光凝固術 (PRP) 破壞周邊缺氧組織</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十一章 必考考點】：黃斑部水腫 (CSME) 治療首選「局部雷射光凝固術 (Focal Laser)」或抗 VEGF；全視網膜 PRP 適用於增殖型 PDR！\n（臨床醫學註釋：ETDRS 為「早期治療糖尿病視網膜病變研究 Early Treatment Diabetic Retinopathy Study」，其分級是視網膜病變國際黃金標準）", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0248", "chapter": "第十七章 如何有效的執行糖尿病衛教", "stem": "在糖尿病溝通技巧中，運用「反覆回覆法（Teach-Back Technique）」的主要核心精神與目的為何？", "options": ["A. 在衛教結束前實施封閉式評量測驗，要求個案簽署完全聽懂醫囑之法律切結保證文件", "B. 請個案以自己的話語或示範說明照護重點，藉以檢視衛教師是否溝通清晰並即時澄清", "C. 藉由反覆朗讀標準衛教單張文字內容，嚴格考核個案對複雜藥理作用機轉之短期記憶", "D. 由衛教師在會談尾聲再次單向覆誦所有護理重點，以確保依法規完整傳遞各項醫療資訊"], "answer": "B", "explanation": "Teach-Back（反覆回覆法）的核心理念在於「將溝通成敗的責任歸於衛教師，而非對病人進行考試評分」。藉由邀請個案「用自己的話說說看」或實體示範，檢視衛教師的解說是否清晰易懂，並在第一時間溫和澄清個案的理解偏差，達成醫病雙向共識。", "memory_core": "【Teach-Back 回覆法核心】：請病人用自己的話說說看！檢驗衛教師有沒有講清楚，絕非給病人考試評分。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0249", "chapter": "第十七章 如何有效的執行糖尿病衛教", "stem": "陳阿嬤年過七旬，不識字且讀寫能力有限（低健康識能 Low Health Literacy）。對於陳阿嬤的衛教介入方式，下列何者「最不適當」？", "options": ["A. 運用色彩鮮明之食物模型與圖示圖卡解說份量，並以口語生活化比喻取代專業術語", "B. 提供內容詳盡且記載多種降血糖藥理機轉之純文字手冊，要求其每日在家自行研讀", "C. 請阿嬤使用分格實體藥盒進行現場回示教演練，確認其能正確辨識早晚用藥之時機", "D. 邀請同住的主要家庭照顧者共同參與衛教會談，建立穩固之家庭支持網絡協助照護"], "answer": "B", "explanation": "低健康識能（Low Health Literacy）個案面對艱澀文字手冊時常感到挫折與焦慮，難以將文字轉化為實際生活照護技能。衛教介入應遵循「簡化、圖象化、示範回示教、引入照顧者」原則；發放純文字藥理手冊要求其自行研讀最不適當。", "memory_core": "【低健康識能衛教心法】：少文字、多圖卡、重示範、化繁為簡；引入家屬支持；切忌發送冗長文字講義。", "status": "U 第十七章 如何有效的執行糖尿病衛教", "stem": "進行「示範教學法（Demonstration）」教導病患皮下胰島素注射技巧時，為確保技能學習之精準無誤，教學流程中最不可或缺之關鍵閉環環節為何？", "options": ["A. 僅單向播放專業示範教學影片，要求個案簽署影片觀看確認單後即結束衛教流程", "B. 發放原廠彩色圖解仿單說明書，請個案於返家後自行對照圖示進行首次注射嘗試", "C. 安排個案親自進行實體回示教操作，由衛教師即時提供正向肯定與個別微調糾偏", "D. 透過口頭問答方式考核注射理論步驟，確認個案能完整背誦口訣即可免除實地操作"], "answer": "C", "explanation": "技術操作教學的黃金標準是「示範－回示教（Demonstration-Return demonstration）」閉環。單純看影片、讀說明書或口頭背誦均無法驗證手部微細動作；唯有親手回示教並由衛教師即時糾偏，才能確保技能精準安全。", "memory_core": "【技能教學閉環法則】：示範 ➔ 「回示教（Return Demo）」親手做 ➔ 即時糾偏肯定，缺一不可！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0279", "chapter": "第十七章 如何有效的執行糖尿病衛教", "stem": "在團體衛教（Group Education）的帶領過程中，衛教師最理想的專業角色定位應當為何？", "options": ["A. 單向主導課堂進度且嚴格掌握發言權的權威演講者（Authoritarian Lecturer）", "B. 僅在旁記錄出勤率且完全不介入任何成員提問的消極旁觀者（Passive Observer）", "C. 針對每位學員飲食紀錄進行嚴厲是非審查的紀律糾察員（Disciplined Inspector）", "D. 營造接納氛圍並促進成員互動與同儕支持的引導協同者（Empathetic Facilitator）"], "answer": "D", "explanation": "團體衛教的核心在於同儕互動與情感支持。衛教師的角色不是高高在上的權威講師或監督者，而是「引導協同者（Facilitator）」，透過營造包容接納的氣氛、拋出開放問題、促進病友經驗交流，激發團體自我賦能。", "memory_core": "【團體衛教靈魂角色】：做溫暖的「引導協同者（Facilitator）」，激發病患同儕互助與經驗共鳴！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0783", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 435 題] 一位50 歲患有糖尿病10 年的病人至您診間求診，經開始胰島素治療後其A1C 從9.5%進步到 7.2%，但現在抱怨其半夜足部麻痛的感覺更甚以往，下列何者是其最正確原因?", "options": ["A. 是胰島素的副作用，宜停止使用", "B. 半夜低血糖所造成", "C. 血糖改善後，神經再生所引起", "D. 病人因血糖仍未達控制標準而造成"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第435題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 這不是胰島素分子的藥物過敏或毒性，擅自停用胰島素會導致血糖再度飆高反彈。\n🔹 (B) 夜間足部刺痛灼熱為神經性疼痛症狀，與半夜低血糖之交感神經刺激症狀不同。\n🔹 (C) 正確。此現象在臨床上稱為「治療引發之糖尿病神經病變 (Treatment-induced Neuropathy of Diabetes, TIND)」或「胰島素神經炎 (Insulin Neuritis)」。當長期嚴重高血糖 (A1C 9.5%) 經由積極治療在短期內驟降改善 (降至 7.2%) 時，微血管血流動力學改變與受損小神經纖維開始快速再生、萌芽 (Nerve sprouting)，會暫時性誘發嚴重的自發性放電，造成神經痛劇烈加劇。\n🔹 (D) 病人的 A1C 7.2% 已大幅改善，麻痛不是因血糖未達標惡化，而是降太快引發的再生痛。\n\n📊 胰島素神經炎 / 治療引發神經病變 (TIND) 臨床特徵：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床評估維度</th><th>特徵表現與醫學機制</th></tr></thead>\n<tbody>\n<tr><td><b>發病誘因</b></td><td>長期高血糖病患，在數週至 3 個月內 <b>HbA1c 迅速大幅下降 (&gt; 2%～3%)</b></td></tr>\n<tr><td><b>主要症狀</b></td><td>雙足末端劇烈燒灼痛、針扎感、接觸性異感痛 (Allodynia)，<b>常在夜間更劇烈</b></td></tr>\n<tr><td><b>病理機轉</b></td><td>急驟降糖引發神經滋養血管動靜脈短路缺血，以及<b>小神經纖維再生萌芽時的異常去極化放電</b></td></tr>\n<tr><td><b>臨床處置對策</b></td><td><b>切勿停用胰島素！</b> 給予神經病變止痛藥 (Pregabalin, Duloxetine) 症狀緩解，通常 6～12 個月隨代謝恆定平穩緩解</td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：A1C 降太快（如 9.5% 驟降到 7.2%）腳反而劇痛麻 =「神經再生痛 / 胰島素神經炎 (TIND)」，切忌停藥！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0849", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 517 題] 有關糖尿病神經病變理論的描述，下列何者正確?", "options": ["A. polyol 於神經細胞的缺乏", "B. 神經細胞內蛋白質糖化作用", "C. 神經細胞中的山梨醇(sorbitol)減少", "D. 神經細胞內自由基(free oxygen radicals)減少"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第517題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(C) 在多元醇途徑中，高血糖促使醛糖還原酶過度活化，神經細胞內的山梨醇 (Sorbitol) 是「過度累積」而非減少或缺乏。\n🔹 (B) 正確。慢性高血糖促使葡萄糖與神經細胞內及髓鞘蛋白質發生非酵素性的不可逆「蛋白質糖化作用（生成 AGEs）」，破壞細胞骨架結構、軸突運輸與神經微血管基底膜，是神經病變最核心的致病機轉。\n🔹 (D) 高血糖自氧化與粒線體超載，會導致神經細胞內氧自由基 (ROS)「顯著暴增」引發氧化壓力，而非減少。\n\n📊 高血糖誘發糖尿病神經病變之生化分子機轉：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>生化病理路徑</th><th>正確體內病理變化</th><th>考題常見錯誤陷阱</th></tr></thead>\n<tbody>\n<tr><td><b>多元醇途徑</b></td><td>山梨醇 (Sorbitol) 與果糖<b>異常累積大量增加</b></td><td>常故意寫成「山梨醇減少」或「多元醇缺乏」</td></tr>\n<tr><td><b>蛋白質糖化</b></td><td><b>神經內質與髓鞘發生不可逆「蛋白質糖化 (AGE)」</b></td><td>正確致病機轉核心</td></tr>\n<tr><td><b>肌醇代謝</b></td><td>神經細胞內肌醇 (Myoinositol) <b>濃度被耗竭下降</b></td><td>常誤寫成肌醇增加</td></tr>\n<tr><td><b>自由基與氧化壓力</b></td><td>氧自由基 (ROS) <b>大量增加，粒線體破壞</b></td><td>常故意寫成「自由基減少」</td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：神經病變生化機轉：山梨醇「累積增加」、自由基「暴增」、肌醇「減少」、蛋白質「糖化 (AGE) 破壞」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0850", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 518 題] 下列何者最有可能是糖尿病神經局部病變的原因?", "options": ["A. polyol 於神經細胞的累積", "B. 神經細胞內蛋白質糖化作用", "C. 神經細胞中的山梨醇(sorbitol)增加", "D. 因微栓塞(microthrombi)造成急性缺血"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第518題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B)/(C) 多元醇途徑累積、細胞內蛋白質糖化與山梨醇堆積，是導致全身性、慢性、對稱性「瀰漫性多發性神經病變 (DSPN)」的代謝性長期成因。\n🔹 (D) 正確。糖尿病「局部神經病變 (Focal neuropathy / Mononeuropathy)」（例如突發性動眼神經麻痺、面神經麻痺或下肢單一神經梗塞）在臨床上表現為急性突發、劇痛且單側受累，其最主要病理原因為滋養神經血管 (Vasa nervorum) 因「微小血栓微栓塞 (Microthrombi) 引發急性局部組織缺血梗塞」。\n\n📊 瀰漫性神經病變 (DSPN) vs 局部神經病變 (Focal) 致病機制比較：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>神經病變型態</th><th>起病速度與分佈</th><th>最主要核心病因機轉</th></tr></thead>\n<tbody>\n<tr><td><b>瀰漫性神經病變 (DSPN)</b></td><td>慢性緩慢進行、遠端雙側對稱</td><td><b>代謝毒性障礙（山梨醇累積、AGE 糖化、自由基）</b></td></tr>\n<tr><td><b>局部單一病變 (Focal)</b></td><td><b>突發急性起病、單側單一分佈</b></td><td><b>血管微栓塞 (Microthrombi) 造成滋養血管急性局部缺血梗塞</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：局部單一神經病變（突然一條神經麻痺）主因是「微栓塞造成急性缺血 (Microthrombi ischemia)」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0869", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 530 題] 糖尿病人瀰漫性神經病變的敘述，下列何者為非？", "options": ["A. 發生於遠端", "B. 以感覺神經症狀為主", "C. 對稱性發生", "D. 較其他類型神經病變少見"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第530題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 瀰漫性對稱性多發神經病變 (DSPN) 為長度依賴性 (Length-dependent)，神經纖維越長越早受害，故最先發生於遠端足趾。\n🔹 (B) 早期以感覺神經異常（麻木、刺痛、灼熱或感覺減退）為最主要表現。\n🔹 (C) 呈現雙側肢體高度「對稱性」的手套-襪套樣分佈。\n🔹 (D) 正確（何者為非）。遠端對稱性多發性神經病變是糖尿病「最常見、盛行率最高」的神經病變型態，佔所有糖尿病神經病變患者的 75% 以上，絕非較其他類型少見！\n\n📊 糖尿病神經病變兩大主要類型盛行率對比：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>神經病變型態</th><th>盛行率與臨床地位</th><th>主要分佈與特性</th></tr></thead>\n<tbody>\n<tr><td><b>瀰漫對稱多發神經病變 (DSPN)</b></td><td><b>最常見（佔所有神經病變 75% 以上）</b></td><td><b>雙側對稱、遠端手套襪套、長度依賴慢性進行</b></td></tr>\n<tr><td><b>局部單一神經病變 (Focal)</b></td><td>相對罕見（佔少數）</td><td>單側突發、急性血管栓塞缺血、具自限性</td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：遠端對稱多發性神經病變 (DSPN) 是糖尿病「最常見」的神經病變！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0908", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 569 題] 下列有關糖尿病人胃腸道自主神經病變症狀，何者錯誤？", "options": ["A. 胃輕癱", "B. 便秘、腹瀉", "C. 腹脹", "D. 胃排空延緩使血糖不易上升，血糖控制較容易"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第569題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B)/(C) 胃輕癱、早飽、腹脹、胃食道逆流、頑固性便秘以及交替性夜間腹瀉，皆為糖尿病胃腸道自主神經病變的典型臨床症狀。\n🔹 (D) 正確（何者錯誤）。胃排空延緩與不規則排空，會使進食後的營養吸收時間變得完全無法預測，導致外源性胰島素作用高峰與食物血糖吸收高峰嚴重脫鉤，造成極度難纏的「忽高忽低脆性血糖震盪（餐後早期低血糖、晚期頑固高血糖）」，使得「血糖控制變得極度困難與挫折」，絕非「控制較容易」！\n\n📊 胃輕癱對血糖管理之破壞性衝擊：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床難題</th><th>生理病理機轉</th><th>臨床對策指引</th></tr></thead>\n<tbody>\n<tr><td><b>吸收與藥效脫鉤</b></td><td>胃排空無法預期，藥物達峰時胃內無食物</td><td>餐前速效胰島素改為「餐後施打」或分段雙波追加</td></tr>\n<tr><td><b>脆性血糖劇烈波動</b></td><td>前一餐食物卡在胃中，下一餐突然一併排空</td><td>少量多餐、攪打流質、低脂低纖軟食</td></tr>\n<tr><td><b>惡性循環</b></td><td>嚴重高血糖反過來進一步完全麻痺胃蠕動</td><td>積極平穩控制血糖，使用促胃腸動力藥 (Metoclopramide)</td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：胃輕癱排空延遲會讓胰島素與血糖吸收脫節，造成「血糖忽高忽低極難控制」，絕非容易！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0914", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 578 題] 有關糖尿病自主神經病變的臨床症狀,何者錯誤", "options": ["A. 睡眠呼吸中斷", "B. 姿態性低血壓", "C. 胃輕癱(gastroparesis)", "D. 低血糖不自覺"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第578題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者錯誤）。阻塞性睡眠呼吸中止症 (Obstructive Sleep Apnea, OSA) 是由於咽喉部軟組織塌陷造成的呼吸道機械性阻塞，主因與肥胖、頸圍過粗及顱顏解剖結構有關，屬於睡眠呼吸障礙疾病，不屬於糖尿病自主神經病變的臨床表現。\n🔹 (B) 姿勢性低血壓 (CAN) 是交感神經血管收縮反射衰竭所致，為自主神經病變經典症狀。\n🔹 (C) 胃輕癱 (Gastroparesis) 為迷走神經受損導致胃蠕動衰竭。\n🔹 (D) 低血糖不自覺 (Hypoglycemia unawareness) 為自主神經交感警報中樞傳導麻痺。\n\n📊 糖尿病自主神經病變臨床範疇診斷表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>系統分類</th><th>確定屬於自主神經病變</th><th>非自主神經病變（易混淆陷阱）</th></tr></thead>\n<tbody>\n<tr><td><b>心血管</b></td><td>姿勢性低血壓、固定靜止心搏過速</td><td>冠心病心絞痛（大血管病變）</td></tr>\n<tr><td><b>消化道</b></td><td>胃輕癱、糖尿病腹瀉、巨結腸便秘</td><td>消化性潰瘍、幽門螺旋桿菌感染</td></tr>\n<tr><td><b>內分泌神經</b></td><td><b>低血糖無自覺 (Unawareness)</b></td><td>—</td></tr>\n<tr><td><b>呼吸系統</b></td><td>—</td><td><b>阻塞性睡眠呼吸中止 (OSA，為肥胖與氣道塌陷所致)</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：睡眠呼吸中止 (OSA) 是肥胖氣道塌陷，不是自主神經病變；姿勢性低血壓、胃輕癱、低血糖不自覺才是！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0927", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 591 題] 下列何者是第2 型糖尿病患者發生神經病變之危險因子？", "options": ["A. 高血鉀", "B. 低血糖", "C. 高尿酸", "D. 抽煙"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第591題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B)/(C) 高血鉀、高尿酸或單次急性低血糖並非引發糖尿病神經病變的長期獨立危險因子。\n🔹 (D) 正確。抽煙 (Smoking) 燃燒釋放尼古丁與一氧化碳，會強力誘發血管內皮機能障礙、促進微血管強烈痙攣收縮並加速滋養神經微血管 (Vasa nervorum) 動脈硬化狹窄，引發神經長期缺血缺氧，是第 2 型糖尿病併發周邊神經病變與足部潰瘍極為關鍵且明確的「可逆危險因子」。\n\n📊 糖尿病神經病變主要危險因子一覽表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>危險因子分類</th><th>具體危險因子項目</th><th>致神經病變病理機轉</th></tr></thead>\n<tbody>\n<tr><td><b>可改變危險因子</b></td><td><b>長期高血糖 (高 HbA1c)、抽煙 (Smoking)、高血壓、血脂異常、肥胖</b></td><td><b>血管微內皮破壞、血管痙攣缺血、氧化壓力與微栓塞</b></td></tr>\n<tr><td><b>不可改變危險因子</b></td><td>糖尿病罹病年資 (Duration)、年齡高齡、男性、身高較高 (神經長)</td><td>長度依賴性軸突慢性代謝累積損傷</td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：抽煙 (Smoking) 破壞神經滋養血管微循環，是神經病變與足潰瘍截肢最重要的可改變危險因子！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0989", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 685 題] 有關周邊神經病變的臨床症狀，下列敘述何者正確？", "options": ["A. 出汗功能異常", "B. 足部感覺遲鈍", "C. 不自覺低血糖", "D. 胃輕癱"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第685題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(C)/(D) 出汗異常（無汗或味覺性出汗）、不自覺低血糖、以及胃輕癱，皆屬於「自主神經病變 (Autonomic neuropathy)」的臨床表現。\n🔹 (B) 正確。周邊感覺神經病變 (Peripheral sensory neuropathy / DSPN) 最典型、最經典且最普遍的臨床特徵為遠端長神經軸突受損引起的「雙側足部感覺遲鈍、麻木感 (Numbness) 與手套-襪套樣分佈」。\n\n📊 糖尿病神經病變臨床分類與核心症狀對應表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>神經病變類型</th><th>受損神經系統定位</th><th>主要特徵性臨床症狀</th></tr></thead>\n<tbody>\n<tr><td><b>周邊感覺神經病變 (DSPN)</b></td><td>體神經感覺纖維 (大/小纖維)</td><td><b>足部感覺遲鈍、麻木、踏棉花感、痛溫覺喪失、灼痛</b></td></tr>\n<tr><td><b>自主神經病變 (ANS)</b></td><td>交感與副交感自主神經系統</td><td><b>胃輕癱、無汗/出汗異常、低血糖不自覺、姿勢性低血壓</b></td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：足部麻木、感覺遲鈍 =「周邊感覺神經病變」；出汗異常、胃輕癱、低血糖不自覺 =「自主神經病變」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1019", "chapter": "第十三章 糖尿病神經病變", "stem": "[共照網考古題 第 721 題] 下列何者為感覺型神經病變之小纖維神經病變特徵？", "options": ["A. 自發性疼痛", "B. 疼痛常發生在早晨", "C. 本體感覺消失", "D. 輕觸感喪失"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第十三章 糖尿病神經病變 (共照網考古 第721題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確。小纖維神經 (Small fiber, A-δ 及 C 纖維) 主要傳導痛覺與溫度覺。其受損時的特徵性早期表現為刺激性陽性症狀，即「自發性疼痛（燒灼痛、刺痛、電擊感、刀割痛）」與「異感痛 (Allodynia，輕觸被單即劇痛)」。\n🔹 (B) 糖尿病神經性疼痛通常在「夜間休息入睡時最為劇烈（夜間加重）」，而非早晨。\n🔹 (C)/(D) 本體感覺 (Proprioception)、震動覺與輕觸感 (Light touch) 是由粗大有髓鞘之「大纖維神經 (Large fiber)」負責傳導。\n\n📊 大纖維神經病變 vs 小纖維神經病變特徵完全對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>比較項目</th><th>小纖維神經病變 (Small Fiber)</th><th>大纖維神經病變 (Large Fiber)</th></tr></thead>\n<tbody>\n<tr><td><b>神經纖維類別</b></td><td>細微無髓鞘 C 纖維、薄髓鞘 A-δ 纖維</td><td>粗大有髓鞘 A-α、A-β 纖維</td></tr>\n<tr><td><b>主訴臨床特徵</b></td><td><b>自發性燒灼痛、刺痛、冷熱覺喪失、夜間劇痛</b></td><td><b>麻木、腳踩棉花感、步態不穩、共濟失調</b></td></tr>\n<tr><td><b>神經學理學檢查</b></td><td><b>針刺痛覺異常、冷熱溫覺辨識減退</b></td><td><b>128Hz 震動覺喪失、10g 單絲觸覺喪失、跟腱反射消失</b></td></tr>\n<tr><td><b>神經傳導檢查 (NCV)</b></td><td><b>通常完全正常（NCV 只能測大纖維！）</b></td><td>NCV 傳導速度減慢、振幅下降</td></tr>\n</tbody></table></div>", "memory_core": "【第十三章 必考考點】：自發性燒灼痛、接觸痛、夜間痛 =「小纖維」；踩棉花、麻木、震動覺單絲喪失、NCV 異常 =「大纖維」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0267", "chapter": "第十九章 糖尿病病人的自我照護與問題解決", "stem": "當個案在執行飲食或運動計畫遇到挫折而發生「行為復發（Relapse）」時，衛教師最具建設性的引導思維為：", "options": ["A. 嚴肅告誡個案中斷計畫將前功盡棄，要求其簽署嚴格自律切結書以避免再次發生偏差", "B. 認定該個案目前完全不具備改變意志，決定暫停所有衛教介入直至個案主動求助為止", "C. 歸咎於既定運動目標設定過於寬鬆，立即將每日運動強度與時數加倍以彌補前期進度", "D. 將復發視為螺旋改變歷程之學習反饋，引導個案分析誘發阻礙情境並從中重擬策略"], "answer": "D", "explanation": "行為改變呈「螺旋式上升（Spiral model）」而非直線式發展，復發（Relapse）是慢性病自我管理歷程中的常態現象。專業衛教師不應將其定罪或指責，而應與個案共同回顧「觸發中斷的情境因子」，從中汲取經驗並修訂更具彈性的應對計畫。", "memory_core": " 血糖昏迷失去吞嚥能力時的唯一自救武器</b></td></tr>\n<tr><td><b>糖尿病識別卡</b></td><td>中英文對照診斷卡、醫師處方證明書</td><td>過海關攜帶針劑申報與突發昏迷辨識</td></tr>\n</tbody></table></div>", "memory_core": "【第十九章 必考考點】：T1D 旅遊四大護身符：血糖機、酮體試紙、升糖素、識別卡，全部隨身帶，不可放託運行李！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0509", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 85 題] 黃女士患有糖尿病30 年，目前接受胰島素治療與每週3 次之血液透析，下列何項護理措施不適合 黃女士？", "options": ["A. 教導正確測量血壓並記錄", "B. 教導正確測量血糖並記錄", "C. 適當蛋白質補充1.2 公克/公斤體重", "D. 補充富含鉀及磷的食物"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核長期糖尿病合併末期腎病血液透析（洗腎）患者之護理照護與飲食禁忌。<strong>正確答案為 (D) 補充富含鉀及磷的食物</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 護理措施適合</span><strong>教導正確測量血壓並記錄：</strong>血液透析病患因體液滯留易出現嚴重高血壓，而透析中脫水又易低血壓休克，指導每日早晚固定測量血壓並記錄乾體重（Dry weight）是核心照護措施。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 護理措施適合</span><strong>教導正確測量血糖並記錄：</strong>末期腎病患者腎臟清除胰島素能力下降，易誘發致死性低血糖，規律監測血糖對動態調整胰島素不可或缺。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 護理措施適合</span><strong>適當蛋白質補充1.2 公克/公斤體重：</strong>血液透析過程中每次會流失 10~13 公克游離胺基酸，為預防蛋白質能量耗損（PEW），指引規範血液透析患者應提高蛋白質攝取至 <strong>1.2 ～ 1.4 g/kg/day</strong>（以高生物價蛋白質為主），此與未洗腎期之低蛋白飲食截然不同。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 護理措施不適合（本題正解）</span><strong>補充富含鉀及磷的食物 ❌：</strong>洗腎病患無殘餘腎功能排泄電解質，極易發生「致死性高血鉀（血鉀 > 6.0 mEq/L 引發心律不整心跳停止）」及「高血磷（引發血管鈣化與副甲狀腺亢進）」，飲食上必須<strong>「嚴格限制鉀與磷的攝取」</strong>（蔬菜需川燙去鉀、禁食含無機磷加工食品），絕對不可補充富含鉀及磷的食物！</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：慢性腎病未洗腎 (CKD) vs 血液透析 (H 00; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 正確</span><strong>正常腎絲球過濾率 (GFR)：</strong>年輕健康成人的正常 GFR 約為 <strong>100 ～ 125 mL/min/1.73m²</strong>（女性約 100~110，男性約 115~125）。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 正確</span><strong>正常白蛋白排泄率 (AER)：</strong>健康人經腎小管重吸收後，尿中白蛋白排泄率正常小於 <strong>20 μg/min</strong>（相當於 24 小時尿中白蛋白 < 30 mg/24h）。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 正確</span><strong>腎臟血流灌流量：</strong>人體安靜狀態下，兩側腎臟血流量約為 1,200 mL/min，高達全身心輸出量（Cardiac Output）的 <strong>20% ～ 25%</strong>。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 正確（本題正解）</span><strong>以上皆是：</strong>選項 A、B、C 敘述均完全符合醫學生理學之正常腎臟標準數據。</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：正常成人腎功能基準生化數據表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>生理檢驗指標</th><th>健康成人正常參考值</th><th>糖尿病腎病變異常切點</th></tr></thead><tbody><tr><td><strong>腎絲球過濾率 (eGFR)</strong></td><td>90 ～ 120 mL/min/1.73m²</td><td>• 第 1 期：> 130~150 (高過濾)<br>• CKD 3期：&lt; 60<br>• ESKD 5期：&lt; 15</td></tr><tr><td><strong>尿白蛋白排泄率 (AER)</strong></td><td>&lt; 20 μg/min</td><td>• 微量：20 ～ 200 μg/min<br>• 巨量：&gt; 200 μg/min</td></tr><tr><td><strong>單次尿液 UACR</strong></td><td>&lt; 30 mg/g</td><td>• 微量白蛋白尿：30 ～ 299 mg/g<br>• 巨量白蛋白尿：≧ 300 mg/g</td></tr><tr><td><strong>血清肌酸酐 (Creatinine)</strong></td><td>男 0.7~1.2 / 女 0.5~0.9 mg/dL</td><td>受年齡、性別、肌肉量影響，需換算 eGFR 評估</td></tr></tbody></table></div>", "memory_core": "【正常腎生理速記】：GFR 100~125、AER <20 μg/min、血流佔心輸出量 25%！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0684", "chapter": "第十二章 糖尿病腎臟病變", "stem": "[共照網考古題 第 299 題] 黃女士患有糖尿病30 年，目前接受胰島素治療與每週3 次之血液透析，下列何項護理措施不適合黃", "options": ["A. 教導正確測量血壓並記錄", "B. 教導正確測量血糖並記錄", "C. 適當蛋白質補充1.2 公克/公斤體重", "D. 補充富含鉀及磷的食物"], "answer": "D", "explanation": "<div style=\"margin-bottom: 12px; font-size: 0.95rem;\"><strong>【題旨與正解速覽】：</strong>本題考核長期糖尿病合併血液透析（洗腎）病患之護理與電解質禁忌。<strong>正確答案為 (D) 補充富含鉀及磷的食物</strong>。</div><div class=\"exp-option-analysis\"><div style=\"font-weight: 700; color: #1e293b; margin-bottom: 8px;\">🔍 各選項逐項深度剖析與診斷鑑別：</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 A 護理措施適合</span><strong>教導正確測量血壓並記錄：</strong>洗腎患者體液平衡極為脆弱，規律監測血壓有助於評估水份滯留與設定透析脫水量。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 B 護理措施適合</span><strong>教導正確測量血糖並記錄：</strong>透析日與非透析日血糖變異大，規則 SMBG 能有效預防嚴重無自覺性低血糖。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-correct\">選項 C 護理措施適合</span><strong>適當蛋白質補充1.2 公克/公斤體重：</strong>血液透析過程流失大量胺基酸，指引推薦蛋白質攝取提升至 1.2~1.4 g/kg/day 以防止惡質化（Cachexia）。</div><div class=\"exp-option-item\"><span class=\"exp-tag exp-tag-wrong\">選項 D 護理措施不適合（本題正解）</span><strong>補充富含鉀及磷的食物 ❌：</strong>血液透析患者腎臟排泄功能歸零，極易蓄積引發高血鉀（誘發致死性心室震顫）與高血磷（引發次發性副甲狀腺機能亢進與血管鈣化），臨床必須<strong>「嚴格限制高鉀高磷食物」</strong>，絕不可補充！</div></div><div style=\"margin-top: 14px; font-weight: 700; color: #1e293b;\">📊 必考核心知識架構：血液透析 (HD) 患者四大飲食照護金科玉律表</div><div class=\"exp-table-wrapper\"><table class=\"exp-table\"><thead><tr><th>飲食管理面向</th><th>指引規範原則</th><th>臨床風險與衛教要點</th></tr></thead><tbody><tr><td><strong>蛋白質</strong></td><td><strong>充足補充 (1.2 ～ 1.4 g/kg/day)</strong></td><td>避免肌肉耗損與低白蛋白血症</td></tr><tr><td><strong>鉀離子 (本題)</strong></td><td><strong>嚴格限制 (&lt; 2,000 mg/day)</strong></td><td>蔬菜滾水川燙、禁楊桃/濃肉湯，防猝死</td></tr><tr><td><strong>磷離子 (本題)</strong></td><td><strong>嚴格限制 (&lt; 800~1,000 mg/day)</strong></td><td>禁內臟/堅果/加工食品，隨餐配磷結合劑</td></tr><tr><td><strong>水分與鈉</strong></td><td>嚴格限制 (鹽 &lt; 5g，水 &lt; 尿量+500mL)</td><td>控制兩次洗腎間體重增幅 &lt; 5%</td></tr></tbody></table></div>", "memory_core": "【洗腎飲食口訣】：洗腎要「補高蛋白（1.2g）」、「限磷限鉀限水分」；補磷鉀心臟停！", "status":
