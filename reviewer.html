: ""}, {"id": "CDE-EXAM-0346", "chapter": "第二十三章 懷孕與糖尿病", "stem": "為防範子癲前症（Preeclampsia），美國預防服務工作小組（USPSTF）與糖尿病學會指引建議，患有第一型或第二型糖尿病的孕婦，應於懷孕第幾週開始每日口服「低劑量阿斯匹靈（100-150 mg/day）」直至生產前？", "options": ["A. 於懷孕第 4 至 6 週（確認受孕著床即刻開始口服直至分娩）", "B. 於懷孕第 8 至 10 週（胚胎初次偵測到胎心搏動時開始服用）", "C. 於懷孕第 12 至 16 週（胎盤滋養層血管重塑完成前起始服用）", "D. 於懷孕第 24 至 28 週（接受常規 75g OGTT 篩檢確認後開始服用）"], "answer": "C", "explanation": "糖尿病孕婦為子癲前症高危族群，指引建議於懷孕 12-16 週開始每日睡前口服低劑量阿斯匹靈（100-150 mg）直至分娩前，有效預防子癲前症。", "memory_core": "【預防子癲前症用藥】：第 12~16 週開始每日低劑量阿斯匹靈！守護胎盤血管，降低子癲前症風險。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0475", "chapter": "第二十三章 懷孕與糖尿病", "stem": "[共照網考古題 第 48 題] 下列關於糖尿病病人高血壓的生活型態修正，何者錯誤？", "options": ["A. 限制鈉的攝取可以改善高血壓", "B. 減輕體重可以改善高血壓", "C. 中等強度的體能活動可以改善高血壓", "D. 多喝紅酒可以改善高血壓"], "answer": "D", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第二十三章 懷孕與糖尿病）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. 限制鈉的攝取可以改善高血壓</b>：正確。限制鈉攝取（每日鈉 < 2,400 mg，即食鹽 < 6 g）可顯著降低細胞外液容積與收縮壓。</li><li><b>(B) B. 減輕體重可以改善高血壓</b>：正確。過重或肥胖者每減輕體重 1 公斤，平均可降低收縮壓與舒張壓約 1 mmHg。</li><li><b>(C) C. 中等強度的體能活動可以改善高血壓</b>：正確。規律中等強度有氧運動（每週 ≧ 150 分鐘）可降低周邊血管阻力並改善血壓。</li><li><b>(D) D. 多喝紅酒可以改善高血壓（正確答案）</b>：<b>本題正確答案（何者錯誤）</b>。過量飲酒會活化交感神經並使血壓升高、三酸甘油酯暴增及誘發低血糖；臨床指引對高血壓患者強調「<b>節制飲酒（男性每日不超過 2 酒精當量、女性不超過 1 酒精當量；無飲酒習慣者絕不建議開始喝酒）</b>」，因此宣稱「多喝紅酒可以改善高血壓」為完全錯誤之衛教！</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 糖尿病合併高血壓之生活型態修正（S-ABCDE）原則表：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">生活型態項目</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">正確臨床建議</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">降壓效益與正誤</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>限鈉 (Sodium restriction)</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">每日鈉 < 2,400 mg（食鹽 < 6g）</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">✓ 正確（降壓約 2~8 mmHg）</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>減重 (Body weight reduction)</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">減輕體重 5~7% 以上</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">✓ 正確（每減 1 kg 約降 1 mmHg）</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>規律運動 (Exercise)</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">每週 ≧ 150 分鐘中等強度有氧運動</td><td style=\"padding:6px; border:1px solid #cbd5e1;\">✓ 正確（降壓約 4~9 mmHg）</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>飲酒控管 (Alcohol limitation)</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>應嚴格限制飲酒（女≦1當量、男≦2當量）</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>❌ 錯誤（不可鼓勵「多喝紅酒」降血壓！本題正解 D）</b></td></tr></tbody></table></div>", "memory_core": "【高血壓生活型態修正】：限鈉、減重、規律運動、DASH 飲食、戒菸、限制飲酒；絕不可建議「多喝紅酒」改善高血壓！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0534", "chapter": "第二十三章 懷孕與糖尿病", "stem": "[共照網考古題 第 112 題] 有關尿酮監測，下列何者正確？", "options": ["A. 第2 型糖尿病在高血糖與壓力狀態下，也不會產生酮體，無須檢測。", "B. 第2 型糖尿病的患者，不可能出現尿酮的情形。", "C. 妊娠糖尿病的患者，只有在清晨出現高血糖時才需要測尿酮", "D. 尿酮的檢測可以協助判斷減重者是否確實減少熱量攝取。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十三章 尿酮監測與減重熱量不足之評估 (共照網考古 第112題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)(B) 第 2 型糖尿病患者在面臨嚴重感染、急性心肌梗塞、重大手術或重度生理壓力時，應激荷爾蒙暴增亦可能引爆嚴重的酮酸中毒並產生強陽性尿酮，絕非「不可能出現尿酮」。\n🔹 (C) 妊娠糖尿病患者在懷孕期間因為胎兒持續抽取母體葡萄糖，夜間空腹極易發生「加速飢餓狀態（Accelerated starvation）」，凡生病發燒、嘔吐腹瀉或血糖 ＞ 200 mg/dL 時皆需驗尿酮，非僅限於清晨高血糖。\n🔹 (D) 正確。當個案進行減重飲食介入時，若熱量攝取顯著不足（製造熱量赤字），體內肝醣迅速耗盡，脂肪組織開始大規模水解轉化為酮體供能，此時尿液中會檢驗出酮體反應；因此臨床上「尿酮的檢測可以客觀協助判斷減重者是否確實嚴格減少了熱量攝取」。\n\n📊 臨床監測尿酮三大應用情境比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床應用情境</th><th>檢驗尿酮時機</th><th>臨床意義與照護決策</th></tr></thead>\n<tbody>\n<tr><td><b>飲食減重與熱量評估</b></td><td><b>減重期間定期晨尿檢驗</b></td><td><b>協助判斷熱量是否足夠減少；過量酮體需防脫水</b></td></tr>\n<tr><td><b>妊娠糖尿病照護</b></td><td>晨起空腹、生病日或嘔吐不適</td><td>早期揪出夜間飢餓性生酮，及時調整睡前點心</td></tr>\n<tr><td>高血糖急症防範</td><td>T1D/T2D 血糖 ＞ 250 mg/dL</td><td>緊急攔截致命性糖尿病酮酸中毒 (DKA)</td></tr>\n</tbody></table></div>", "memory_core": "【第二十三章 必考考點】：尿酮檢測可協助評估「減重者是否確實減少熱量」！T2D 遇感染壓力一樣會產生酮體。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0541", "chapter": "第二十三章 懷孕與糖尿病", "stem": "[共照網考古題 第 119 題] 妊娠後期的能量代謝，空腹與餐後皆發生改變，下列何者為是", "options": ["A. 妊娠期間空腹特點是減緩脂肪代謝，由初期脂肪變成醣類代謝，以醣類代謝為主的過程快， 造成糖尿病酮酸中毒危險性及空腹酮體產生增加。", "B. 當食物增加供給時，游離脂肪酸與酮體濃度比一般非懷孕時高出許多，這也會增加糖尿病 酮酸中毒的危險性。", "C. 空腹與24 小時平均血糖值下降，妊娠婦女較非妊娠期在食物消化後有較低及較長時間的 血糖濃度。", "D. 葡萄糖移動增加及胰島素敏感降低，使懷孕婦女處於發展為妊娠性糖尿病危險。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十三章 懷孕中後期荷爾蒙與生理性胰島素阻抗 (共照網考古 第119題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 妊娠空腹代謝特點是「加速脂肪分解（Accelerated starvation）」釋放游離脂肪酸以節省葡萄糖留給胎兒利用。\n🔹 (B) 進食後母體脂肪分解受抑制，游離脂肪酸下降，非高出許多。\n🔹 (C) 妊娠期空腹血糖較低，但進餐後因生理性胰島素阻抗，餐後血糖波動幅度較大且維持較長時間的高血糖。\n🔹 (D) 正確。在懷孕中後期（第 24-28 週起），隨著胎盤快速生長成熟，胎盤分泌大量的抗胰島素荷爾蒙（包括**人類胎盤泌乳素 hPL / hCS、人類胎盤生長激素 hGH、黃體素 Progesterone、皮質醇與雌激素**），誘發母體周邊組織產生顯著的「生理性胰島素阻抗（Insulin resistance 增加 50-70%）」；母體為了將葡萄糖源源不絕透過胎盤 Facilitated diffusion 移動輸送給胎兒，若母體胰島 β 細胞代償性增生分泌能力不足，就會演變成「妊娠性糖尿病 (GDM)」，故此選項為完全正確的病理生理陳述。\n\n📊 懷孕中後期引發胰島素阻抗之核心胎盤荷爾蒙矩陣表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>胎盤分泌荷爾蒙名稱</th><th>分泌峰值孕期</th><th>對母體代謝之生物效應</th></tr></thead>\n<tbody>\n<tr><td><b>人類胎盤泌乳素 (hPL / hCS)</b></td><td><b>懷孕第 24 - 28 週達高峰</b></td><td><b>強烈抑制母體周邊葡萄糖攝取，促進脂肪分解</b></td></tr>\n<tr><td><b>黃體素 (Progesterone)</b></td><td>隨孕期持續攀升</td><td>抑制骨骼肌 GLUT-4 轉運，加劇胰島素阻抗</td></tr>\n<tr><td>胎盤生長激素 (hGH-V)</td><td>妊娠中後期</td><td>重塑母體肝臟代謝，促進內生性葡萄糖輸出</td></tr>\n<tr><td>皮質醇 (Cortisol)</td><td>懷孕後期顯著升高</td><td>對抗胰島素作用，升高餐後血糖峰值</td></tr>\n</tbody></table></div>", "memory_core": "【第二十三章 必考考點】：孕中後期胎盤分泌 hPL 等荷爾蒙：【胰島素阻抗增加 50-70%】，誘發妊娠糖尿病 (GDM)！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0550", "chapter": "第二十三章 懷孕與糖尿病", "stem": "[共照網考古題 第 129 題] 衛教人員想瞭解丁先生的健康性讀寫能力(health literacy)，以下評估方式何者較適合？", "options": ["A. 從丁先生的交談用語中推測", "B. 請丁先生閱讀一份衛教文字再與其討論", "C. 察看丁先生所登錄的教育程度", "D. 詢問丁先生平時是否閱讀報章雜誌"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 健康識能 (Health Literacy) 臨床評估技術 (共照網考古 第129題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 從交談用語中推測：口語表達流利者可能在文字閱讀與用藥數值理解上存在嚴重障礙（隱藏性文盲），主觀臆測極不準確。\n🔹 (B) 正確。評估個案健康讀寫能力（Health literacy）的最客觀、最精準之標準實務技巧為「**功能性任務評估法（Teach-back / Interactive review）**」：提供一份真實的衛教單張、藥袋標籤或衛教文字，請個案親自閱讀後，衛教師再以開放式提問與其討論其中意涵，觀察其能否正確辨識文字與數據並轉譯為實際行動，這是評估健康識能最科學可靠的方法。\n🔹 (C) 察看學校教育程度：學歷不等於健康識能，高學歷者亦可能無法理解醫療數據與藥物仿單。\n🔹 (D) 詢問平時是否閱讀報紙：屬社交習慣自述，難以反映其對醫療照護文本的理解與落實能力。\n\n📊 臨床評估病患健康識能 (Health Literacy) 優劣途徑對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>評估評量途徑</th><th>臨床評估方法與特質</th><th>客觀信度評級</th></tr></thead>\n<tbody>\n<tr><td><b>功能性任務互動法 (首選)</b></td><td><b>請病患閱讀一段衛教文字/藥袋，隨後以開放提問討論 (Teach-back)</b></td><td><b>最高！能精準鑑別真實醫療理解障礙</b></td></tr>\n<tr><td>查看學歷文憑</td><td>以最高學歷（小學、高中、大學）直接推斷</td><td>低！學歷不等於醫學健康識能</td></tr>\n<tr><td>外觀談吐臆測</td><td>從日常打扮、說話語氣臆測</td><td>極低！容易忽略隱蔽性識能不足</td></tr>\n</tbody></table></div>", "memory_core": "【第二十三章 必考考點】：評估健康讀寫能力最佳方式：【請其閱讀一段衛教文字並討論理解 (Teach-back)】！非看學歷。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0947", "chapter": "第二十三章 懷孕與糖尿病", "stem": "[共照網考古題 第 617 題] 有關懷孕期間的糖尿病患者營養建議，下列何者為非", "options": ["A. 懷孕第一期不需增加熱量攝取", "B. 早餐的醣類/胰島素比值較其他餐次低。", "C. 鐵的需要量在懷孕後就要增加", "D. 蛋白質RDA 為1.1 g/kg/day，或每天增加26 公克"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第二十三章 孕期鐵質與各孕期營養需求標準 (共照網考古 第617題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 懷孕第一期（1-12 週）胎兒體積微小，母體基礎代謝率未顯著提高，指引建議第一期「不需額外增加總熱量攝取」（第二、三期每日才需額外增加 300-340 大卡）。\n🔹 (B) 早餐因黎明現象胰島素阻抗最大，早餐 ICR 比值數值較低（需打較多胰島素）。\n🔹 (C) 正確（何者為非）。依據台灣衛福部「國人膳食營養素參考攝取量 (DRIs)」及孕期營養指引：\n- **懷孕第一期（早孕期）**：母體血容積擴張有限，且此時母體常伴隨噁心、孕吐等早孕反應，口服高劑量鐵劑極易加劇腸胃道刺激與便秘；因此「**懷孕第一期鐵質需要量與未懷孕期相同（每日 15 mg），並不需要在懷孕後立刻大量增加鐵的攝取量**」！\n- **懷孕第三期（及第二期晚期）**：胎兒紅血球大量生成、胎盤急速生長及為分娩失血儲備，鐵的需要量才大幅暴增至每日增加 30 毫克（總量達 **45 mg/day**）。因此宣稱「鐵的需要量在懷孕後就要立刻增加」不符臨床營養時程，為非者。\n🔹 (D) 懷孕期蛋白質 RDA 建議為 1.1 g/kg/day 或每日額外增加 25-26 公克。\n\n📊 孕期各階段熱量與鐵質 (Iron) 建議增加量標準表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>懷孕時程階段</th><th>每日熱量額外增加建議</th><th>每日鐵質 (Iron) 攝取建議標準</th></tr></thead>\n<tbody>\n<tr><td><b>懷孕第一期 (早孕期)</b></td><td><b>不需增加 (0 kcal)</b></td><td><b>維持原狀 (15 mg/day，不需立刻增加！本題考點)</b></td></tr>\n<tr><td>懷孕第二期 (中期)</td><td>增加約 300 - 340 kcal/day</td><td>維持約 15 mg/day (視抽血 Ferritin 評估)</td></tr>\n<tr><td><b>懷孕第三期 (晚孕期)</b></td><td>增加約 300 - 450 kcal/day</td><td><b>大幅增加 30 mg！(總攝取量達 45 mg/day)</b></td></tr>\n</tbody></table></div>", "memory_core": "【第二十三章 必考考點】：孕期第一期熱量與鐵質「皆不需要立刻增加」！第三期胎兒急速造血鐵質才大幅增加 30mg。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1007", "chapter": "第二十九章 糖尿病科技的運用", "stem": "[共照網考古題 第 707 題] 使用連續皮下胰島素注射治療(CSII)第1 型糖尿病人的敘述下列何者正確?", "options": ["A. 生活品質較差", "B. 較傳統注射容易低血糖", "C. 注射部位不會發生局部脂肪增生(lipohypertrophy)", "D. 胰島素給予方式較彈性"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十九章 糖尿病科技的運用 (共照網考古 第707題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 胰島素幫浦 (CSII) 減少頻繁扎針次數，讓進食與運動時間更彈性，臨床實證大幅提升患者的生活品質與滿意度。\n🔹 (B) CSII 能精細設定每小時微量基礎率並具備臨時基礎率調整功能，臨床研究證實相比傳統每日多次注射 (MDI) 能「顯著減少嚴重低血糖」發生率。\n🔹 (C) 幫浦輸注導管軟針若固定於同一部位超過 2~3 天未更換輪替，同樣會誘發局部的「脂肪肥大增生 (Lipohypertrophy)」與皮下硬結，干擾胰島素均勻吸收。\n🔹 (D) 正確。連續皮下胰島素輸注 (CSII) 具備多段基礎率、臨時基礎率 (Temp basal)、以及針對不同高脂高蛋白飲食的「雙波 (Dual-wave) / 方波 (Square-wave) 追加」功能，胰島素給予方式極具臨床彈性。\n\n📊 胰島素幫浦 (CSII) vs 傳統多次皮下注射 (MDI) 比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>功能特點</th><th>連續皮下胰島素注射 (CSII 幫浦)</th><th>傳統多次注射 (MDI, 一天3～4針)</th></tr></thead>\n<tbody>\n<tr><td><b>胰島素種類</b></td><td><b>僅使用速效胰島素類似物 (Rapid-acting)</b></td><td>基礎長效 (Basal) + 餐時速效 (Bolus)</td></tr>\n<tr><td><b>基礎率調整</b></td><td>可按 0.025~0.05 U/hr 極微量分段調整</td><td>固定一天 1~2 次注射，無法逐時微調</td></tr>\n<tr><td><b>追加彈性 (Bolus)</b></td><td><b>具常規波、延長方波、雙波彈性模式</b></td><td>僅能一次性注射，高脂大餐後易延遲高血糖</td></tr>\n<tr><td><b>低血糖風險</b></td><td>顯著降低嚴重低血糖發生率</td><td>相對較高（受注射部位吸收變化影響大）</td></tr>\n<tr><td><b>注射部位脂肪增生</b></td><td><b>若未落實 2-3 天換管輪替，依然會發生！</b></td><td>部位輪替不良時極為常見</td></tr>\n</tbody></table></div>", "memory_core": "【第二十九章 必考考點】：CSII 幫浦只用速效胰島素；給予最具彈性（可微調基礎率與雙波追加）；輪替不良依然會「脂肪增生」！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0308", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "在糖尿病照護個案管理流程中，「個案流失（Loss to follow-up）」是品質管理的重大威脅。下列何者為預防流失與提升回診率的最有效實務策略？", "options": ["A. 尊重個案就醫自由，對於逾期未回診者採取完全不主動提醒與不干預之消極應對", "B. 運用資訊系統建立未回診預警名單，主動以簡訊提醒並電訪關懷以協助排除就醫障礙", "C. 對於逾期未回診之個案實施門診掛號費加成收費，藉由經濟負擔加重督促其按時履約", "D. 將未按時回診個案直接通報健保署予以除名，將有限名額釋出予配合度高之優質病患"], "answer": "B", "explanation": "預防個案流失的實證策略包括：建置個案管理資訊系統、設定預約回診自動提醒機制、產出未回診異常警示名單，並由個管衛教師主動電話關懷，了解未回診之根本原因（如經濟困難、行動不便、藥物副作用）並及時協助排除障礙，維持照護連續性。", "memory_core": "【預防個案流失策略】：資訊系統排程預警 ＋ 主動電話關懷追蹤 ＋ 協助排除就醫障礙，確保照護連續性。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0322", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "在醫療品質持續改善循環（PDCA Cycle）中，當某院所發現其糖尿病個案之「年度眼底鏡檢查率僅有 28%（遠低於同儕水準）」時，團隊著手分析檢查率低落原因（如眼科需另掛號候診過久），並規劃導入免散瞳眼底鏡攝影機於新陳代謝科門診。請問此步驟屬於 PDCA 的哪一個階段？", "options": ["A. 計畫階段（Plan，著重於剖析問題根本成因並研擬創新改善行動對策）", "B. 執行階段（Do，著重於全面在門診常規中實地試行免散瞳攝影檢查方案）", "C. 查核階段（Check，著重於評估導入新設備後眼底檢查率之改善成效）", "D. 處置階段（Act，著重於將跨科眼底鏡檢查流程納入全院標準作業流程）"], "answer": "A", "explanation": "PDCA 循環四階段：Plan（計畫：界定問題、分析真因、設定改善指標、規劃行動對策）；Do（執行：小規模試行對策）；Check（查核：監測成效數據與目標差距）；Act（處置：將成功對策標準化納入常規作業流程，未達標者重新檢討）。分析原因並規劃新流程屬於 Plan 階段。", "memory_core": "【PDCA 品質循環：Plan 階段】：找出問題癥結、剖析成因、規劃創新改善方案！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0324", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "在基層診所推動糖尿病共同照護網，相較於醫學中心，其具備的最主要照護優勢為何？", "options": ["A. 具備高階昂貴之達文西手術設備與重症加護病房，能即刻處理各類急性心血管手術急症", "B. 擁有大量各專科住院醫師與實習醫師人力資源，能針對單一個案每日輪流進行學術查房", "C. 享有完全不受全民健保醫療品質指標規範之特權，能自由調配所有常規抽血檢驗之項目", "D. 具備社區地緣便利性與就醫時間成本低優勢，且醫病關係長期穩定有利於落實持續追蹤"], "answer": "D", "explanation": "基層診所具備社區在地化（Proximity）與便利性，病患掛號、看診與領藥時間成本低，醫病互動長期且緊密，有利於建立深厚信任感並降低個案流失率，能提供最接地氣、最持續的慢性病照護與早期介入，是分級醫療的堅實基石。", "memory_core": "【基層共照網核心優勢】：地緣便利、關係長期穩固、生活融入度高，實踐持續性基層醫療！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0586", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "[共照網考古題 第 173 題] 下列與糖尿病患預防注射有關的敘述，何者正確？", "options": ["A. 施打流感疫苗可降低肺炎死亡率", "B. 年長糖尿病人應每兩年注射流感疫苗一次", "C. 美國疾病管制局建議每個糖尿病人應接受流行性感冒及肺炎疫苗", "D. 糖尿病患沒有施打肺炎鏈球菌疫苗的必要"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第二十二章 糖尿病預防注射指引 (共照網考古 第173題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 施打流感疫苗主要直接預防流感病毒感染及其嚴重併發症，施打「肺炎鏈球菌疫苗」才是直接降低肺炎死亡率的手段。\n🔹 (B) 流感病毒抗原每年變異，年長糖尿病人應「每年」注射一次流感疫苗，絕非每兩年一次。\n🔹 (C) 正確。美國疾病管制局 (CDC) 及各國糖尿病學會指引明確建議：每位糖尿病病患均應例行接受「流行性感冒疫苗（每年施打）」及「肺炎鏈球菌疫苗（PCV/PPSV）」之預防注射，以大幅減少呼吸道感染、敗血症與住院死亡風險。\n🔹 (D) 糖尿病患為肺炎鏈球菌侵襲性感染之極高危險群，極具施打肺炎疫苗之必要性。\n\n📊 糖尿病患者疫苗接種指引建議表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>疫苗種類名稱</th><th>指引建議接種頻率</th><th>臨床防護核心目的</th></tr></thead>\n<tbody>\n<tr><td><b>流感疫苗 (Influenza)</b></td><td><b>每年秋季定期施打 1 劑</b></td><td>防範季節性流感重症、急性心肌梗塞觸發</td></tr>\n<tr><td><b>肺炎鏈球菌疫苗</b></td><td><b>PCV13/15/20 結合型 ＋ PPSV23 多醣體</b></td><td><b>大幅降低侵襲性肺炎鏈球菌肺炎與菌血症死亡率</b></td></tr>\n<tr><td><b>帶狀疱疹疫苗 (Shingrix)</b></td><td>建議 50 歲以上施打 2 劑</td><td>預防神經痛誘發血糖暴衝</td></tr>\n<tr><td><b>B 型肝炎疫苗</b></td><td>19～59 歲成年病患常規建議接種</td><td>防範驗血糖扎針傳染肝炎</td></tr>\n</tbody></table></div>", "memory_core": "【第二十二章 必考考點】：糖尿病防感染二大必備疫苗：流感疫苗「每年打」、肺炎鏈球菌疫苗「務必施打」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0867", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "[共照網考古題 第 528 題] 有關糖尿病在共同照護（shared care）的概念何者錯誤？", "options": ["A. 由醫院的專業人員組成團隊，提供以糖尿病為主的照護服務內容及方式。", "B. 由醫院的專業人員與一般科醫師聯合組成團隊，提供以糖尿病為主照護服務及方式。", "C. 以照護糖尿病為主，由社區或基層醫療單位所組成，強調多元化的專業人力的組合。", "D. 由社區、診所及基層醫療，提供以糖尿病為主照護服務及方式。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十二章 共同照護概念與架構 (共照網考古 第528題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 醫院端專業跨團隊（新陳代謝科醫師、衛教師、營養師）提供專科高階照護。\n🔹 (B) 醫院端專科團隊與基層一般科/家醫科聯合組成照護網絡，提供互補性服務。\n🔹 (C) 基層診所與社區衛生所組成在地團隊，強調整合基層多元專業人力。\n🔹 (D) 正確（何者錯誤）。糖尿病共同照護 (Shared Care) 的核心定義在於「醫院專科醫療與基層社區醫療之間的無縫整合、雙向轉診與分工合作」；D 選項狹隘地指稱「由社區、診所及基層醫療提供」，完全抹煞與切斷了醫院專科團隊的整合角色，違背共同照護的雙向共享初衷。\n\n📊 糖尿病共同照護網 (Shared Care) 核心運作模式：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>層級角色</th><th>團隊核心職責</th><th>轉診機制運作</th></tr></thead>\n<tbody>\n<tr><td><b>醫學中心 / 區域醫院</b></td><td>複雜併發症處置、急重症住院、疑難病例確診</td><td>病情穩定後<b>下轉基層診所</b>追蹤</td></tr>\n<tr><td><b>基層診所 / 社區衛生所</b></td><td>慢性期常規門診拿藥、衛教追蹤、每年常規篩檢</td><td>出現急重症或頑固高血糖時<b>上轉醫院</b></td></tr>\n<tr><td><b>共同照護的核心靈魂</b></td><td colspan=\"2\"><b>「雙向轉診、資源互通、分工共享、以病人為中心」</b></td></tr>\n</tbody></table></div>", "memory_core": "【第二十二章 必考考點】：共同照護 (Shared Care) 是「醫院與基層診所雙向合作」，絕非單由基層診所獨立運作！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0957", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "[共照網考古題 第 629 題] 有關糖尿病共同照護的成功要件，何者正確？", "options": ["A. 追求醫療科技化；以提供偏遠或基層醫療支援。", "B. 為達有效醫療資源整合應立法，並由各縣巿衛生局執行。", "C. 加強偏遠地區及基層醫療設備，以提供當地民眾就醫方便性", "D. 加強及落實轉診制度、辦理繼續教育與討論會。"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十二章 照護團隊運作與轉診 (共照網考古 第629題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 共同照護的核心是「以病人為中心的團隊整合照護」，追求高科技化並非偏鄉照護的唯一或主要成功要素。\n🔹 (B) 醫療資源整合重在建立協同夥伴網絡，非單純透過強硬立法強制各衛生局執行。\n🔹 (C) 單純增加硬體設備若無合格照護團隊進駐與轉診機制，無法確保醫療照護品質。\n🔹 (D) 正確。依據台灣糖尿病共同照護網成功推動之核心關鍵經驗：健全的共同照護體系必須依賴「加強並切實落實雙向轉診制度（基層與醫院互信分工）」，並持續「針對跨專業團隊辦理高品質的繼續教育培訓、病例討論會與照護心得交流」，使醫護團隊能與時俱進對齊最新指引。\n\n📊 糖尿病共同照護網推動成功三大關鍵基石：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>成功關鍵維度</th><th>具體臨床運作機制</th><th>制度發揮之效益</th></tr></thead>\n<tbody>\n<tr><td><b>1. 落實轉診網絡</b></td><td><b>明確的上轉 (急重症) 與下轉 (穩定期) 機制</b></td><td>醫療資源有效分流，基層獲得信任</td></tr>\n<tr><td><b>2. 持續專業培訓</b></td><td><b>定期辦理繼續教育學分班與跨專業討論會</b></td><td>維持照護品質一致性，專業能力同步</td></tr>\n<tr><td><b>3. 財務品質誘因</b></td><td>健保 P4P 品質獎勵與支付制度支持</td><td>保障醫療團隊付出之合理給付</td></tr>\n</tbody></table></div>", "memory_core": "【第二十二章 必考考點】：共照網成功最核心要件：落實「雙向轉診制度」＋ 辦理「繼續教育與討論會」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0986", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "[共照網考古題 第 682 題] 有關糖尿病共同照護的敘述何者錯誤？", "options": ["A. 以醫療為中心", "B. 兼顧以醫療、保健、生活品質的服務", "C. 讓糖尿病人就近得到照顧", "D. 建立完整的轉介網絡"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第二十二章 共同照護網理念 (共照網考古 第682題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者錯誤）。現代糖尿病共同照護網的最核心哲學是以「以病人為中心 (Patient-Centered Care)」，結合醫療、營養、護理與心理社會支持，絕非傳統父權威權的「以醫療為中心」或「以醫師為中心」！以醫療為中心忽視了病人的生活脈絡與自我管理主體性。\n🔹 (B) 照護目標兼顧臨床醫療指標（A1c/血壓/血脂）、預防保健及生活品質提升。\n🔹 (C) 透過基層醫療網絡建立，使病人在社區基層診所即可就近獲得高品質專業照護。\n🔹 (D) 建立醫院與診所間完整的雙向轉介機制與支援網絡。\n\n📊 傳統醫療導向模式 vs 共同照護以病人為中心模式對比：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>比較維度</th><th>傳統威權醫療模式</th><th>共同照護網創新模式</th></tr></thead>\n<tbody>\n<tr><td><b>照護核心哲學</b></td><td><b>以醫療為中心 / 以醫師為中心</b></td><td><b>「以病人為中心 (Patient-Centered)」！</b></td></tr>\n<tr><td><b>醫療目標</b></td><td>單純追求生化檢驗數值達標</td><td>兼顧疾病控制、全人健康與生活品質</td></tr>\n<tr><td><b>照護場域</b></td><td>病患必須大老遠奔波醫學中心</td><td>社區診所就近照護，醫院專科後盾支援</td></tr>\n</tbody></table></div>", "memory_core": "【第二十二章 必考考點】：共同照護網核心是「以病人為中心」，說「以醫療為中心」是錯誤的！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-1022", "chapter": "第二十二章 團隊之管理運作與照護品質監控成效評估", "stem": "[共照網考古題 第 726 題] 下列有關糖尿病自我管理教育之敘述，何者不正確?", "options": ["A. 病人本身是衛教過程的主角，醫療團隊是引導者的角色。", "B. 衛教內容應考量病患生活方式的差異性", "C. 醫療人員定期評估病人自我照顧行為是否有所改變。", "D. 醫療人員須為病人擬定自我照護目標計畫"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十二章 糖尿病自我管理教育 (共照網考古 第726題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 現代糖尿病衛教的最高哲學是病人賦能，病人是生活的主角，醫療團隊是引導者與夥伴。\n🔹 (B) 衛教內容應個別化量身訂做，充分考量病患的生活作息、經濟條件與文化差異。\n🔹 (C) 定期評估病患的自我照護行為是否有所改變並給予正向回饋。\n🔹 (D) 正確（何者不正確）。自我管理教育的核心在於賦能，目標計畫必須是由「醫療團隊與病患雙方共同協商決定（Collaborative Goal Setting）」！若由「醫療人員單向為病人擬定目標計畫」，形同剝奪病人的主體性與自治權，將嚴重降低病患的自主承諾與執行意願。\n\n📊 威權式目標設定 vs 賦能協商式目標設定比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>決策維度</th><th>威權傳統衛教模式</th><th>現代 DSMES 賦能衛教模式</th></tr></thead>\n<tbody>\n<tr><td><b>目標訂定主體</b></td><td><b>「醫療人員單方為病人擬定計畫」</b></td><td><b>「專業團隊與病人共同協商決定目標」！</b></td></tr>\n<tr><td><b>執行承諾感</b></td><td>病人感覺被命令，遵從性低</td><td>病人自主認同，內在動機高，自我效能強</td></tr>\n<tr><td><b>面對障礙態度</b></td><td>挫折指責「不聽話」</td><td>共同分析生活障礙，調整支持策略</td></tr>\n</tbody></table></div>", "memory_core": "【第二十二章 必考考點】：自我管理教育大忌：絕不可由「醫療人員單向為病人訂定目標」，必須由「雙方共同協商決定」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0368", "chapter": "第二十五章 老年人的糖尿病照護", "stem": "高齡糖尿病長者發生「低血糖（Hypoglycemia）」時，其臨床症狀表現與年輕人相較，最顯著的危險特徵為何？", "options": ["A. 必定伴隨極為劇烈的心悸、手抖與大量冷汗等典型自主神經興奮症狀，極易在初期早期察覺", "B. 主要表現為突發性顏面潮紅、體溫飆高至 39 度以上及瞳孔對光反射極度過敏亢進等交感表徵", "C. 自主神經發抖冒汗等典型警訊不明顯，常以頭暈、步態不穩跌倒、嗜睡或類似中風假象為表現", "D. 血糖急遽下降時多以狂躁不安、大聲咆哮攻擊行為及極度飢餓亢進為單一固定之臨床主訴"], "answer": "C", "explanation": "高齡長者交感神經反射衰退，缺乏手抖心悸冒汗之預警信號；低血糖常以中樞神經缺糖非典型症狀表現：步態不穩跌倒、頭暈、嗜睡、譫妄或短暫中風假象，極易被延誤。", "memory_core": "【高齡非典型低血糖兇險】：手抖心悸全消失！以「跌倒、嗜睡、胡言亂語、中風假象」奪命爆發！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0370", "chapter": "第二十五章 老年人的糖尿病照護", "stem": "「肌少症（Sarcopenia）」在高齡糖尿病患者發病率極高，其造成血糖控制惡化的惡性循環生理機轉為何？", "options": ["A. 肌肉纖維萎縮會直接抑制腦下垂體分泌促腎上腺皮質素，引發繼發性腎上腺功能不全急症", "B. 骨骼肌為餐後葡萄糖主要清除器官（佔 80%），肌肉流失使糖分處置庫縮小並加重阻抗", "C. 肌肉質量下降會促使腸道微生群失調，進而完全阻斷小腸上皮細胞對各種胺基酸的主動吸收", "D. 萎縮骨骼肌會釋放大量肌酸激酶進入血液循環，直接破壞胰島 β 細胞表面之葡萄糖轉運蛋白"], "answer": "B", "explanation": "骨骼肌佔餐後葡萄糖清除的 80%。肌少症導致肌肉量衰減，清除葡萄糖的水庫銳減，加重胰島素阻抗與血糖波動；高血糖又促進肌肉分解，形成惡性循環。", "memory_core": "【肌少症惡性循環】：骨骼肌是葡萄糖最大清除池！肌肉萎縮 ➔ 葡萄糖無處可去 ➔ 血糖失控 ➔ 加速肌少。", "status": "UNCERTA NYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0864", "chapter": "第二十五章 老年人的糖尿病照護", "stem": "[共照網考古題 第 525 題] 對於老年糖尿病患提供適當的營養，下列何者正確", "options": ["A. 限制水分", "B. 補充鋅", "C. 限制鈣", "D. 限制鎂"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第二十五章 老年人的糖尿病照護 (共照網考古 第525題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 老年人極易因口渴中樞感知退化而發生脫水與高滲透壓高血糖 (HHS)，若非重度心臟衰竭或洗腎，絕不可盲目限制水分。\n🔹 (B) 正確。老年人常伴隨味覺遲鈍、食慾不振、胃酸分泌減少及慢性傷口癒合困難，研究證實微量元素「鋅 (Zinc)」參與胰島素合成儲存、免疫機能維持與細胞修復，為高齡糖尿病患適當補充鋅有助於改善食慾、增強免疫與傷口癒合。\n🔹 (C)/(D) 鈣質與鎂離子對於維持老年人骨質密度、神經肌肉傳導與預防骨折骨鬆極為重要，指引絕不建議限制鈣與鎂。\n\n📊 老年糖尿病患微量營養素代謝需求矩陣：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>微量營養素</th><th>老年糖尿病患生理重要性</th><th>臨床缺乏之風險</th></tr></thead>\n<tbody>\n<tr><td><b>微量元素 鋅 (Zinc)</b></td><td><b>參與胰島素結晶儲存、味蕾修復、組織傷口癒合</b></td><td><b>食慾減退、味覺鈍化、下肢傷口潰瘍經久不癒</b></td></tr>\n<tr><td><b>鈣質與維生素 D</b></td><td>維持骨質礦化、預防骨質疏鬆</td><td>跌倒骨折風險倍增</td></tr>\n<tr><td><b>充足水分 (Water)</b></td><td>維持腎臟灌流、促進廢物代謝</td><td>極度容易引發高血糖高滲透壓昏迷 (HHS)</td></tr>\n</tbody></table></div>", "memory_core": "【第二十五章 必考考點】：老年糖尿病人補充「鋅 (Zinc)」有助於傷口癒合與味覺改善；萬萬不可盲目限水或限鈣！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0390", "chapter": "第二十八章 住院血糖管理及照護", "stem": "針對加護病房（ICU）內接受持續靜脈輸注胰島素（IV Insulin Infusion）之重症高血糖病人，現代臨床指引建議的血糖控制目標區間為何？", "options": ["A. 每 12 小時採集一次指尖微血管血檢驗，並依固定刻度每班微調一次靜脈胰島素點滴流速", "B. 每 1 至 2 小時監測動脈或微血管血糖，依標準化方案滴定流速，暫停輸注時嚴防血糖波動", "C. 靜脈胰島素點滴輸注期間，常規每 24 小時抽一次動脈血氣分析以代替所有微血管採血", "D. 胰島素點滴管路應與高濃度全血或全靜脈營養（TPN）共用同一單一腔道以促進藥效混合"], "answer": "B", "explanation": "ICU 接受持續靜脈輸注胰島素（IV Insulin Infusion）病患，應落實每 1 至 2 小時密集監測動脈或微血管血糖，依滴定方案調整流速；暫停點滴時須注意低血糖或反彈高血糖。", "memory_core": "【重症 ICU 血糖黃金目標】：維持 140~180 mg/dL！過度嚴格（80~110）引發低血糖致死， 發高頻震盪短路，導致床邊血糖檢測儀器晶片燒毀", "D. 指尖微循環停滯會使紅血球在微血管內瞬間全數破裂溶血，導致試紙無法判讀呈空白"], "answer": "B", "explanation": "休克或末梢微循環極度不良之重症 ICU 病患，微血管收縮血液滯留，指尖血測值極不準確且常呈假性嚴重偏低，應採動脈血或中心靜脈血送實驗室檢驗。", "memory_core": "【休克重症採血禁忌】：肢端微循環衰竭時，指尖血糖失真！應改以動脈導管採血確保數值真實。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0419", "chapter": "第二十八章 住院血糖管理及照護", "stem": "病房常規使用「高警訊藥物（High-Alert Medication）」管理胰島素注射，為防範護理人員因外觀相似或劑量讀數錯誤引發嚴重醫療疏失，下列哪一項屬於標準雙重查核（Double-check）防呆機制？", "options": ["A. 護理師憑個人直覺與外觀經驗快速抽藥注射，無需對照醫師醫囑或核對藥物品名與規格", "B. 抽藥後由第二位合格護理人員獨立核對醫囑、藥品規格、刻度劑量與病人手圈，雙簽後施打", "C. 護理師自行抽藥後僅口頭詢問隔壁床病友是否正確，隨後即在電腦系統點選確認執行完畢", "D. 由病房工友或非醫護行政人員代為核對針筒刻度，護理師僅負責至床邊進行皮下推注給藥"], "answer": "B", "explanation": "胰島素為高警訊藥物（High-Alert Medication），病房給藥必須落實「獨立雙重查核（Independent Double Check）」：由第二位合格護理人員核對醫囑、藥名規格、劑量刻度與病人手圈身分，雙簽確認。", "memory_core": "【胰島素給藥安全鐵律】：高警訊藥物實施「獨立雙人雙重核對（Double-Check）」！杜絕劑量刻度失誤。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0649", "chapter": "第二十八章 住院血糖管理及照護", "stem": "[共照網考古題 第 251 題] 對於住院糖尿病人，重症病患餐前血糖應維持接近於？", "options": ["A. 90 mg/dl", "B. 110 mg/dl", "C. 130mg/dl", "D. 150mg/dl"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第二十八章 住院血糖管理及照護 (共照網考古 第251題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 90 mg/dL 接近嚴重低血糖邊緣，在重症患者極具致命性。\n🔹 (B) 正確。在重症病房 (ICU) 住院糖尿病人血糖控制指引的演進中，傳統 Van den Berghe 早期提出的嚴格胰島素強化治療方案曾建議將血糖緊密控制於 80～110 mg/dL（接近 110 mg/dL）；本共照網考古題乃以此古典重症標準（接近 110 mg/dL）為標準考點（現代 ADA 指引則建議多數 ICU 重症維持在 140～180 mg/dL）。\n🔹 (C)/(D) 130 或 150 mg/dL 在古典嚴格重症標準中偏高。\n\n📊 住院重症病患血糖控制歷史演進與標準對照表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>研究/指引規範</th><th>ICU 重症血糖控制標準</th><th>臨床意義與低血糖考量</th></tr></thead>\n<tbody>\n<tr><td><b>古典嚴格標準 (本題考點)</b></td><td><b>維持接近 110 mg/dL (80～110 mg/dL)</b></td><td>早期比利時單一中心研究曾認為可降感染與死亡</td></tr>\n<tr><td><b>現代安全標準 (NICE-SUGAR)</b></td><td><b>維持於 140～180 mg/dL (7.8～10.0 mmol/L)</b></td><td>證實過度嚴格控糖 (<110) 顯著增加致死性嚴重低血糖風險</td></tr>\n</tbody></table></div>", "memory_core": "【第二十八章 必考考點】：早期古典重症餐前血糖維持接近「110 mg/dL」；現代 ADA 安全指引重症維持在「140～180 mg/dL」。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0880", "chapter": "第二十八章 住院血糖管理及照護", "stem": "[共照網考古題 第 541 題] 歲男性，有糖尿病與高血壓病史，一個月前因為急性心肌梗塞住院檢查治療。 檢查結果如下：Total cholesterol 250mg/dl，Triglyceride 300mg/dl，HDL-cholesterol 30mg/dl 請問該病人的LDL-cholesterol 濃度為何？", "options": ["A. 170mg/dl", "B. 160mg/dl", "C. 150mg/dl", "D. 140mg/dl。"], "answer": "B", "explanation": "<b>【2026 台灣糖尿病核心教材權威詳解】</b>（出處：第二十八章 住院血糖管理及照護）：<ul style=\"margin:6px 0 8px 18px; padding:0; line-height:1.65;\"><li><b>(A) A. 170mg/dl</b>：計算錯誤（250 - 30 - 300/5 = 160，非 170 mg/dL）。</li><li><b>(B) B. 160mg/dl（正確答案）</b>：<b>本題正確答案（160 mg/dL）</b>。依據 <b>Friedewald 公式</b>（當空腹三酸甘油酯 $\\text{TG} < 400\\text{ mg/dL}$ 時適用）：$$\\text{LDL-C} = \\text{Total Cholesterol (總膽固醇)} - \\text{HDL-C} - \\left(\\frac{\\text{TG}}{5}\\right)$$ 代入本題數值：$$\\text{LDL-C} = 250 - 30 - \\left(\\frac{300}{5}\\right) = 250 - 30 - 60 = 160\\text{ mg/dL}$$！</li><li><b>(C) C. 150mg/dl</b>：計算錯誤。</li><li><b>(D) D. 140mg/dl。</b>：計算錯誤。</li></ul><div style=\"margin-top:8px; padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;\"><b>📊 Friedewald 公式計算 LDL-C 步驟拆解表（第 541 題）：</b><table style=\"width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px;\"><thead><tr style=\"background:#e2e8f0; color:#1e293b;\"><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">公式項目</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">數值與計算公式</th><th style=\"padding:6px; border:1px solid #cbd5e1; text-align:left;\">臨床使用限制</th></tr></thead><tbody><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>極低密度脂蛋白膽固醇 (VLDL-C) 估算</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">TG ÷ 5 ＝ 300 ÷ 5 ＝ <b>60 mg/dL</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">僅適用於空腹且 <b>TG < 400 mg/dL</b> 時（若 TG ≧ 400 須直接測定 Direct LDL-C）</td></tr><tr><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>低密度脂蛋白膽固醇 (LDL-C)</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\"><b>TC (250) － HDL-C (30) － TG/5 (60) ＝ 160 mg/dL（本題正解 B）</b></td><td style=\"padding:6px; border:1px solid #cbd5e1;\">本案合併急性心肌梗塞 (ASCVD)，LDL-C 目標應嚴格降至 < 55~70 mg/dL</td></tr></tbody></table></div>", "memory_core": "【LDL 計算公式必背】：LDL ＝ 總膽固醇(TC) － HDL － (TG ÷ 5)！本題：250 － 30 － (300÷5) ＝ 160 mg/dL（TG ≧ 400 時公式不適用）！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0362", "chapter": "第二十六章 特殊族群與糖尿病併發症營養治療", "stem": "接受血液透析（HD）之糖尿病個案在飲食控制中，常需嚴格限制血鉀以防致死性心律不整。下列何種蔬菜處理技巧有助於有效去除鉀離子？", "options": ["A. 將蔬菜整株微波加熱後連同滲出之菜汁一同拌飯食用，以完整保留水溶性抗氧化植化素", "B. 將蔬菜切碎以大量滾水燙煮 3-5 分鐘撈起，倒掉菜湯再烹調，且不喝菜湯或生菜沙拉", "C. 烹調時全面改用市售美味低鈉鹽或薄鹽醬油（以氯化鉀取代氯化鈉）進行大量調味醃漬", "D. 將深綠色蔬菜、香蕉與番茄打成高纖生鮮蔬果精力湯，於每日清晨透析前空腹一次飲盡"], "answer": "B", "explanation": "透析個案限鉀技巧：將蔬菜切碎並以滾水燙煮 3-5 分鐘倒掉菜汁再油炒，不可喝菜湯、果汁精力湯；且嚴禁使用以氯化鉀替代鈉的低鈉鹽/美味鹽。", "memory_core": "【洗腎排鉀飲食技巧】：青菜切碎滾水燙過倒掉菜湯再煮；嚴禁食用「低鈉鹽/美味鹽（含高鉀）」！禁生菜蔬果汁。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0377", "chapter": "第二十六章 特殊族群與糖尿病併發症營養治療", "stem": "胃部切除手術（Gastrectomy）後之糖尿病患者，若在「進食後半小時至 1 小時內」出現上腹劇烈飽脹、絞痛、噁心、臉色發紅與嚴重腹瀉，此現象臨床上稱之為：", "options": ["A. 晚期傾倒症候群（Late Dumping Syndrome，餐後 1-3 小 需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0334", "chapter": "第二十四章 兒童與青少年糖尿病照護", "stem": "學校環境在學童第 1 型糖尿病照護中扮演關鍵防護網，衛教師協助訂定「個別化學校糖尿病照護計畫（DMMP）」時，下列何項措施「最為必要」？", "options": ["A. 為維持校園安全，所有注射與採血耗材由警衛室保管，低血糖時由導師開立外出條後始得處置", "B. 為防運動碰撞導致感測器脫落受損，建議校方免除該學童所有戶外體育活動與校外教學課程", "C. 要求家長每日到校全程陪讀並施打胰島素，學校教職員因未具醫護執照不承擔任何急救責任", "D. 培訓校護與導師辨識低血糖，允許學童課堂隨時測糖補水，健康中心備妥升糖素並建立通報"], "answer": "D", "explanation": "校園糖尿病醫療照護計畫（DMMP）旨在去標籤化與安全支持：培訓教職員辨識低血糖、允許學童在課堂測糖補糖飲水、備妥升糖素並鼓勵正常融入各項校園活動。", "memory_core": "【校園糖尿病照護 DMMP】：校護導師具備低血糖辨識力 ＋ 常備升糖素 ＋ 允許課堂驗血補糖 ＋ 正常參與校園生活。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0335", "chapter": "第二十四章 兒童與青少年糖尿病照護", "stem": "青少年（Adolescence）糖尿病個案往往面臨叛逆期與同儕壓力，最常發生的照護障礙與心理問題為：", "options": ["A. 因同儕壓力隱瞞病情，或因容貌焦慮刻意漏打胰島素以排糖減重（Diabulimia）引發酮酸中毒", "B. 因缺乏抽象思考能力無法理解注射步驟，需完全依賴學校教師在旁逐項指令操作方能完成注射", "C. 因生長荷爾蒙分泌對胰島素產生高度生理過敏反應，常需頻繁更換廠牌並搭配抗組織胺預防", "D. 因過度依賴家長導致自主管理技能退化，在校園中拒絕自行攜帶糖包或連續葡萄糖監測之載具"], "answer": "A", "explanation": "青少年糖尿病心理障礙常見為同儕認同困擾與體態焦慮，甚至出現刻意少打或漏打胰島素利用糖尿減重之飲食障礙（Diabulimia），導致反覆 DKA。", "memory_core": "【青少年照護警訊 Diabulimia】：同儕壓力隱瞞病情；或為減重「刻意漏打胰島素（Diabulimia）」引發反覆 DKA！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0353", "chapter": "第二十四章 兒童與青少年糖尿病照護", "stem": "第 2 型糖尿病在兒童與青少年族群的發生率逐年上升，針對過重或肥胖且具家族史的高風險兒童，指引建議自幾歲開始進行第 2 型糖尿病篩檢？", "options": ["A. 滿 6 歲（國小入學新生健檢時），具危險因子者之後每年常規抽血篩檢一次", "B. 滿 10 歲（或青春期發育起始時），符合高危條件者之後每 3 年篩檢一次", "C. 滿 15 歲（國中畢業進入高中階段），針對肥胖族群每 5 年安排一次 OGTT", "D. 滿 18 歲（達法定成年年齡時），比照成人健檢指引每 3 年常規追蹤一次"], "answer": "B", "explanation": "兒少第 2 型糖尿病篩檢指引：體重過重（BMI > 85百分位）合併危險因子者，建議自 10 歲或青春期開始每 3 年篩檢一次。", "memory_core": "【兒少第 2 型篩檢時機】：滿 10 歲（或青春期發育啟動）！肥胖合併黑棘皮者每 3 年抽檢空腹血糖/A1c。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0477", "chapter": "第二十四章 兒童與青少年糖尿病照護", "stem": "[共照網考古題 第 50 題] 小華為國小四年級的糖尿病個案，其糖化血色素控制目標，下列何者最適當？", "options": ["A. ＜7%", "B. ＜7.5%", "C. ＜8%", "D. ＜8.5%"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第二十四章 兒童青少年糖尿病指引 (共照網考古 第50題)\n💡 臨床深度題解與選項剖析：\n🔹 題幹資訊：小華為「國小四年級」學童（年齡約 9～10 歲）。\n🔹 依據古典 ADA 兒童照護指引分齡標準（本共照網考古題標準考點）：\n   • 6 歲以下幼兒：A1C 目標為 < 8.5%（防範低血糖對未成熟大腦腦神經發育之永久損傷）。\n   • **6 至 12 歲學童（國小階段）：A1C 控制目標建議為「＜ 8.0%」**。\n   • 13 至 19 歲青少年：A1C 目標建議為 ＜ 7.5%。\n   *(註：現代最新 ADA 指引雖在無嚴重低血糖前提下全面下修至 < 7.0%，但在共照網官方考古題庫歷史判準中，國小學童標準答案定為 < 8.0%)*。\n🔹 故小華最適合之古典指引目標為「＜ 8%」，答案選 C。\n\n📊 兒童青少年糖尿病分齡 HbA1c 控制目標歷史與演進對照：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>年齡族群分期</th><th>古典指引標準 (本題考點)</th><th>考量重點核心</th></tr></thead>\n<tbody>\n<tr><td><b>幼兒期 (&lt; 6 歲)</b></td><td><b>A1c &lt; 8.5%</b></td><td>幼兒無自覺低血糖能力，首重保護大腦神經發育</td></tr>\n<tr><td><b>學童期 (6～12 歲 / 國小)</b></td><td><b>A1c &lt; 8.0% (小華座落此區)</b></td><td>校園活動量大、進餐不穩定，適度放寬防昏迷</td></tr>\n<tr><td><b>青少年期 (13～19 歲)</b></td><td>A1c &lt; 7.5%</td><td>具自我照護與認知能力，逐步對齊成人目標</td></tr>\n</tbody></table></div>", "memory_core": "【第二十四章 必考考點】：國小學童古典 A1c 控制目標：為「＜ 8.0%」！幼兒 < 8.5%、青少年 < 7.5%。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0654", "chapter": "第二十四章 兒童與青少年糖尿病照護", "stem": "[共照網考古題 第 257 題] 下列有關糖尿病衛教的敘述，何者錯誤？", "options": ["A. 衛教兒童時，兒童及家屬應接受同樣的教學訊息，在細節、深度及重點上也盡量相同。", "B. 兒童的衛教，可以多用舉例的衛教方式。", "C. 年齡會影響新資訊的學習，所以對老人衛教時應放慢速度。", "D. 衛教兒童時，應逐步讓兒童負責執行日常的自我照護工作。"], "answer": "A", "explanation": "【正確答案】：A\n📚 2026 核心教材 第二十四章 兒童與家屬分層衛教模式 (共照網考古 第257題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 正確（何者錯誤）。兒童在認知發展、專注力與抽象思維上與成人截然不同；衛教兒童時應採用生動、適齡且操作性的引導，重點在自我照顧認知與配合度；而家屬需要掌握精密的胰島素劑量微調、碳水化合物代換、低血糖急救昇糖素使用等複雜技能。兩者的教學目標、內容深度、細節與重點「絕對不應該完全相同」，強求一致會造成病童認知超載與家屬照護疏漏。\n🔹 (B) 兒童多運用具體生活比喻與實物演示，效果最好。\n🔹 (C) 高齡長者資訊處理速度與記憶力衰退，衛教必須放慢速度、反覆重點確認。\n🔹 (D) 隨著年齡成長，應逐步賦權兒童自主承擔日常驗血糖與記錄等自我管理工作。\n\n📊 兒童與家長糖尿病分層衛教架構比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>衛教對象</th><th>認知特質與學習能力</th><th>衛教深度與核心著重點</th><th>主要負責照護角色</th></tr></thead>\n<tbody>\n<tr><td><b>病童本身 (兒童)</b></td><td>具體形象思維、專注時間較短</td><td>認識身體訊號、辨識低血糖症狀、學習配合打針</td><td>自我感知、逐步建立自主照護技能</td></tr>\n<tr><td><b>主要家屬 (父母)</b></td><td>抽象邏輯、具決策與應變能力</td><td><b>劑量調整規則、醣類精確換算、昇糖素急救、學校照護溝通</b></td><td><b>承擔醫療決策與安全防護網最終責任</b></td></tr>\n</tbody></table></div>", "memory_core": "【第二十四章 必考考點】：兒童與家屬衛教「內容與深度絕不能相同」，應因齡制宜、適齡分層衛教！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0792", "chapter": "第二十四章 兒童與青少年糖尿病照護", "stem": "[共照網考古題 第 455 題] 阻礙糖尿病自我照護的問題，不包括下列哪一項？", "options": ["A. 血糖監測阻礙—害怕疼痛", "B. 用葯阻礙—忘記服藥", "C. 為阻礙找出替代解決辦法", "D. 多活動阻礙—學校未安排體能教學"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 衛教心理與自我照護障礙分析 (共照網考古 第455題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 血糖監測阻礙—害怕疼痛：為典型生理與心理恐懼障礙。\n🔹 (B) 用藥阻礙—忘記服藥：為典型認知與日常生活組織障礙。\n🔹 (C) 正確（不包括下列哪一項）。「為阻礙找出替代解決辦法（Problem-solving coping strategy）」屬於積極克服阻礙的「因應處置對策」與「自我照護賦權歷程」，是衛教介入所追求的正向結果，絕對不是「阻礙自我照護的問題本身」。\n🔹 (D) 活動阻礙—環境與體育課程缺乏支持：屬於客觀環境與學校系統的照護阻礙。\n\n📊 糖尿病患者自我照護阻礙 vs 因應賦權對策矩陣表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>分類向度</th><th>自我照護障礙 (Barrier) 範例</th><th>正面因應處置對策 (Coping Strategy)</th></tr></thead>\n<tbody>\n<tr><td><b>生理與心理層面</b></td><td>害怕針扎疼痛、對併發症產生否認與恐懼</td><td>更換超細短針、導入無痛連續血糖監測 (CGM)</td></tr>\n<tr><td><b>認知與行為層面</b></td><td>複雜用藥頻繁忘記、無法理解食物份量</td><td>使用分裝藥盒、手機鬧鐘提醒、實體食物代換教學</td></tr>\n<tr><td><b>問題解決賦權</b></td><td><b>（無，此為解決障礙的過程）</b></td><td><b>「主動找出替代解決辦法」是衛教成功的正面對策！</b></td></tr>\n</tbody></table></div>", "memory_core": "【第二十四章 必考考點】：「為阻礙找出替代辦法」是解決障礙的對策，不是障礙本身！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0253", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "剛被確診為糖尿病的 28 歲年輕女性，情緒非常憤怒且抗拒哭喊：「我這麼年輕平常又不吃糖，為什麼是我！你們一定驗錯了！」面對處於抗拒與否定期（Denial）的個案，衛教師此時最專業適當的應對為：", "options": ["A. 立即出示晚期視網膜病變失明與洗腎數據，嚴正要求其正視殘酷現實以消除僥倖心態", "B. 先行傾聽並同理其震驚與不甘之情緒，給予心理支持，待情緒平復後再循序進行衛教", "C. 直接打斷個案哭訴並給予未經請求之飲食運動指導，要求即日起嚴格戒除所有精緻糖", "D. 順從個案說法避談檢驗數值，向其承諾糖尿病只要年輕就極可能在數週內自癒無需就醫"], "answer": "B", "explanation": "面對剛確診時的否認與憤怒情緒（庫伯勒-羅斯哀傷階段），此時若進行恐嚇性說教（A）、未經請求之建議灌輸（C）或給予不實承諾（D），均會激化防衛機制或延誤治療。專業衛教應「同理情感、主動傾聽、建立信任」，待情緒穩定後再循序開展衛教。", "memory_core": "【抗拒否定期應對】：同理接納在先、衛教指導在後；切忌恐嚇灌輸，先建立夥伴信任關係。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0292", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "跨理論模式（Transtheoretical Model, TTM）中，若一位肥胖的糖尿病患向衛教師表示：「我現在過得很好，糖尿病是老天註定的，少油少糖的生活太痛苦了，我未來半年內完全沒有任何改變飲食的打算！」請問此個案處於行為改變的哪一個階段？", "options": ["A. 思慮期（Contemplation，意識到問題且考慮於未來半年內採取改變）", "B. 前思慮期（Precontemplation，否認風險且未來半年內完全無意圖改變）", "C. 準備期（Preparation，已開始著手準備且承諾於未來一個月內採取行動）", "D. 維持期（Maintenance，已持續落實具體健康行為改變達六個月以上時間）"], "answer": "B", "explanation": "前思慮期 / 思考前期（Precontemplation）特徵：個案完全未意識到行為問題、否認風險，在「未來 6 個月內完全沒有改變打算」。此時衛教師切忌強行說教或強推具體行動方案，應以建立醫病夥伴關係、同理傾聽、溫和喚起自覺為核心。", "memory_core": "【TTM 階段判別：前思慮期】：未來 6 個月內「完全不想改」！否認抗拒，重在喚醒意識而不強推行動。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0294", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "在行為改變過程中，個案若原本規律運動了一個月，最近因工作加班連續兩週未運動，此現象在行為改變理論中稱為「復發 / 倒退（Relapse）」，衛教師應如何引導個案看待復發？", "options": ["A. 告知行為中斷代表改變嘗試徹底失敗，建議個案先行暫停運動計畫以避免挫折加劇", "B. 嚴肅指出中斷運動反映其自律能力嚴重不足，要求簽署懲處合約以強化後續警惕心", "C. 強調前期建立之代謝效益已全數歸零，必須立即將每日運動量倍增以追回落後進度", "D. 將復發視為螺旋改變歷程之學習反饋，引導個案分析加班誘因並彈性微調行動方案"], "answer": "D", "explanation": "行為改變為螺旋式上升進展（Spiral model）。復發是檢視行為阻礙與高風險情境的契機，衛教師應協助個案卸除罪惡感與非黑即白的挫折思維，聚焦於探討「觸發中斷的情境因應」，重新修訂更富彈性的行動策略。", "memory_core": "【正視行為改變復發】：復發非失敗，是螺旋上升的必經過程！除罪化、分析誘因、重啟行動。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0300", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "心理學上的「認知行為治療（Cognitive Behavioral Therapy, CBT）」技巧應用於糖尿病衛教時，主要的核心著眼點為何？", "options": ["A. 透過深層潛意識催眠治療，使個案遺忘罹患糖尿病之痛苦記憶以消除飲食焦慮感", "B. 採取古典刺激制約反應，於個案攝取高升糖指數甜食時給予嫌惡性電擊感覺刺激", "C. 著重於探究童年早期創傷經驗與家庭原生依附關係，藉以解析個案對醫囑之潛意識抗拒", "D. 辨識導致情緒耗竭與行為棄守之非理性自動化思考，引導以合理彈性信念進行認知重構"], "answer": "D", "explanation": "CBT 的核心理念是「思維決定情緒與行為」。糖尿病患者常陷入全有全無（All-or-nothing）的非理性極端思維（如「吃了一口點心，我的努力就全毀了」），進而誘發沮喪與破罐子破摔的棄守行為。透過辨識自動化負面思考並進行「認知重構（Cognitive Restructuring）」，能協助個案建立彈性健康的應對信念。", "memory_core": "【認知行為治療 CBT 核心】：辨識「全有全無」的非理性負面思考，以合理彈性信念重構，穩定控糖情緒。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0312", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "「糖尿病倦怠（Diabetes Burnout）」是長期罹病者常見的心理狀態，其最顯著的臨床外在特徵為何？", "options": ["A. 長期照護負荷導致身心俱疲，出現消極棄守、停止監測與故意中斷常規用藥", "B. 對血糖數據產生極度強迫性焦慮，每日重複採血量測達數十次且伴隨嚴重失眠", "C. 展現極度狂熱之體能鍛鍊行為，在未諮詢團隊下每日強行進行超負荷劇烈重訓", "D. 嚴格抗拒所有碳水化合物攝取，每日僅依賴極低熱量生酮流質飲食維持生理運作"], "answer": "A", "explanation": "糖尿病倦怠（Diabetes Burnout）指長期面對繁重自我管理與控糖壓力所累積的情緒耗竭與無力感。個案在行為上常表現為「徹底放棄治療」：不再量血糖、不再控制飲食、刻意漏打胰島素或漏服藥物，對健康結果消極放任。衛教團隊應及時辨識並給予心理減負與支持。", "memory_core": "【糖尿病倦怠 Burnout】：照護枯竭後的消極棄守！不量糖、不吃藥、身心俱疲，需減負支持。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0313", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "家庭與社會支持（Social Support）在糖尿病管理中扮演雙面刃的角色。下列何種家庭互動型態往往產生「負向反效果」，反而加劇個案之逆反心理與血糖惡化？", "options": ["A. 家屬主動協助採購新鮮原型食材，並配合個案調整全家為低油高纖飲食模式", "B. 家屬陪同個案共同參與餐後快走運動，並給予真誠口頭肯定以維持良好習慣", "C. 家屬熟練低血糖急救處理流程，於外出活動時隨身協助備妥速效性葡萄糖包", "D. 家屬扮演血糖警察角色，以嚴格監視、審判與罪惡感灌輸對待個案每一次進食"], "answer": "D", "explanation": "家庭成員若充當「血糖警察（Diabetes Police）」，以公開指責、監視、恐嚇（如「你偷吃這個又想洗腎是不是？」）對待個案，會引發個案強烈的羞恥感、自卑與逆反心理，常導致個案轉為私下偷吃、造假血糖日誌或隱匿病情，造成控制更加惡化。", "memory_core": "【拒絕做「血糖警察」】：家庭支持宜陪伴同行，嚴禁審判指責！避免激發羞恥抗拒與隱匿惡行。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0466", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "[共照網考古題 第 39 題] 黃太太得病後非常積極地到處找尋治療方法，請問她屬於歸因理論中那一種導向的人？", "options": ["A. 命運導向", "B. 機會導向", "C. 內在導向", "D. 權威導向"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第二十章 糖尿病病人的行為改變與健康心理調適（第二節 健康信念與自我效能・Rotter 控制信念理論，第 155-165 行）(共照網考古 第38題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 命運導向（外控-機運控握）：認為健康好壞完全由命運或不可抗力決定，病人多呈現消極被動。\n🔹 (B) 機會導向（外控-機運控握）：認為健康全憑機緣巧合，缺乏主動改善生活的恆心。\n🔹 (C) 內在導向（內控者，本題正解）：依據課本第二十章第 155-157 行，Rotter 控制信念理論定義「內控者（Internal Locus of Control）」相信健康結果取決於自身的行為與努力。黃太太堅信透過調整生活與飲食能改善病情並主動求知，為典型內控取向。\n🔹 (D) 權威導向（外控-重要他人控握）：認為健康完全掌握在醫師或權威手中，個人無能為力。", "memory_core": "【第二十章 必考考點】：Rotter 控制信念（第 155 行）——「內控者」相信健康靠自己的努力與生活調整；「外控者」歸因於命運、機運或完全依賴權威！", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0488", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "[共照網考古題 第 64 題] 行為改變課程最重要的目標是", "options": ["A. 灌輸個案正確的減重知識", "B. 改變個案的態度", "C. 引導個案要持之以恆的執行", "D. 指導個案執行的技巧"], "answer": "C", "explanation": "【正確答案】：C\n📚 2026 核心教材 第二十章 糖尿病病人的行為改變與健康心理調適 (共照網考古 第64題)\n💡 臨床深度題解與選項剖析：\n🔹 (A)/(B)/(D) 灌輸知識、改變態度與指導執行技巧皆屬於行為改變歷程中的「手段與過渡步驟」。\n🔹 (C) 正確。慢性病自我管理教育的核心終極目標，不僅是讓個案「開始」採取健康行為，更重要的是引導個案將健康行為內化為生活習慣，能夠「持之以恆的執行（進入維持期 Maintenance，長期維持超過 6 個月以上）」，避免復發故態復萌。\n\n📊 健康行為改變層次推進矩陣：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>發展階段</th><th>介入目標層次</th><th>臨床成效指標</th></tr></thead>\n<tbody>\n<tr><td><b>第一層：認知與知識</b></td><td>傳遞疾病生理與衛教資訊</td><td>個案知道「該做什麼」</td></tr>\n<tr><td><b>第二層：態度與動機</b></td><td>引發健康信念與改變動機</td><td>個案「想要改變」</td></tr>\n<tr><td><b>第三層：技能與執行</b></td><td>指導胰島素注射、驗血糖技巧</td><td>個案「有能力做到」</td></tr>\n<tr><td><b>終極目標：持續維持</b></td><td><b>克服生活阻礙、建立健康習慣</b></td><td><b>「持之以恆的執行，融入終生日常」</b></td></tr>\n</tbody></table></div>", "memory_core": "【第二十章 必考考點】：行為改變課程最重要的終極目標：不是灌輸知識技巧，而是引導個案「持之以恆的執行」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0494", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "[共照網考古題 第 70 題] 下列哪一種敘述不能反應許先生是一名內控導向的糖尿病患者？", "options": ["A. 許先生相信自己能避免合併症的發生", "B. 許先生相信每天持續運動就能降低血糖", "C. 許先生注意到壓力大時血糖較高", "D. 即使我努力控制飲食，血糖也不一定會更好"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十章 糖尿病病人的行為改變與健康心理調適 (共照網考古 第70題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 相信自己能透過主動管理避免併發症，屬於典型的高自我效能與「內在控制導向」。\n🔹 (B) 相信規律運動能直接改善血糖控制，體現「行為與健康結果的因果掌控感」，為內控特徵。\n🔹 (C) 主動覺察生活壓力與血糖波動之關聯並加以調控，屬於內在反思與自我監測能力。\n🔹 (D) 正確。「即使我努力控制飲食，血糖也不一定會更好」表現出無力感、宿命論與習得無助（Learned Helplessness），認為結果受命運或不可抗力支配，屬於典型的「外在控制導向（External Locus of Control）」，無法反映內控特徵。\n\n📊 健康控制信念（Health Locus of Control）特質比較表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>評估維度</th><th>內在控制型 (Internal Locus)</th><th>外在控制型 (External Locus)</th></tr></thead>\n<tbody>\n<tr><td><b>核心信念</b></td><td>「我的健康掌握在自己手中，努力就有成效」</td><td>「血糖好壞看運氣、命運或完全聽醫生的」</td></tr>\n<tr><td><b>行為特徵</b></td><td>主動學習、規律監測血糖、積極調整生活型態</td><td>順從度差、容易放棄、缺乏自我管理動機</td></tr>\n<tr><td><b>遭遇挫折反應</b></td><td>檢討策略（如食物份量、運動強度）、尋求修正</td><td>抱怨無效、產生習得無助感、放棄治療</td></tr>\n<tr><td><b>衛教介入對策</b></td><td>提供自主任務、共同設定進階目標</td><td>建立小步驟成功經驗、強化自我效能感</td></tr>\n</tbody></table></div>", "memory_core": "【第二十章 必考考點】：內控型相信「命運操之在己」；外控型相信「宿命、運氣或完全依賴權威」。自暴自棄或努力無用論為典型外控表徵。", "status": "UNCERTAIN", "cat_type": "SCENARIO", "cat_label": "🧑‍⚕️ 個案情境/換算題", "reason": "本題為早期共照網臨床情境案例或飲食熱量計算題。課本僅記載抽象醫學原則與代換公式，無此特定人物與對話情境，需依臨床實務常理確認。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0607", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "[共照網考古題 第 198 題] 以下何項時機較不適合運用「賦能」式衛教方法", "options": ["A. 病人對生存技巧已經有充分的瞭解", "B. 病人無法對個人健康照護承擔較大的責任", "C. 病人願意主動參與照護的決策", "D. 病人會搜尋資訊，且據以決定如何自我照護"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第二十章 糖尿病病人的行為改變與健康心理調適 (共照網考古 第198題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 病人對基礎生存技巧（驗血糖、防低血糖）已有概念時，適合以賦能激發其內在控制感。\n🔹 (B) 正確。賦能 (Empowerment) 衛教模式的核心哲學，是建立在「病患具有自決權，且願意並有能力承擔自我健康照護的主體責任」之上；當病患處於意識模糊、急性重症、嚴重失智、或「客觀上無法/主觀上拒絕承擔較大責任」時，若強行使用賦能模式會使個案陷入恐慌不知所措，此時應採傳統指導型或由家屬代為管理照護。\n🔹 (C)/(D) 個案主動參與決策、積極搜尋資訊並自主規劃自我照護，正是最適合運用賦能模式的黃金時機。\n\n📊 指導型模式 (Compliance) vs 賦能模式 (Empowerment) 適用情境對照：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>比較維度</th><th>指導從屬型 (Compliance Model)</th><th>賦能自決型 (Empowerment Model)</th></tr></thead>\n<tbody>\n<tr><td><b>照護哲學</b></td><td>專家主導，病人遵從醫囑命令</td><td><b>病患是自己日常生活的專家與最終決策者</b></td></tr>\n<tr><td><b>適合時機</b></td><td><b>急性發病初期、重症急診、失智無自我責任能力者</b></td><td><b>慢性穩定期、具認知能力且願意主動承擔責任者</b></td></tr>\n<tr><td><b>衛教師角色</b></td><td>權威指導者、命令下達者</td><td>引導者 (Facilitator)、夥伴、資源提供者</td></tr>\n</tbody></table></div>", "memory_core": "【第二十章 必考考點】：賦能先決條件是「病患願意且能承擔自我照護責任」；若無法承擔責任則不適合使用賦能模式！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0650", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "[共照網考古題 第 252 題] 關於跨理論模式中行為改變階段的述敘，下列何者正確？", "options": ["A. 改變的過程是依照不同階段呈直線進行", "B. 即使到達維持期，仍可能故態復萌", "C. 沉思期表示最近六個月內並沒有改變的意願", "D. 行動期表示改變後的行為已經持續六個月以上"], "answer": "B", "explanation": "【正確答案】：B\n📚 2026 核心教材 第二十章 糖尿病病人的行為改變與健康心理調適 (共照網考古 第252題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 跨理論模式 (TTM) 明確指出，行為改變是一個「動態、螺旋式 (Spiral)」的前進過程，並非直線單向進行；個案在不同階段間會反覆來回擺盪。\n🔹 (B) 正確。即使個案已經成功進入「維持期 (Maintenance)」（健康行為已持續維持 6 個月以上），當遭遇生活重大壓力事件、社交誘惑或環境劇變時，依然非常有可能「故態復萌 (Relapse)」，退回到先前的意圖期甚至無意圖期。\n🔹 (C) 沉思期/意圖期 (Contemplation) 表示個案「在未來 6 個月內有改變的意圖」，但在當下仍猶豫不決；完全沒有改變意願的是「無意圖期 (Precontemplation)」。\n🔹 (D) 行動期 (Action) 是指改變行為「尚未滿 6 個月」；持續「超過 6 個月以上」即正式進入維持期。\n\n📊 跨理論模式 (TTM) 五大行為階段精準定義速查表：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>行為階段</th><th>時間定義規範</th><th>個案心理行為特徵</th></tr></thead>\n<tbody>\n<tr><td><b>無意圖期</b></td><td>未來 6 個月內<b>完全沒有</b>改變計畫</td><td>否認問題存在、抗拒衛教</td></tr>\n<tr><td><b>沉思/意圖期</b></td><td>預計在<b>未來 6 個月內</b>開始改變</td><td>權衡利弊、內心矛盾掙扎</td></tr>\n<tr><td><b>準備期</b></td><td>打算在<b>未來 1 個月內</b>採取具體行動</td><td>已開始收集資料、做小步嘗試</td></tr>\n<tr><td><b>行動期</b></td><td>已採取具體改變，<b>但未滿 6 個月</b></td><td>需投入大量心力維持、最易遭遇障礙</td></tr>\n<tr><td><b>維持期</b></td><td>新健康習慣<b>已持續 6 個月以上</b></td><td><b>已內化成習慣，但仍可能受應激誘發故態復萌 (Relapse)</b></td></tr>\n</tbody></table></div>", "memory_core": "【第二十章 必考考點】：行為改變是「螺旋式」非直線；即使達到「維持期仍可能故態復萌」！行動期是未滿 6 個月，維持期是超過 6 個月。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0835", "chapter": "第二十章 糖尿病病人的行為改變與健康心理調適", "stem": "[共照網考古題 第 504 題] 有關於糖尿病患心理社會評估和照護的敘述，下列何者是最合適的答案?", "options": ["A. 心理社會篩檢應包括對疾病態度、對醫療處理與結果的期望、情緒或心情、一般和與糖尿病 有關的生活品質、支援和心理病史。", "B. 遵醫囑行為不良時須評估憂鬱、飲食障礙、認知障礙的心理社會問題。", "C. 將心理治療歸到常規照顧是會比等待確認特殊問題或心理狀態惡化時更好。", "D. 以上皆是"], "answer": "D", "explanation": "【正確答案】：D\n📚 2026 核心教材 第二十章 糖尿病病人的行為改變與健康心理調適 (共照網考古 第504題)\n💡 臨床深度題解與選項剖析：\n🔹 (A) 心理社會篩檢必須包含病患對疾病的態度、對治療結果的期望、情緒與心情、生活品質評估及過去精神病史，提供全人照護依據。\n🔹 (B) 當病患出現無故遵醫行為不良（如自行斷藥、不測血糖）時，臨床不應單純責怪病患，必須積極篩檢評估憂鬱症 (Depression)、飲食疾患 (Eating disorders) 或早期認知功能障礙。\n🔹 (C) 將心理照護與心理篩檢常規化整合於日常門診衛教中，成效遠優於等到病患發生嚴重心理危機或精神崩潰時才被動介入。\n🔹 (D) 正確。以上三者皆完全符合 ADA 與台灣衛教學會之心理社會照護指引標準，故選「以上皆是」。\n\n📊 糖尿病心理社會照護 (Psychosocial Care) 臨床處置準則：\n<div class=\"exp-table-wrapper\"><table class=\"exp-table\">\n<thead><tr><th>臨床情境</th><th>指引規範建議</th><th>主要目的</th></tr></thead>\n<tbody>\n<tr><td><b>初診斷與每年常規</b></td><td>例行性心理篩檢（疾病態度、期待、生活品質）</td><td>早期發現心理調適困難與糖尿病痛苦</td></tr>\n<tr><td><b>遵醫囑性急劇惡化時</b></td><td><b>主動評估憂鬱症、飲食失調、認知障礙</b></td><td>找出遵醫不佳之潛在心理病理根源</td></tr>\n<tr><td><b>整體照護模式</b></td><td><b>心理照護常規化 (整合於每位醫療人員日常照護)</b></td><td>去污名化，提供無縫心理社會支持</td></tr>\n</tbody></table></div>", "memory_core": "【第二十章 必考考點】：心理社會評估是常態照護；不遵從醫囑時必篩檢憂鬱與認知障礙；全方位支持選「以上皆是」！", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0019", "chapter": "第二章 預防糖尿病之生活型態策略", "stem": "依據國民健康署規範，對於幾歲以上之成年民眾，成人預防保健服務提供每三年一次免費健康檢查（包含血糖血脂篩檢）？", "options": ["A. 30 歲", "B. 65 歲", "C. 50 歲", "D. 40 歲"], "answer": "D", "explanation": "我國國健署提供 40 歲至 64 歲民眾每 3 年一次免費成人健康檢查；65 歲以上長者每年一次；原住民 55 歲以上亦享每年一次，以早期篩檢代謝症候群與糖尿病。", "memory_core": "【成健篩檢年齡切點】：40~64 歲每 3 年一次；65 歲以上長者每年一次。", "status": "UNCERTAIN", "cat_type": "CLINICAL_SYNONYM", "cat_label": "💡 臨床推理/表格比對", "reason": "考點與正解方向吻合，但選項使用了臨床醫學同義詞（如甲減、MNT）、或出處位於課本 HTML 複雜表格中，系統純文字比對未能字字對齊，請審閱醫學邏輯。", "evidence": "", "baked_passed": false, "baked_comment": ""}, {"id": "CDE-EXAM-0023", "chapter": "第二章 預防糖尿病之生活型態策略", "stem": "下列哪一
